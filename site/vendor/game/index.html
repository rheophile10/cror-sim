`,_m="../schema/replay.schema.json",$m="r17d0123",xm="R17D0123 · Yard helper struck, St-Luc Yard (2017)",Mm={number:"R17D0123",date:"2017-11-08",place:"St-Luc Yard, west side of the diamond, Montréal, Quebec",report:"https://www.tsb.gc.ca/eng/rapports-reports/rail/2017/r17d0123/r17d0123.html"},Sm="st-luc",jm=["cror-live"],Fm="A CP yard crew was flat switching at night in the poorly lit diamond area of St-Luc Yard. The yard helper, back from a brief visit to the mess building, stopped the movement past the 2WL/WL crossover switch, reversed that switch by mistake, reversed the DT24 switch, and told the engineer by radio the movement was lined for DT24 and to back up 15 car lengths. It went over the crossover instead, struck the helper, who stood foul of the crossover track, and collided with two cars on the West Loop after 315 ft at 10 mph. The TSB cited no rule violation.",Tm=["The movement is two GP38-2s and eight empty box cars; the report names the locomotives and the car the helper was found under, not the rest of the cut.","The West Loop end of the crossover is shown already lined for the crossover; the report does not describe it.","The switches are shown secured by locks that the helper unlocks and relocks; the report does not describe how they were secured.","Darkness, lighting, switch identification and fatigue — central to the TSB's analysis — are in the captions only.","The helper's time in the mess building and the earlier moves of the shift are not replayed.","The engineer's repeat of the instruction is assumed; the report does not mention it."],Em=[{atS:0,caption:"St-Luc Yard, Montréal, 8 November 2017, 05:58, dark. Yard assignment FS23 has been flat switching on the west side of the diamond since 05:30. The yard helper left his post for the mess building a few minutes ago; back, he has stopped the movement with its last car about 100 ft north of the 2WL/WL crossover switch — farther than the next move needs.",commands:[{kind:"work",actor:"helper",task:"unlock-switch",target:"x-2wl"}]},{atS:6,caption:"The next move is into DT24, which needs the crossover switch left normal. The helper reverses it: the wrong switch. Nothing on the unlit, unnumbered switch tells him which track it is lined for.",commands:[{kind:"work",actor:"helper",task:"line-switch",target:"x-2wl"}]},{atS:22,commands:[{kind:"work",actor:"helper",task:"lock-switch",target:"x-2wl"}]},{atS:28,caption:"He walks south to the DT24 switch.",commands:[{kind:"walk-to",actor:"helper",track:"2wl-mid",atFt:232,offsetFt:-9}]},{on:{event:"arrived",by:"helper"},commands:[{kind:"work",actor:"helper",task:"unlock-switch",target:"dt24-switch"}]},{on:{event:"unlocked",subject:"dt24-switch"},commands:[{kind:"work",actor:"helper",task:"line-switch",target:"dt24-switch"}]},{on:{event:"turned",subject:"dt24-switch"},caption:"He reverses the DT24 switch.",commands:[{kind:"work",actor:"helper",task:"lock-switch",target:"dt24-switch"}]},{on:{event:"locked",subject:"dt24-switch"},caption:"He steps west of the DT24 switch — clear of the route he believes is lined, but foul of the crossover track — and tells the engineer by radio the movement is lined for DT24: back up 15 car lengths (CROR 104(b): a switch turned must be seen to be properly lined for the route to be used).",commands:[{kind:"walk-to",actor:"helper",track:"stl-crossover",atFt:178,offsetFt:3},{kind:"radio",actor:"helper",to:"engineer",words:"Lined for DT24. Back up fifteen cars.",direction:"back",carLengths:15,linedFor:"dt24"}]},{on:{event:"radio",by:"helper"},caption:"The engineer, at the north end facing north, cannot see the helper or the crossover. He shoves south on the instruction, which lets him go 375 ft before he must stop for want of further word (CROR 123.2).",commands:[{kind:"radio",actor:"engineer",to:"helper",words:"Back up fifteen cars, lined for DT24.",direction:"back",carLengths:15},{kind:"set-reverser",actor:"engineer",train:"FS23",to:"reverse"},{kind:"set-independent-brake",actor:"engineer",train:"FS23",application:0},{kind:"set-throttle",actor:"engineer",train:"FS23",notch:1}]},{on:{near:{vehicle:"CP 215379",track:"stl-crossover",atFt:125,withinFt:30}},commands:[{kind:"set-throttle",actor:"engineer",train:"FS23",notch:0}]},{on:{event:"injured",by:"helper"},caption:"The movement takes the crossover, not DT24. It strikes the helper where he stands foul of the crossover track."},{on:{event:"struck",subject:"CP 215379"},caption:"It collides with INEX 145 on the West Loop, about 315 ft from where it started. The engineer stops.",commands:[{kind:"set-throttle",actor:"engineer",train:"FS23",notch:0},{kind:"set-independent-brake",actor:"engineer",train:"FS23",application:1}]},{atS:260,caption:"Unable to reach the helper by radio, the foreman walks the movement and finds him under car CP 215379. The TSB found that the task interruption and likely fatigue led to the wrong switch, that the error was not caught, and that CP had not assessed the risks when switching moved to the diamond in 2012."}],Rm={endS:270,events:[{kind:"turned",subject:"x-2wl"},{kind:"radio"},{kind:"injured"}],violations:[{pack:"cror-live",ref:"104(b)",subject:"FS23"}]},Om={$schema:_m,id:$m,name:xm,incident:Mm,level:Sm,packs:jm,summary:Fm,simplifications:Tm,cues:Em,expect:Rm},Cm="../schema/replay.schema.json",Am="r21d0001",qm="R21D0001 · Assistant conductor thrown from a car by slack action, Montréal (2021)",Nm={number:"R21D0001",date:"2021-01-06",place:"Track PD06, Pointe-Saint-Charles Yard, Mile 1.9 Montreal Subdivision, Montréal, Quebec",report:"https://www.tsb.gc.ca/eng/rapports-reports/rail/2021/r21d0001/r21d0001.html"},Lm="pointe-st-charles",Im=["cror-live","goi-live"],Pm="A CN yard assignment was shoving 21 empty covered hoppers west on the Port of Montreal spur at about 10 mph. The assistant conductor rode the leading car to protect the move. Rather than stop and walk through a restricted-clearance tunnel, he moved to the car's end ladder and rode through. Near signal 410RC the engineer stopped with the independent brake alone. The slack ran out with a jerk of over 2 g at the end of the leading car, and the assistant conductor lost his grip and fell in front of it. He was fatally injured.",Dm=["The second locomotive and the car numbers other than COER 353680 are invented; the train's weight and length match the report.","Signal 410RC, the Bridge Street crossing and the rail traffic controller are not modelled; they appear in the captions.","The engineer's throttle handling before the stop is not in the report; it is chosen to shove at about 10 mph.","A rider lets go when the car's acceleration averaged over a sixtieth of a second exceeds 2 g, the figure from the re-enactment. The jerk itself is the simulation's slack action, not tuned.","The jerk comes about 3 seconds after the independent brake is applied, where the report puts it shortly before the stop about 15 seconds later: the game's independent brake takes full effect at once, while a real locomotive's brake cylinder builds up over several seconds. The train stops about 490 ft from the signal (report: about 400 ft)."],Wm=[{atS:0,caption:"Montréal, 6 January 2021, about 12:25, −1 °C. Yard assignment YPC011 has just coupled 21 empty covered hoppers and stopped 20 seconds at the Bridge Street crossing. It will shove west on track PD06 toward signal 410RC, the cars leading. The assistant conductor gets on the side ladder at the leading end of the leading car, COER 353680, to protect the move.",commands:[{kind:"work",actor:"assistant",task:"board",target:"COER 353680@behind"}]},{atS:6,caption:"While the train backs up, the conductor calls the rail traffic controller for the signal on his personal cellphone, though the railway radio is working (CROR A(xii)).",commands:[{kind:"set-reverser",actor:"engineer",train:"YPC011",to:"reverse"},{kind:"set-independent-brake",actor:"engineer",train:"YPC011",application:0},{kind:"set-throttle",actor:"engineer",train:"YPC011",notch:3},{kind:"radio",actor:"conductor",to:"RTC",words:"YPC011 on PD06, requesting 410RC.",via:"cellphone"}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:2150,withinFt:25}},commands:[{kind:"set-throttle",actor:"engineer",train:"YPC011",notch:1}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:1990,withinFt:25}},commands:[{kind:"set-throttle",actor:"engineer",train:"YPC011",notch:0}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:1900,withinFt:25}},caption:"Ahead is the tunnel under the Victoria Bridge approach, marked with restricted clearance signs. The rules require the train to stop so he can get off and walk through (CROR D). Instead he moves to the end ladder of the car, to stay clear of the tunnel wall — contrary to CN's instruction to ride the side ladder (GOI 8.12.4).",commands:[{kind:"work",actor:"assistant",task:"ride-end-ladder",target:"COER 353680@behind"}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:1600,withinFt:25}},commands:[{kind:"set-throttle",actor:"engineer",train:"YPC011",notch:1}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:1350,withinFt:25}},commands:[{kind:"set-throttle",actor:"engineer",train:"YPC011",notch:0}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:1150,withinFt:25}},caption:"Through the tunnel, he tells the engineer by radio that 410RC shows Medium to Stop, and that there are 15 cars to go. The engineer does not repeat the distance (CROR 123(c)).",commands:[{kind:"radio",actor:"assistant",to:"engineer",words:"410RC medium to stop. Fifteen cars.",direction:"back",carLengths:15}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:800,withinFt:25}},caption:"8 cars. Again the engineer does not repeat it.",commands:[{kind:"radio",actor:"assistant",to:"engineer",words:"Eight cars.",direction:"back",carLengths:8}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:720,withinFt:25}},commands:[{kind:"set-throttle",actor:"engineer",train:"YPC011",notch:1}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:620,withinFt:25}},caption:"4 cars. The engineer answers that he is stopping now, before the locomotives enter the tunnel, and stops with the independent brake alone, without modulating it.",commands:[{kind:"radio",actor:"assistant",to:"engineer",words:"Four cars.",direction:"back",carLengths:4},{kind:"radio",actor:"engineer",to:"assistant",words:"Four cars. Stopping here.",carLengths:4,direction:"back"},{kind:"set-throttle",actor:"engineer",train:"YPC011",notch:0},{kind:"set-independent-brake",actor:"engineer",train:"YPC011",application:1}]},{on:{event:"fell",by:"assistant"},caption:"The locomotives brake; the cars ahead of them run on until the slack stretches out, and the jerk reaches the far end of the train. The assistant conductor, on the end ladder, loses his grip and falls onto the track in front of the car."},{on:{event:"injured",by:"assistant"},caption:"The car runs over him before the train stops. He is fatally injured."},{atS:190,caption:"A re-enactment the next day measured more than 2 g at the end of the leading car. CN warned employees about slack action from heavy use of the independent brake, and required movements on the spur to be led by a locomotive or, when shoving, a caboose. Transport Canada found CN non-compliant with the rules on riding equipment."}],Gm={endS:200,events:[{kind:"changed-ladder",subject:"COER 353680@behind"},{kind:"fell"},{kind:"injured"}],violations:[{pack:"cror-live",ref:"A(xii)",subject:"conductor"},{pack:"cror-live",ref:"D",subject:"assistant"},{pack:"goi-live",ref:"8.12.4",subject:"assistant"},{pack:"cror-live",ref:"123(c)",subject:"YPC011"}]},zm={$schema:Cm,id:Am,name:qm,incident:Nm,level:Lm,packs:Im,summary:Pm,simplifications:Dm,cues:Wm,expect:Gm},Bm="../schema/replay.schema.json",Hm="r94c0010",Ym="R94C0010 · Running switch into a warehouse door, Calgary (1994)",Km={number:"R94C0010",date:"1994-01-24",place:"Federated Cooperatives spur, Mile 124.21 Three Hills Subdivision, Calgary, Alberta",report:"https://www.tsb.gc.ca/eng/rapports-reports/rail/1994/r94c0010/r94c0010.html"},Um="calgary",Vm=["cror-live","goi-live"],Xm="A CN yard crew delivered a loaded refrigerator car to a warehouse by running switch: cut off in motion behind the locomotives, it rolled onto a spur that curves 14 degrees and falls up to 1.54% toward the warehouse door, with the foreman riding it to control it by hand brake. He had only tightened the chain to check the brake, which was worn and ineffective. The car ran away down the grade and broke through the door, injuring two contract workers inside.",Jm=["The foreman rides the car from the start and pulls the pin from it; in the report he pulled it from the locomotive after a failed first attempt and then crossed onto the car.","The report does not describe preparing the car; here its angle cocks are closed, hoses parted and air bled before the move, as a free-rolling car needs.","Radio is not modelled; the foreman's call appears as a caption.","The locomotives do not follow the car onto the spur.","The hand brake is modelled as giving 10% of its force. The report says only that it was ineffective.","The second switch 240 ft from the door, the warehouse building and the compressor are not modelled.","Past the door the car runs on to the end of the warehouse track and derails there. The report records no damage to railway equipment, so the real car stopped short of that; it does not say how."],Qm=[{atS:0,caption:"Calgary, 24 January 1994, 08:20, −7 °C. CN's 0800 yard assignment — two locomotives and loaded refrigerator car FGMR 12042 — has come up the Three Hills Subdivision to spot the car inside the Federated Cooperatives warehouse. The crew means to do it by running switch, letting the car roll down the spur under hand brake control. The car is prepared to roll free: angle cocks closed, hoses parted, its air bled off.",commands:[{kind:"work",actor:"foreman",task:"close-cock",target:"CN 7002@behind"}]},{atS:2,commands:[{kind:"work",actor:"yardman",task:"unlock-switch",target:"spur-switch"}]},{atS:8,caption:"The yardman unlocks the spur switch and lines it back and forth to be sure it works, then leaves it normal.",commands:[{kind:"work",actor:"yardman",task:"line-switch",target:"spur-switch"}]},{atS:24,commands:[{kind:"work",actor:"yardman",task:"line-switch",target:"spur-switch"}]},{atS:6,commands:[{kind:"work",actor:"foreman",task:"close-cock",target:"FGMR 12042@ahead"}]},{atS:12,commands:[{kind:"work",actor:"foreman",task:"disconnect-hoses",target:"CN 7002|FGMR 12042"}]},{atS:21,commands:[{kind:"work",actor:"foreman",task:"bleed",target:"FGMR 12042"}]},{atS:52,commands:[{kind:"work",actor:"foreman",task:"board",target:"FGMR 12042@ahead"}]},{atS:56,caption:"The foreman rides the car and checks its hand brake by turning the wheel only until the chain is tight. He neither hears the shoes nor feels the car hold, and releases it (CROR 113.6(a) requires the hand brake to be verified in working order).",commands:[{kind:"work",actor:"foreman",task:"apply-handbrake",target:"FGMR 12042"}]},{atS:88,commands:[{kind:"work",actor:"foreman",task:"release-handbrake",target:"FGMR 12042"}]},{atS:110,caption:"The engineer starts north toward the spur switch, the car trailing. The yardman waits at the switch, which he has already unlocked and tried.",commands:[{kind:"set-reverser",actor:"engineer",train:"0800",to:"forward"},{kind:"set-independent-brake",actor:"engineer",train:"0800",application:0},{kind:"set-throttle",actor:"engineer",train:"0800",notch:1}]},{atS:127,commands:[{kind:"set-throttle",actor:"engineer",train:"0800",notch:0}]},{on:{near:{vehicle:"FGMR 12042",track:"three-hills-south",atFt:1560,withinFt:350}},caption:"About 250 ft short of the switch, at walking pace, the foreman pulls the pin: a running switch.",commands:[{kind:"work",actor:"foreman",task:"uncouple",target:"CN 7002|FGMR 12042"}]},{on:{event:"uncoupled"},caption:"The engineer opens the throttle to run the locomotives clear, and the yardman lines the switch for the spur behind them.",commands:[{kind:"set-throttle",actor:"engineer",train:"0800",notch:4},{kind:"work",actor:"yardman",task:"line-switch",target:"spur-switch"}]},{on:{near:{vehicle:"CN 7002",track:"three-hills-north",atFt:250,withinFt:60}},commands:[{kind:"set-throttle",actor:"engineer",train:"0800",notch:0},{kind:"set-independent-brake",actor:"engineer",train:"0800",application:1}]},{on:{near:{vehicle:"FGMR 12042",track:"federated-spur",atFt:40,withinFt:30}},caption:"The car follows onto the spur. The foreman applies the hand brake on the switch — applying a hand brake during a running switch, or to a free-rolling car, is prohibited at CN (CROR 113.6(a), GOI 8.12.4), and the car is rolling free toward a door with no air brakes (GOI 7.8).",commands:[{kind:"work",actor:"foreman",task:"apply-handbrake",target:"FGMR 12042"}]},{on:{near:{vehicle:"FGMR 12042",track:"federated-spur",atFt:1521,withinFt:260}},caption:"The hand brake does nothing. The car gains speed down the 1.54% grade through the 14-degree curve. The foreman radios that the brake is not responding, and gets off just short of the door, while it is still moving (GOI 8.12.5).",commands:[{kind:"get-down",actor:"foreman"}]},{on:{event:"broke-through-door",subject:"warehouse-door"},caption:"The car breaks through the warehouse door. Pieces of it strike the two contract workers on the other side: one is slightly hurt, the other seriously."},{atS:295,caption:"Findings: the crew did not apply the instruction requiring air brakes in service when switching toward doors; the hand brake was not verified before the running switch. It was out of adjustment, with badly worn and non-standard parts. The running switch was this spur's established practice."}],Zm={endS:300,events:[{kind:"uncoupled"},{kind:"handbrake-applied",subject:"FGMR 12042"},{kind:"broke-through-door",subject:"warehouse-door"},{kind:"injured",subject:"warehouse-door"}],violations:[{pack:"cror-live",ref:"113.6(a)",subject:"cut-FGMR 12042"},{pack:"goi-live",ref:"7.8",subject:"cut-FGMR 12042"},{pack:"goi-live",ref:"8.12.4",subject:"foreman"},{pack:"goi-live",ref:"8.12.5",subject:"foreman"}]},ep={$schema:Bm,id:Hm,name:Ym,incident:Km,level:Um,packs:Vm,summary:Xm,simplifications:Jm,cues:Qm,expect:Zm},tp="../schema/replay.schema.json",np="r95m0072",op="R95M0072 · Runaway cars, Edmundston (1995)",ap={number:"R95M0072",date:"1995-12-14",place:"Edmundston Yard, track EA-34, New Brunswick",report:"https://www.tsb.gc.ca/eng/rapports-reports/rail/1995/r95m0072/r95m0072.html"},sp="edmundston",rp=["cror-live","goi-live"],ip="The conductor of train 130 closed the angle cocks between the locomotives and the cars before the full service application had finished, uncoupled, left the lead car's angle cock closed and applied no hand brakes. The air brakes released. The cars rolled west down the 0.25% grade, forced the dual control switch and stopped with about 15 cars on the main track.",cp=["Equipment is generic: GP38-2 locomotives, 110-tonne loads and 30-tonne empties with AB control valves.","The brake pipe, reservoirs and cylinders use the game's leakage rates, not measured ones; the cars break away after about 38 minutes where the report says about 50.","Snow, cold and the fuel stand are not modelled; the locomotives simply pull ahead.","Signals, the RTC, Rule 564 and train 132 are not modelled; they appear in the captions only."],dp=[{atS:0,caption:"Edmundston Yard, 14 December 1995, about 20:30. Light snow, −15 °C. Train 130 — three locomotives, 60 loads, 6 empties — stands on yard track EA-34 with the brakes applied. EA-34 falls 0.25% westward to a dual control switch onto the Pelletier Subdivision main track."},{atS:1,caption:"The train has been pulled ahead. The engineer re-applies the brakes in full service; the reduction travels back through 66 cars.",commands:[{kind:"set-automatic-brake",actor:"engineer",train:"130",application:1}]},{atS:3,caption:"The conductor closes the angle cock on the trailing locomotive — before the full service applicatio
