`,of="../schema/replay.schema.json",af="r00v0206",sf="R00V0206 · A TOP issued behind the wrong train, Basque (2000)",rf={number:"R00V0206",date:"2000-12-13",place:"Mile 65.05, CN Ashcroft Subdivision, British Columbia",report:"https://www.tsb.gc.ca/eng/rapports-reports/rail/2000/r00v0206/r00v0206.html"},cf="basque",df=["cror-live"],lf="A CN maintenance-of-way crew had waited most of the morning at a public crossing at Mile 65.2 for track time. The RTC had told the foreman to wait for three trains; a fourth, CP 401, was routed onto the Ashcroft Subdivision at Coho at 1220 and overlooked. When CP 857 passed the crossing at 1224 the RTC issued the foreman a TOP between Signal 577 at Basque and Signal 677 at Martel — limits CP 401 was already inside, running west on clear signals with no instruction to protect against the foreman. The crew put their Hi-rail truck on the track and proceeded east. Hi-rail equipment does not shunt the track circuit, so the signal system never saw it. The foreman stopped the truck when the train came round the curve and all four crew members ran clear; CP 401 struck it at Mile 65.05 at about 30 mph. Nobody was hurt; the truck was destroyed.",hf=["The train is two locomotives and fifteen loaded cars, as the report gives, on a ten-mile track modelled as a single curve; the real profile and curvature between Basque and Martel are not known to this game.","The three trains the crew waited for are not modelled: the replay opens a minute before the TOP is issued, with CP 401 already at Mile 61 on a clear signal.","Sighting distance is not modelled. The engineer's emergency application is a cue placed where the report puts it — about 400 ft from the truck — rather than the result of a line of sight round the curve.","The train strikes at about 31 mph against the report's 30; its speed comes from the modelled grade and the throttle it was given, not from a scripted number.","The report cites CROR 49, 49.2, 567.1, 618 and 823 besides 311 and 618.1; only 618.1 is in the rule capture this game judges against, and only it is judged here."],uf=[{atS:0,caption:"CN Ashcroft Subdivision, British Columbia, 13 December 2000, about 1226. Cloudy, −14 °C, good visibility. Westward CP 401 — two locomotives and fifteen loaded container cars, 3,250 ft and 2,380 tons — left Basque on a clear signal and is passing Mile 61 at 38 mph. Four miles ahead a maintenance-of-way crew is waiting at a public crossing at Mile 65.2 for track time."},{atS:60,caption:"1227. The RTC issues the foreman a track occupancy permit between Signal 577 at Basque and Signal 677 at Martel, behind the train that has just passed him. CP 401 is inside those limits and has not been restricted to protect against the foreman — CROR 618.1.",commands:[{kind:"issue-authority",actor:"RTC",authority:{id:"top-1227",kind:"top",to:"hi-rail",foreman:"Track Foreman",fromMile:57.7,toMile:67.7,work:!0,text:"TOP to Track Foreman: main track between Signal 577 at Basque and Signal 677 at Martel, behind CP 9665 West which left Mile 65.2 at 1224. Call the RTC before 1310."}}]},{atS:75,caption:"The foreman copies it, repeats it, and the RTC makes it complete. All four crew members read and initial it. Nothing in it is wrong except that the block is not clear."},{atS:250,caption:"The crew put the Hi-rail truck on the main track at the crossing at Mile 65.2 and proceed east. Hi-rail equipment does not shunt the track circuit: the signal system cannot see them, which is why a track unit is protected by authority instead.",commands:[{kind:"set-reverser",actor:"foreman",train:"hi-rail",to:"forward"},{kind:"set-independent-brake",actor:"foreman",train:"hi-rail",application:0},{kind:"set-throttle",actor:"foreman",train:"hi-rail",notch:1}]},{atS:297,caption:"Eight hundred feet on, a westward freight comes round the curve ahead. The foreman stops the truck.",commands:[{kind:"set-throttle",actor:"foreman",train:"hi-rail",notch:0},{kind:"set-independent-brake",actor:"foreman",train:"hi-rail",application:1}]},{atS:312,caption:"All four crew members get out of the truck and run clear of the track.",commands:[{kind:"get-down",actor:"foreman"}]},{atS:419,caption:"The train crew see the truck. The engineer puts the brakes in emergency, about four hundred feet short of it.",commands:[{kind:"emergency-brake",actor:"engineer",train:"401"}]},{atS:430,caption:"1231. CP 401 strikes the stationary Hi-rail truck at Mile 65.05 at about 30 mph. The truck is destroyed; the locomotive is undamaged; nobody is hurt, because the crew were out of it and clear."},{atS:470,caption:"The safety defences did not fail in the field. They failed when a train already in the block was overlooked, and a TOP was issued behind the wrong one."}],mf={endS:500,events:[{kind:"authority-issued",subject:"hi-rail"},{kind:"emergency-brake",subject:"401"},{kind:"collision",subject:"CP 9101"}],violations:[{pack:"cror-live",ref:"618.1",subject:"401"}]},pf={$schema:of,id:af,name:sf,incident:rf,level:cf,packs:df,summary:lf,simplifications:hf,cues:uf,expect:mf},gf="../schema/replay.schema.json",ff="r02c0022",kf="R02C0022 · Restricted speed round a curve, Glenogle (2002)",bf={number:"R02C0022",date:"2002-03-24",place:"Mile 26.9, Mountain Subdivision, near Glenogle, British Columbia",report:"https://www.tsb.gc.ca/eng/rapports-reports/rail/2002/r02c0022/r02c0022.html"},vf="glenogle",yf=["cror-live"],wf="CP train 671 — three locomotives and 126 loads of potash, 17,929 tons and 6,142 ft — was running west down the Mountain Subdivision on a steep descending grade. At Signal 249 it got a Restricting indication. The RTC had set up a meet at Glenogle for three westward trains and one eastward, but train 671 had not been told of it; the crew took the Restricting for the slide detector fence at Mile 26.7 and reduced to 17 mph for it. Having passed the fence without seeing anything, they continued at that speed round a five-degree right-hand curve where the forward sight distance was about 420 ft. The rear of train 177 stood on the main track to Mile 26.9. The conductor saw it; both crew members applied the brakes in emergency; the train struck it at 1215. Two locomotives and three cars derailed and the locomotive engineer was hurt. To stop within one-half the range of vision — 210 ft — the TSB calculated the train could not have exceeded 9.5 mph.",$f=["Only the rear twelve cars of train 177 are modelled, standing on the main track; the Glenogle siding, its head end, and the other two trains in the meet are not.","The grade is modelled as a uniform descent of about 1.9 per cent; the report gives 2.20 to 0.95 per cent with numerous changes between Signal 249 and the point of derailment.","The curve is 700 ft of five degrees rather than the whole curve, placed so the forward sight distance at the point of collision is 410 ft against the report's 420.","Sighting is not simulated: the emergency application is a cue placed at the moment the game's own range-of-vision calculation first puts the standing train in sight.","The report cites CROR 426, 85 and 90; of these only the Restricting indication, CROR 436, is in the rule capture this game judges against.","Ten seconds pass between the conductor picking the standing train out of the rock cut and the brakes going into emergency — noticing it, calling it, and both crew members acting. The report describes the sequence but does not time it.","This simulation's emergency brake develops faster than a real 6,142-ft train's: it stops in about 230 ft from 15 mph where the TSB calculated 540 ft at 17 mph. The stopping distance the rules judge against is calibrated to the simulation, so restricted speed here is faster than restricted speed was that day."],_f=[{atS:0,caption:"Mountain Subdivision, British Columbia, 24 March 2002, about 1213. Train 671 is running west down a steep descending grade under a Restricting indication from Signal 249, reduced to 17 mph for the slide detector fence at Mile 26.7. The crew have not been told of the meet at Glenogle; they take the Restricting for a slide. Restricted speed is a speed that permits stopping within one-half the range of vision, and in no case more than fifteen. At 17 mph the movement is already over it."},{atS:60,caption:"Mile 26.55, 14 mph. The track ahead begins to bend: the range of vision is down to 1,444 ft, half of it is 722 ft, and the train needs 202 ft to stop. Within restricted speed again, with room to spare."},{atS:100,caption:"Mile 26.71, 15 mph. Past the slide detector fence, nothing seen, and the crew carry on. The curve has closed the view to 640 ft — half of it is 320 ft, and the train needs 208 ft. Still inside it, but the margin is going."},{atS:124,caption:"Mile 26.82, on the curve. The range of vision is 410 ft; half of it is 205 ft; the train is making 15.5 mph and needs 224 ft to stop. From here the movement is not at restricted speed, whatever the speedometer says, and CROR 436 is broken. The TSB calculated that on this curve the train could not have exceeded 9.5 mph."},{atS:131,caption:"The conductor, on the left-hand side of the cab, picks out something standing where the rock cut ends — 409 ft ahead, the geometric limit of what can be seen round this curve — and calls it to the locomotive engineer."},{atS:141,caption:"Both crew members put the brakes in emergency. By now the rear of train 177 is 150 ft ahead, and the train needs better than 200 ft to stop.",commands:[{kind:"emergency-brake",actor:"engineer",train:"671"}]},{atS:150,caption:"1215. Train 671 strikes the rear of train 177 at Mile 26.9 at 11 mph. Two locomotives and three cars derail; the last car ends up down the embankment with its east end in the Kicking Horse River. The locomotive engineer is hurt."},{atS:190,caption:"The signal told them what to do — proceed at restricted speed — and restricted speed on that curve was walking pace. What it could not tell them was why, and nothing else did."}],Mf={endS:210,events:[{kind:"emergency-brake",subject:"671"},{kind:"collision"}],violations:[{pack:"cror-live",ref:"436",subject:"671"}]},xf={$schema:gf,id:ff,name:kf,incident:bf,level:vf,packs:yf,summary:wf,simplifications:$f,cues:_f,expect:Mf},Sf="../schema/replay.schema.json",jf="r15v0046",Tf="R15V0046 · Five miles into OCS without a clearance, Cranbrook (2015)",Cf={number:"R15V0046",date:"2015-03-11",place:"Mile 103, Cranbrook Subdivision, Cranbrook, British Columbia",report:"https://www.tsb.gc.ca/eng/rapports-reports/rail/2015/r15v0046/r15v0046.html"},Ff="cranbrook",Of=["cror-live"],Rf='At about 0130 a CP management crew running train 672-024 east from Kingsgate had copied OCS clearances as far as the beginning of the cautionary limits near the west switch at Cranbrook Yard. Approaching Cranbrook they were told by radio by an assistant trainmaster at Fort Steele that they were "OK on the main track through Cranbrook, all the way to Fort Steele". Neither crew member was familiar with the territory; they consulted the Moyie Subdivision time table but not the Cranbrook Subdivision one, where the beginning of OCS limits is defined. Believing the cautionary limits ran to Fort Steele, they passed the east cautionary limit sign at Mile 107 and ran five miles into OCS territory with no clearance. The RTC asked their location near Mile 103 and instructed them to stop; they made a controlled stop just west of Mile 102. There were no conflicting movements.',Ef=["The train is two locomotives and twelve cars on a straight, gently falling main track; the report gives neither the consist nor the profile east of Cranbrook.","Only the last three miles of cautionary limits and the first five miles of OCS are modelled, as two tracks joined end to end where the east cautionary limit sign stands at Mile 107.","The report cites CROR 94 and 105(c) — the reduced speed required within cautionary limits. Neither is in the rule capture this game judges against, so neither is judged here; what is judged is CROR 302, the clearance required to be on OCS main track, which is the substance of the occurrence.","The crew's mistaken belief is not simulated as a belief: the assistant trainmaster's transmission is on the radio and in the log, and the movement simply carries on past the sign, as it did."],Af=[{atS:0,caption:"Cranbrook Subdivision, British Columbia, 11 March 2015, about 0115. Train 672 is running east at 15 mph through the cautionary limits at Cranbrook, where no clearance is required. The clearance the crew copied at Swansea ended at the beginning of these limits. Three miles ahead, at Mile 107, the east cautionary limit sign marks the end of them."},{atS:20,caption:"Neither crew member is familiar with this territory. They have consulted the time table for the Moyie Subdivision, but not the one for the Cranbrook Subdivision, where the beginning of OCS limits is defined."},{atS:150,caption:'The assistant trainmaster at Fort Steele tells them by radio that they are "OK on the main track through Cranbrook, all the way to Fort Steele". He means they will not be held; the crew hear that the cautionary limits run all the way there.',commands:[{kind:"radio",actor:"trainmaster",to:"conductor",words:"672, you are OK on the main track through Cranbrook, all the way to Fort Steele.",via:"radio"}]},{atS:170,caption:"Believing no further authority is needed, the crew do not call the RTC for a clearance."},{atS:350,caption:"Mile 107. The train passes the east cautionary limit sign. Beyond it the main track is OCS, and a movement must hold a clearance to be on it — CROR 302. The train holds none."},{atS:420,caption:"A mile into OCS territory at 35 mph, with nothing in hand. There is no conflicting movement, which is the only reason this is an incident and not a collision."},{atS:700,caption:"Near Mile 103 the RTC asks the crew for their location, realises where they are, and instructs them to stop at once.",commands:[{kind:"radio",actor:"RTC",to:"conductor",words:"672, give me your location. — You are in OCS limits without authority. Stop your train.",via:"radio"}]},{atS:730,caption:"The crew make a controlled stop from 41 mph.",commands:[{kind:"set-throttle",actor:"engineer",train:"672",notch:0},{kind:"set-automatic-brake",actor:"engineer",train:"672",application:.15}]},{atS:865,caption:"Stopped just west of Mile 102, five miles inside OCS territory. An hour later the crew were issued a clearance to Riley, at Mile 100.8, where they were relieved from duty."}],qf={endS:880,events:[{kind:"radio"},{kind:"automatic-brake",subject:"672"}],violations:[{pack:"cror-live",ref:"302",subject:"672"}]},Nf={$schema:Sf,id:jf,name:Tf,incident:Cf,level:Ff,packs:Of,summary:Rf,simplifications:Ef,cues:Af,expect:qf},Lf="../schema/replay.schema.json",Pf="r17d0123",If="R17D0123 · Yard helper struck, St-Luc Yard (2017)",Bf={number:"R17D0123",date:"2017-11-08",place:"St-Luc Yard, west side of the diamond, Montréal, Quebec",report:"https://www.tsb.gc.ca/eng/rapports-reports/rail/2017/r17d0123/r17d0123.html"},Df="st-luc",Gf=["cror-live"],Wf="A CP yard crew was flat switching at night in the poorly lit diamond area of St-Luc Yard. The yard helper, back from a brief visit to the mess building, stopped the movement past the 2WL/WL crossover switch, reversed that switch by mistake, reversed the DT24 switch, and told the engineer by radio the movement was lined for DT24 and to back up 15 car lengths. It went over the crossover instead, struck the helper, who stood foul of the crossover track, and collided with two cars on the West Loop after 315 ft at 10 mph. The TSB cited no rule violation.",zf=["The movement is two GP38-2s and eight empty box cars; the report names the locomotives and the car the helper was found under, not the rest of the cut.","The West Loop end of the crossover is shown already lined for the crossover; the report does not describe it.","The switches are shown secured by locks that the helper unlocks and relocks; the report does not describe how they were secured.","Darkness, lighting, switch identification and fatigue — central to the TSB's analysis — are in the captions only.","The helper's time in the mess building and the earlier moves of the shift are not replayed.","The engineer's repeat of the instruction is assumed; the report does not mention it."],Hf=[{atS:0,caption:"St-Luc Yard, Montréal, 8 November 2017, 05:58, dark. Yard assignment FS23 has been flat switching on the west side of the diamond since 05:30. The yard helper left his post for the mess building a few minutes ago; back, he has stopped the movement with its last car about 100 ft north of the 2WL/WL crossover switch — farther than the next move needs.",commands:[{kind:"work",actor:"helper",task:"unlock-switch",target:"x-2wl"}]},{atS:6,caption:"The next move is into DT24, which needs the crossover switch left normal. The helper reverses it: the wrong switch. Nothing on the unlit, unnumbered switch tells him which track it is lined for.",commands:[{kind:"work",actor:"helper",task:"line-switch",target:"x-2wl"}]},{atS:22,commands:[{kind:"work",actor:"helper",task:"lock-switch",target:"x-2wl"}]},{atS:28,caption:"He walks south to the DT24 switch.",commands:[{kind:"walk-to",actor:"helper",track:"2wl-mid",atFt:232,offsetFt:-9}]},{on:{event:"arrived",by:"helper"},commands:[{kind:"work",actor:"helper",task:"unlock-switch",target:"dt24-switch"}]},{on:{event:"unlocked",subject:"dt24-switch"},commands:[{kind:"work",actor:"helper",task:"line-switch",target:"dt24-switch"}]},{on:{event:"turned",subject:"dt24-switch"},caption:"He reverses the DT24 switch.",commands:[{kind:"work",actor:"helper",task:"lock-switch",target:"dt24-switch"}]},{on:{event:"locked",subject:"dt24-switch"},caption:"He steps west of the DT24 switch — clear of the route he believes is lined, but foul of the crossover track — and tells the engineer by radio the movement is lined for DT24: back up 15 car lengths (CROR 104(b): a switch turned must be seen to be properly lined for the route to be used).",commands:[{kind:"walk-to",actor:"helper",track:"stl-crossover",atFt:178,offsetFt:3},{kind:"radio",actor:"helper",to:"engineer",words:"Lined for DT24. Back up fifteen cars.",direction:"back",carLengths:15,linedFor:"dt24"}]},{on:{event:"radio",by:"helper"},caption:"The engineer, at the north end facing north, cannot see the helper or the crossover. He shoves south on the instruction, which lets him go 375 ft before he must stop for want of further word (CROR 123.2).",commands:[{kind:"radio",actor:"engineer",to:"helper",words:"Back up fifteen cars, lined for DT24.",direction:"back",carLengths:15},{kind:"set-reverser",actor:"engineer",train:"FS23",to:"reverse"},{kind:"set-independent-brake",actor:"engineer",train:"FS23",application:0},{kind:"set-throttle",actor:"engineer",train:"FS23",notch:1}]},{on:{near:{vehicle:"CP 215379",track:"stl-crossover",atFt:125,withinFt:30}},commands:[{kind:"set-throttle",actor:"engineer",train:"FS23",notch:0}]},{on:{event:"injured",by:"helper"},caption:"The movement takes the crossover, not DT24. It strikes the helper where he stands foul of the crossover track."},{on:{event:"struck",subject:"CP 215379"},caption:"It collides with INEX 145 on the West Loop, about 315 ft from where it started. The engineer stops.",commands:[{kind:"set-throttle",actor:"engineer",train:"FS23",notch:0},{kind:"set-independent-brake",actor:"engineer",train:"FS23",application:1}]},{atS:260,caption:"Unable to reach the helper by radio, the foreman walks the movement and finds him under car CP 215379. The TSB found that the task interruption and likely fatigue led to the wrong switch, that the error was not caught, and that CP had not assessed the risks when switching moved to the diamond in 2012."}],Yf={endS:270,events:[{kind:"turned",subject:"x-2wl"},{kind:"radio"},{kind:"injured"}],violations:[{pack:"cror-live",ref:"104(b)",subject:"FS23"}]},Kf={$schema:Lf,id:Pf,name:If,incident:Bf,level:Df,packs:Gf,summary:Wf,simplifications:zf,cues:Hf,expect:Yf},Vf="../schema/replay.schema.json",Uf="r21d0001",Xf="R21D0001 · Assistant conductor thrown from a car by slack action, Montréal (2021)",Jf={number:"R21D0001",date:"2021-01-06",place:"Track PD06, Pointe-Saint-Charles Yard, Mile 1.9 Montreal Subdivision, Montréal, Quebec",report:"https://www.tsb.gc.ca/eng/rapports-reports/rail/2021/r21d0001/r21d0001.html"},Zf="pointe-st-charles",Qf=["cror-live","goi-live"],ek="A CN yard assignment was shoving 21 empty covered hoppers west on the Port of Montreal spur at about 10 mph. The assistant conductor rode the leading car to protect the move. Rather than stop and walk through a restricted-clearance tunnel, he moved to the car's end ladder and rode through. Near signal 410RC the engineer stopped with the independent brake alone. The slack ran out with a jerk of over 2 g at the end of the leading car, and the assistant conductor lost his grip and fell in front of it. He was fatally injured.",tk=["The second locomotive and the car numbers other than COER 353680 are invented; the train's weight and length match the report.","Signal 410RC, the Bridge Street crossing and the rail traffic controller are not modelled; they appear in the captions.","The engineer's throttle handling before the stop is not in the report; it is chosen to shove at about 10 mph.","A rider lets go when the car's acceleration averaged over a sixtieth of a second exceeds 2 g, the figure from the re-enactment. The jerk itself is the simulation's slack action, not tuned.","The jerk comes about 3 seconds after the independent brake is applied, where the report puts it shortly before the stop about 15 seconds later: the game's independent brake takes full effect at once, while a real locomotive's brake cylinder builds up over several seconds. The train stops about 490 ft from the signal (report: about 400 ft)."],nk=[{atS:0,caption:"Montréal, 6 January 2021, about 12:25, −1 °C. Yard assignment YPC011 has just coupled 21 empty covered hoppers and stopped 20 seconds at the Bridge Street crossing. It will shove west on track PD06 toward signal 410RC, the cars leading. The assistant conductor gets on the side ladder at the leading end of the leading car, COER 353680, to protect the move.",commands:[{kind:"work",actor:"assistant",task:"board",target:"COER 353680@behind"}]},{atS:6,caption:"While the train backs up, the conductor calls the rail traffic controller for the signal on his personal cellphone, though the railway radio is working (CROR A(xii)).",commands:[{kind:"set-reverser",actor:"engineer",train:"YPC011",to:"reverse"},{kind:"set-independent-brake",actor:"engineer",train:"YPC011",application:0},{kind:"set-throttle",actor:"engineer",train:"YPC011",notch:3},{kind:"radio",actor:"conductor",to:"RTC",words:"YPC011 on PD06, requesting 410RC.",via:"cellphone"}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:2150,withinFt:25}},commands:[{kind:"set-throttle",actor:"engineer",train:"YPC011",notch:1}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:1990,withinFt:25}},commands:[{kind:"set-throttle",actor:"engineer",train:"YPC011",notch:0}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:1900,withinFt:25}},caption:"Ahead is the tunnel under the Victoria Bridge approach, marked with restricted clearance signs. The rules require the train to stop so he can get off and walk through (CROR D). Instead he moves to the end ladder of the car, to stay clear of the tunnel wall — contrary to CN's instruction to ride the side ladder (GOI 8.12.4).",commands:[{kind:"work",actor:"assistant",task:"ride-end-ladder",target:"COER 353680@behind"}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:1600,withinFt:25}},commands:[{kind:"set-throttle",actor:"engineer",train:"YPC011",notch:1}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:1350,withinFt:25}},commands:[{kind:"set-throttle",actor:"engineer",train:"YPC011",notch:0}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:1150,withinFt:25}},caption:"Through the tunnel, he tells the engineer by radio that 410RC shows Medium to Stop, and that there are 15 cars to go. The engineer does not repeat the distance (CROR 123(c)).",commands:[{kind:"radio",actor:"assistant",to:"engineer",words:"410RC medium to stop. Fifteen cars.",direction:"back",carLengths:15}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:800,withinFt:25}},caption:"8 cars. Again the engineer does not repeat it.",commands:[{kind:"radio",actor:"assistant",to:"engineer",words:"Eight cars.",direction:"back",carLengths:8}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:720,withinFt:25}},commands:[{kind:"set-throttle",actor:"engineer",train:"YPC011",notch:1}]},{on:{near:{vehicle:"COER 353680",track:"pd06",atFt:620,withinFt:25}},caption:"4 cars. The engineer answers that he is stopping now, before the locomotives enter the tunnel, and stops with the independent brake alone, without modulating it.",commands:[{kind:"radio",actor:"assistant",to:"engineer",words:"Four cars.",direction:"back",carLengths:4},{kind:"radio",actor:"engineer",to:"assistant",words:"Four cars. Stopping here.",carLengths:4,direction:"back"},{kind:"set-throttle",actor:"engineer",train:"YPC011",notch:0},{kind:"set-independent-brake",actor:"engineer",train:"YPC011",application:1}]},{on:{event:"fell",by:"assistant"},caption:"The locomotives brake; the cars ahead of them run on until the slack stretches out, and the jerk reaches the far end of the train. The assistant conductor, on the end ladder, loses his grip and falls onto the track in front of the car."},{on:{event:"injured",by:"assistant"},caption:"The car runs over him before the train stops. He is fatally injured."},{atS:190,caption:"A re-enactment the next day measured more than 2 g at the end of the leading car. CN warned employees about slack action from heavy use of the independent brake, and required movements on the spur to be led by a locomotive or, when shoving, a caboose. Transport Canada found CN non-compliant with the rules on riding equipment."}],ok={endS:200,events:[{kind:"changed-ladder",subject:"COER 353680@behind"},{kind:"fell"},{kind:"injured"}],violations:[{pack:"cror-live",ref:"A(xii)",subject:"conductor"},{pack:"cror-live",ref:"D",subject:"assistant"},{pack:"goi-live",ref:"8.12.4",subject:"assistant"},{pack:"cror-live",ref:"123(c)",subject:"YPC011"}]},ak={$schema:Vf,id:Uf,name:Xf,incident:Jf,level:Zf,packs:Qf,summary:ek,simplifications:tk,cues:nk,expect:ok},ik="../schema/replay.schema.json",sk="r94c0010",rk="R94C0010 · Running switch into a warehouse door, Calgary (1994)",ck={number:"R94C0010",date:"1994-01-24",place:"Federated Cooperatives spur, Mile 124.21 Three Hills Subdivision, Calgary, Alberta",report:"https://www.tsb.gc.ca/eng/rapports-reports/rail/1994/r94c0010/r94c0010.html"},dk="calgary",lk=["cror-live","goi-live"],hk="A CN yard crew delivered a loaded refrigerator car to a warehouse by running switch: cut off in motion behind the locomotives, it rolled onto a spur that curves 14 degrees and falls up to 1.54% toward the warehouse door, with the foreman riding it to control it by hand brake. He had only tightened the chain to check the brake, which was worn and ineffective. The car ran away down the grade and broke through the door, injuring two contract workers inside.",uk=["The foreman rides the car from the start and pulls the pin from it; in the report he pulled it from the locomotive after a failed first attempt and then crossed onto the car.","The report does not describe preparing the car; here its angle cocks are closed, hoses parted and air bled before the move, as a free-rolling car needs.","Radio is not modelled; the foreman's call appears as a caption.","The locomotives do not follow the car onto the spur.","The hand brake is modelled as giving 10% of its force. The report says only that it was ineffective.","The second switch 240 ft from the door, the warehouse building and the compressor are not modelled.","Past the door the car runs on to the end of the warehouse track and derails there. The report records no damage to railway equipment, so the real car stopped short of that; it does not say how."],mk=[{atS:0,caption:"Calgary, 24 January 1994, 08:20, −7 °C. CN's 0800 yard assignment — two locomotives and loaded refrigerator car FGMR 12042 — has come up the Three Hills Subdivision to spot the car inside the Federated Cooperatives warehouse. The crew means to do it by running switch, letting the car roll down the spur under hand brake control. The car is prepared to roll free: angle cocks closed, hoses parted, its air bled off.",commands:[{kind:"work",actor:"foreman",task:"close-cock",target:"CN 7002@behind"}]},{atS:2,commands:[{kind:"work",actor:"yardman",task:"unlock-switch",target:"spur-switch"}]},{atS:8,caption:"The yardman unlocks the spur switch and lines it back and forth to be sure it works, then leaves it normal.",commands:[{kind:"work",actor:"yardman",task:"line-switch",target:"spur-switch"}]},{atS:24,commands:[{kind:"work",actor:"yardman",task:"line-switch",target:"spur-switch"}]},{atS:6,commands:[{kind:"work",actor:"foreman",task:"close-cock",target:"FGMR 12042@ahead"}]},{atS:12,commands:[{kind:"work",actor:"foreman",task:"disconnect-hoses",target:"CN 7002|FGMR 12042"}]},{atS:21,commands:[{kind:"work",actor:"foreman",task:"bleed",target:"FGMR 12042"}]},{atS:52,commands:[{kind:"work",actor:"foreman",task:"board",target:"FGMR 12042@ahead"}]},{atS:56,caption:"The foreman rides the car and checks its hand brake by turning the wheel only until the chain is tight. He neither hears the shoes nor feels the car hold, and releases it (CROR 113.6(a) requires the hand brake to be verified in working order).",commands:[{kind:"work",actor:"foreman",task:"apply-handbrake",target:"FGMR 12042"}]},{atS:88,commands:[{kind:"work",actor:"foreman",task:"release-handbrake",target:"FGMR 12042"}]},{atS:110,caption:"The engineer starts north toward the spur switch, the car trailing. The yardman waits at the switch, which he has already unlocked and tried.",commands:[{kind:"set-reverser",actor:"engineer",train:"0800",to:"forward"},{kind:"set-independent-brake",actor:"engineer",train:"0800",application:0},{kind:"set-throttle",actor:"engineer",train:"0800",notch:1}]},{atS:127,commands:[{kind:"set-throttle",actor:"engineer",train:"0800",notch:0}]},{on:{near:{vehicle:"FGMR 12042",track:"three-hills-south",atFt:1560,withinFt:350}},caption:"About 250 ft short of the switch, at walking pace, the foreman pulls the pin: a running switch.",commands:[{kind:"work",actor:"foreman",task:"uncouple",target:"CN 7002|FGMR 12042"}]},{on:{event:"uncoupled"},caption:"The engineer opens the throttle to run the locomotives clear, and the yardman lines the switch for the spur behind them.",commands:[{kind:"set-throttle",actor:"engineer",train:"0800",notch:4},{kind:"work",actor:"yardman",task:"line-switch",target:"spur-switch"}]},{on:{near:{vehicle:"CN 7002",track:"three-hills-north",atFt:250,withinFt:60}},commands:[{kind:"set-throttle",actor:"engineer",train:"0800",notch:0},{kind:"set-independent-brake",actor:"engineer",train:"0800",application:1}]},{on:{near:{vehicle:"FGMR 12042",track:"federated-spur",atFt:40,withinFt:30}},caption:"The car follows onto the spur. The foreman applies the hand brake on the switch — applying a hand brake during a running switch, or to a free-rolling car, is prohibited at CN (CROR 113.6(a), GOI 8.12.4), and the car is rolling free toward a door with no air brakes (GOI 7.8).",commands:[{kind:"work",actor:"foreman",task:"apply-handbrake",target:"FGMR 12042"}]},{on:{near:{vehicle:"FGMR 12042",track:"federated-spur",atFt:1521,withinFt:260}},caption:"The hand brake does nothing. The car gains speed down the 1.54% grade through the 14-degree curve. The foreman radios that the brake is not responding, and gets off just short of the door, while it is still moving (GOI 8.12.5).",commands:[{kind:"get-down",actor:"foreman"}]},{on:{event:"broke-through-door",subject:"warehouse-door"},caption:"The car breaks through the warehouse door. Pieces of it strike the two contract workers on the other side: one is slightly hurt, the other seriously."},{atS:295,caption:"Findings: the crew did not apply the instruction requiring air brakes in service when switching toward doors; the hand brake was not verified before the running switch. It was out of adjustment, with badly worn and non-standard parts. The running switch was this spur's established practice."}],pk={endS:300,events:[{kind:"uncoupled"},{kind:"handbrake-applied",subject:"FGMR 12042"},{kind:"broke-through-door",subject:"warehouse-door"},{kind:"injured",subject:"warehouse-door"}],violations:[{pack:"cror-live",ref:"113.6(a)",subject:"cut-FGMR 12042"},{pack:"goi-live",ref:"7.8",subject:"cut-FGMR 12042"},{pack:"goi-live",ref:"8.12.4",subject:"foreman"},{pack:"goi-live",ref:"8.12.5",subject:"foreman"}]},gk={$schema:ik,id:sk,name:rk,incident:ck,level:dk,packs:lk,summary:hk,simplifications:uk,cues:mk,expect:pk},fk="../schema/replay.schema.json",kk="r95m0072",bk="R95M0072 · Runaway cars, Edmundston (1995)",vk={number:"R95M0072",date:"1995-12-14",place:"Edmundston Yard, track EA-34, New Brunswick",report:"https://www.tsb.gc.ca/eng/rapports-reports/rail/1995/r95m0072/r95m0072.html"},yk="edmundston",wk=["cror-live","goi-live"],$k="The conductor of train 130 closed the angle cocks between the locomotives and the cars before the full service application had finished, uncoupled, left the lead car's angle cock closed and applied no hand brakes. The air brakes released. The cars rolled west down the 0.25% grade, forced the dual control switch and stopped with about 15 cars on the main track.",_k=["Equipment is generic: GP38-2 locomotives, 110-tonne loads and 30-tonne empties with AB control valves.","The brake pipe, reservoirs and cylinders use the game's leakage rates, not measured ones; the cars break away after about 38 minutes where the report says about 50.","Snow, cold and the fuel stand are not modelled; the locomotives simply pull ahead.","Signals, the RTC, Rule 564 and train 132 are not modelled; they appear in the captions only."],Mk=[{atS:0,caption:"Edmundston Yard, 14 December 1995, about 20:30. Light snow, −15 °C. Train 130 — three locomotives, 60 loads, 6 empties — stands on yard track EA-34 with the brakes applied. EA-34 falls 0.25% westward to a dual control switch onto the Pelletier Subdivision main track."},{atS:1,caption:"The train has been pulled ahead. The engineer re-applies the brakes in full service; the reduction travels back through 66 cars.",commands:[{kind:"set-automatic-brake",actor:"engineer",train:"130",application:1}]},{atS:3,caption:"The conductor closes the angle cock on the trailing locomotive — before the full service application has finished (GOI 7.4).",commands:[{kind:"work",actor:"conductor",task:"close-cock",target:"CN 9903@behind"}]},{atS:9,caption:"…and the lead car's angle cock. The air still in the cars' brake pipe evens out along the cut: the cars nearest the cut see the pressure rise, and their brakes release. The cars further back stay applied.",commands:[{kind:"work",actor:"conductor",task:"close-cock",target:"LOAD 01@ahead"}]},{atS:15,caption:"He pulls the pin and uncouples the locomotives.",commands:[{kind:"work",actor:"conductor",task:"uncouple",target:"CN 9903|LOAD 01"}]},{atS:42,caption:"He does not re-open the lead car's angle cock to vent the pipe, and applies no hand brakes (CROR 112(c), GOI 7.4). He walks up to the locomotives.",commands:[{kind:"walk-to",actor:"conductor",track:"ea-34",atFt:7735,offsetFt:-9}]},{atS:82,commands:[{kind:"climb-into-cab",actor:"conductor",train:"130"}]},{atS:95,caption:"The locomotives leave the cars.",commands:[{kind:"set-automatic-brake",actor:"engineer",train:"130",application:0},{kind:"set-reverser",actor:"engineer",train:"130",to:"forward"},{kind:"set-independent-brake",actor:"engineer",train:"130",application:0},{kind:"set-throttle",actor:"engineer",train:"130",notch:1}]},{atS:110,commands:[{kind:"set-throttle",actor:"engineer",train:"130",notch:0},
