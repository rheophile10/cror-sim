rolled onto a spur that curves 14 degrees and falls up to 1.54% toward the warehouse door, with the foreman riding it to control it by hand brake. He had only tightened the chain to check the brake, which was worn and ineffective. The car ran away down the grade and broke through the door, injuring two contract workers inside.",Zl=["The foreman rides the car from the start and pulls the pin from it; in the report he pulled it from the locomotive after a failed first attempt and then crossed onto the car.","The report does not describe preparing the car; here its angle cocks are closed, hoses parted and air bled before the move, as a free-rolling car needs.","Radio is not modelled; the foreman's call appears as a caption.","The locomotives do not follow the car onto the spur.","The hand brake is modelled as giving 10% of its force. The report says only that it was ineffective.","The second switch 240 ft from the door, the warehouse building and the compressor are not modelled.","Past the door the car runs on to the end of the warehouse track and derails there. The report records no damage to railway equipment, so the real car stopped short of that; it does not say how."],eh=[{atS:0,caption:"Calgary, 24 January 1994, 08:20, −7 °C. CN's 0800 yard assignment — two locomotives and loaded refrigerator car FGMR 12042 — has come up the Three Hills Subdivision to spot the car inside the Federated Cooperatives warehouse. The crew means to do it by running switch, letting the car roll down the spur under hand brake control. The car is prepared to roll free: angle cocks closed, hoses parted, its air bled off.",commands:[{kind:"work",actor:"foreman",task:"close-cock",target:"CN 7002@behind"}]},{atS:2,commands:[{kind:"work",actor:"yardman",task:"unlock-switch",target:"spur-switch"}]},{atS:8,caption:"The yardman unlocks the spur switch and lines it back and forth to be sure it works, then leaves it normal.",commands:[{kind:"work",actor:"yardman",task:"line-switch",target:"spur-switch"}]},{atS:24,commands:[{kind:"work",actor:"yardman",task:"line-switch",target:"spur-switch"}]},{atS:6,commands:[{kind:"work",actor:"foreman",task:"close-cock",target:"FGMR 12042@ahead"}]},{atS:12,commands:[{kind:"work",actor:"foreman",task:"disconnect-hoses",target:"CN 7002|FGMR 12042"}]},{atS:21,commands:[{kind:"work",actor:"foreman",task:"bleed",target:"FGMR 12042"}]},{atS:52,commands:[{kind:"work",actor:"foreman",task:"board",target:"FGMR 12042@ahead"}]},{atS:56,caption:"The foreman rides the car and checks its hand brake by turning the wheel only until the chain is tight. He neither hears the shoes nor feels the car hold, and releases it (CROR 113.6(a) requires the hand brake to be verified in working order).",commands:[{kind:"work",actor:"foreman",task:"apply-handbrake",target:"FGMR 12042"}]},{atS:88,commands:[{kind:"work",actor:"foreman",task:"release-handbrake",target:"FGMR 12042"}]},{atS:110,caption:"The engineer starts north toward the spur switch, the car trailing. The yardman waits at the switch, which he has already unlocked and tried.",commands:[{kind:"set-reverser",actor:"engineer",train:"0800",to:"forward"},{kind:"set-independent-brake",actor:"engineer",train:"0800",application:0},{kind:"set-throttle",actor:"engineer",train:"0800",notch:1}]},{atS:127,commands:[{kind:"set-throttle",actor:"engineer",train:"0800",notch:0}]},{on:{near:{vehicle:"FGMR 12042",track:"three-hills-south",atFt:1560,withinFt:350}},caption:"About 250 ft short of the switch, at walking pace, the foreman pulls the pin: a running switch.",commands:[{kind:"work",actor:"foreman",task:"uncouple",target:"CN 7002|FGMR 12042"}]},{on:{event:"uncoupled"},caption:"The engineer opens the throttle to run the locomotives clear, and the yardman lines the switch for the spur behind them.",commands:[{kind:"set-throttle",actor:"engineer",train:"0800",notch:4},{kind:"work",actor:"yardman",task:"line-switch",target:"spur-switch"}]},{on:{near:{vehicle:"CN 7002",track:"three-hills-north",atFt:250,wit s-reports/rail/1995/r95m0072/r95m0072.html"},ch="edmundston",ih=["cror-live","goi-live"],dh="The conductor of train 130 closed the angle cocks between the locomotives and the cars before the full service application had finished, uncoupled, left the lead car's angle cock closed and applied no hand brakes. The air brakes released. The cars rolled west down the 0.25% grade, forced the dual control switch and stopped with about 15 cars on the main track.",lh=["Equipment is generic: GP38-2 locomotives, 110-tonne loads and 30-tonne empties with AB control valves.","The brake pipe, reservoirs and cylinders use the game's leakage rates, not measured ones; the cars break away after about 38 minutes where the report says about 50.","Snow, cold and the fuel stand are not modelled; the locomotives simply pull ahead.","Signals, the RTC, Rule 564 and train 132 are not modelled; they appear in the captions only."],hh=[{atS:0,caption:"Edmundston Yard, 14 December 1995, about 20:30. Light snow, −15 °C. Train 130 — three locomotives, 60 loads, 6 empties — stands on yard track EA-34 with the brakes applied. EA-34 falls 0.25% westward to a dual control switch onto the Pelletier Subdivision main track."},{atS:1,caption:"The train has been pulled ahead. The engineer re-applies the brakes in full service; the reduction travels back through 66 cars.",commands:[{kind:"set-automatic-brake",actor:"engineer",train:"130",application:1}]},{atS:3,caption:"The conductor closes the angle cock on the trailing locomotive — before the full service application has finished (GOI 7.4).",commands:[{kind:"work",actor:"conductor",task:"close-cock",target:"CN 9903@behind"}]},{atS:9,caption:"…and the lead car's angle cock. The air still in the cars' brake pipe evens out along the cut: the cars nearest the cut see the pressure rise, and their brakes release. The cars further back stay applied.",commands:[{kind:"work",actor:"conductor",task:"close-cock",target:"LOAD 01@ahead"}]},{atS:15,caption:"He pulls the pin and uncouples the locomotives.",commands:[{kind:"work",actor:"conductor",task:"uncouple",target:"CN 9903|LOAD 01"}]},{atS:42,caption:"He does not re-open the lead car's angle cock to vent the pipe, and applies no hand brakes (CROR 112(c), GOI 7.4). He walks up to the locomotives.",commands:[{kind:"walk-to",actor:"conductor",track:"ea-34",atFt:7735,offsetFt:-9}]},{atS:82,commands:[{kind:"climb-into-cab",actor:"conductor",train:"130"}]},{atS:95,caption:"The locomotives leave the cars.",commands:[{kind:"set-automatic-brake",actor:"engineer",train:"130",application:0},{kind:"set-reverser",actor:"engineer",train:"130",to:"forward"},{kind:"set-independent-brake",actor:"engineer",train:"130",application:0},{kind:"set-throttle",actor:"engineer",train:"130",notch:1}]},{atS:110,commands:[{kind:"set-throttle",actor:"engineer",train:"130",notch:0},{kind:"set-independent-brake",actor:"engineer",train:"130",application:1}]},{atS:150,caption:"The 66 cars stand unattended, held only by the brakes still applied at the rear. A freight control valve in lap does not make up brake cylinder leakage."},{on:{moving:"EMPTY 6"},caption:"The last of the air has leaked away. The cars start to roll west."},{on:{event:"trailed-through",subject:"ea-34-switch"},caption:"They force the dual control switch at the west end of EA-34 and run out onto the main track. Nothing — no derail — stands in the way."},{atS:3050,caption:"About 21:20 the RTC saw train 132 get a Stop signal at Albertine, suspected debris in the switch points, and authorized it past under Rule 564. Train 132 came on at restricted speed and stopped short of the cars. Nobody was hurt. Afterwards CN installed derails at both ends of EA-34 and required hand brakes to be tested."}],uh={endS:3100,events:[{kind:"angle-cock-closed",subject:"LOAD 01@ahead"},{kind:"uncoupled",subject:"CN 9903|LOAD 01"},{kind:"trailed-through",subject:"ea-34-switch"}],violations:[{pack:"goi-live",ref:"7.4",subject:"130"},{pack:"goi-live",ref:"7.4",subject:"
