        id: "103",
        kind: "rule",
        number: "103",
        title: "Grade Crossings",
        parent: "sec:operation-of-movements",
        text: "(a) Grade crossings observed with:\n        \u2022 missing or damaged railway crossing signs;\n        \u2022 automatic warning devices not operating as intended; or\n        \u2022 visible external power off light(s) that are extinguished or flashing;\n   must be reported by the quickest available means to the RTC, or employee responsible for\n   the track when the RTC does not control the track.\n    (i) When the RTC can prevent access to the crossing, it must be protected by the RTC\n        using blocking or other means until all affected movements are instructed to apply\n        Rule 103(g).\n        Instructions must be in writing unless delivered :\n            \u2022 within two controlled blocks of the crossing; or\n            \u2022 when is no controlled block prior, within 10 miles.\n   (ii) When the RTC cannot prevent access to the crossing, the employee responsible for\n        the track must instruct all affected movements to apply Rule 103(g).\n\n         Once protected per (i) or (ii), the RTC or the person responsible for the track must\n         immediately notify the person responsible for repair.\n(b) When the leading piece of equipment is not equipped with a whistle and headlight, before\n    occupying a public grade crossing:\n    (i) not equipped with automatic warning devices, manual protection is required.\n    (ii) equipped with automatic warning devices, manual protection is required unless a crew\n         member is located on the leading piece of equipment in a position to warn persons\n         standing on, or crossing, or about to cross the track.\n\n   This does not modify the application of Rule 103.1(h).\n\n(c) Where a railway track and a road share the same roadbed and there is no fence or other barrier\n    between them, moving rail cars not headed by an engine or when headed by a remotely controlled\n    engine must be protected by a crew member on the leading car or on the ground, in a position to warn\n    persons standing on, or crossing, or about to cross the track.\n(e) Leaving equipment:\n    (i) Equipment must not be left standing within 100 feet of the travelled portion of a grade\n          crossing, except where it is necessary to leave such equipment for loading or unloading.\n    (ii) Where sightline restrictions exist, special instructions will govern.\n(f) Before switching or operating a remotely controlled engine over public grade crossing not\n    equipped with automatic warning devices, where the view of the crossing by the locomotive\n    engineer is obscured, an employee must be in a position to observe the crossing and provide\n    signals and instructions to the locomotive engineer as necessary.\n(g) When required by rule or special instruction to provide manual protection of a grade crossing:\n    (i) Before occupying the crossing a crew member or other employee must be on the ground\n          ahead of the movement, in a position to display a stop signal by hand to prevent vehicular\n          and/or pedestrian traffic over such crossing. At night, or when such signal cannot be\n          clearly seen, a light or fusee must be used.\n    (ii) The movement must not enter the crossing until instructions have been received from the\n          employee providing the manual protection.\n    (iii) Protection per (i) and (ii) must be provided unless the crossing is known to be clear of\n          vehicular and/or pedestrian traffic, and will remain clear until occupied.\n(h) Crew members must not give vehicular or pedestrian traffic a hand signal to proceed over a\n    grade crossing.",

        text: "Crew members must not give vehicular or pedestrian traffic a hand signal to proceed over a grade crossing.",
        hash: "844dd3cfbf99"
      },
      {
        id: "103.1",
        kind: "rule",
        number: "103.1",
        title: "Grade Crossings With Warning Devices",
        parent: "103",
        text: "(a) In the application of this rule, unless manual protection is provided, \u201CMinimum Required Time\u201D\n    means that before a movement occupies the grade crossing, the automatic warning devices\n    must be observed to be operating as follows:\n    (i) Grade crossings not equipped with gates: For a minimum of 20 seconds, unless a greater\n         time is prescribed in special instructions.\n    (ii) Grade crossing equipped with gates, when the maximum allowable operating speed is:\n            \u2022 Greater than 15 mph, the gates must be observed in the horizontal position for a\n                minimum of 5 seconds.\n            \u2022 15 mph or less, the gates must be observed in the horizontal position.\n\n(b) Unless otherwise directed by special instructions, a movement over a grade crossing\n    equipped with automatic warning devices, which;\n    (i) has stopped or is switching in the vicinity of the crossing; or\n    (ii) is entering the main track in the vicinity of the crossing; or\n    (iii) has been authorized to pass a block or interlocking signal indicating Stop which is located\n          within 300 feet of the crossing;\n    must not exceed 10 MPH from a distance of 300 feet from the crossing until the crossing is fully\n    occupied by the movement. In addition, the crossing must not be occupied until the warning\n    devices are known to have been operating for the Minimum Required Time.\n    Applicable to item (iii): At all other crossings within the block, movements must not exceed 15\n    MPH entering the crossing unless the warning devices are known to have been operating for the\n    Minimum Required Time.\n(c) Unless otherwise directed by special instructions, a movement on non-main track over a grade\n    crossing equipped with automatic warning devices, must not exceed 10 mph from a distance of\n    300 feet until the crossing is fully occupied. Note: Not applicable on Subdivision Track.\n(d) At a grade crossing where special instructions require that:\n   (i) warning devices be activated by radio, pushbutton, or other appliances, or\n   (ii) movements stop at stop signs, circuit signs, or at a specified distance;\n\n    movements affected must not occupy the crossing until the warning devices have been\n    operating for the Minimum Required Time. Pushbutton boxes must be closed and locked when\n    not in use.\n(f) When advised by special instructions that rusty rail or other conditions may exist, occupancy of\n    crossings with automatic warning devices must be manually protected unless it is known that\n    warning devices have been operating for the Minimum Required Time.\n(g) At crossings equipped with automatic warning devices, unless otherwise indicated in\n    special instructions, movements must not increase speed by more than 5 MPH unless\n    automatic warning devices are known to have been operating for the Minimum Required\n    Time.\n(h) Unless otherwise specified in special instructions, when a movement passes over any grade crossing\n    equipped with automatic warning devices, it will be necessary, before reversing over the crossing, for\n    a crew member to manually protect the crossing.\n(i) A movement following another movement within 1500 feet may not properly activate grade\n    crossing warning devices and therefore, must not obstruct any crossing equipped with\n    automatic warning devices until:\n    (i) the warning devices are known to have been operating for the Minimum Required Time; or\n    (ii) the crossing is manually protected.\n\n                                           SWITCHES",

        text: "the crossing is manually protected. SWITCHES",
        hash: "e73660528d6f"
      },
      {
        id: "104",
        kind: "rule",
        number: "104",
        title: "Hand Operated Switches",
        parent: "sec:operation-of-movements",
        text: "General\n(a) Operation of Switches - semi-automatic, spring, dual control or auto-normal switches operated\n    by hand are considered hand operated switches, and all rules governing hand operated\n    switches apply.\n(b) Except while being turned, each switch must be secured with an approved device. When a\n    switch has been turned, the points must be examined and the target, reflector or light, if any,\n    observed to ensure that the switch is properly lined for the route to be used.\n(c) A switch must not be turned while any part of a car or engine is between the switch points and\n    the fouling point of the track to be used, except when making a running switch or in the\n    application of the exception to Rule 114.\n(d) Handling of main track hand operated switches by other than a crew member.\n    When arrangements are made for an employee to take charge of a switch(es), the movement\n    must receive verbal confirmation that the switch has been restored to normal position.\n    Verbal advice of switch position may be provided to a movement by an employee. The\n    approaching movement must not act on such information unless advised that the employee is\n    at the switch and will remain in charge of the switch.\n(e) If it is known or suspected that either of the points or any part of a switch is damaged or broken,\n    the switch must be protected until it can be made safe for use. A report must be made to the\n    RTC or employee responsible for the territory by the quickest available means.\n(f) When a switch point lock is provided, it must be locked when the switch is left in normal\n    position. Employees must familiarize themselves with the location of switch point locks.\nMain Track Hand Operated Switches\nNotes:\n    (i) A main track hand operated switch must display a reflectorized target, or light and target\n          except in CTC or on a subdivision specified in special instructions.\n    (ii) At an electrically locked hand operated switch, instructions posted at the switch or in special\n          instructions, will govern the operation of the switch and entry to the main track or\n          interlocking route.\n(h) Unless otherwise specified by special instructions, the normal position for a main track switch is\n    for the main track route. Except as provided in paragraph (i), main track switches must be left\n    lined and locked in normal position.\n(i) Left in Reverse Position\n    A main track switch may be left in the reverse position when;\n    1. directed by GBO, clearance or special instructions, and protection has been provided\n          against all affected movements,\n    2. attended by an employee, who must be in position to restore the switch to normal before it is\n          occupied by an approaching movement on the main track,\n    3. occupied by equipment,\n    4. required in the application of Rule 41/841,\n    5. in OCS or Cautionary Limits;\n          (i) equipment is left on the main track,\n          (ii) the equipment is left as close as practical to the switch, and\n          (iii) operation over the same switch is required when returning to such equipment,\n    6. in CTC, equipment is left within the same controlled block. When this cannot be done, RTC\n          permission must be obtained.\n\nNotes:\n    (i) Except when switching, main track switches when left in the reverse position, must be left\n          locked.\n    (ii) Unless authorized to leave a main track switch in reverse position or so instructed by the\n          RTC, an employee encountering a main track switch in reverse position must restore the\n          switch to normal position and comply with the requirements of (iii).\n    (iii) An employee encountering a main track switch in normal position after having a warning that\n          the switch is in reverse position must;\n               \u2022 communicate to other crew members or employee that the switch is restored to\n                  normal, and\n               \u2022 report to the RTC from the location of the switch i.e. physically situated at or having\n                  the switch in sight, or the switch at the time is occupied by a portion of the movement.\n          If the RTC cannot be contacted, the employee may leave that location, leaving the switch\n          lined and locked in the normal position.\n    (iv) The RTC must not act on any report of switch position that was not received from the switch\n          location. Additionally, the RTC must not remove protection for the reverse switch until it can\n          be confirmed that there are no other movements authorized to leave the switch in the\n          reverse position.\n(j) Except when switching, when a movement is closely approaching or passing over a main track\n    switch, other than a dual control switch, employees must keep at least 20 feet from the switch\n    stand, and must, when practicable, on single track, stand on the opposite side of the track.\n(k) On single track, a crew member of a movement stopped on the main track to meet or to be\n    passed by another movement, will, when practicable, reverse the switch for the approaching\n    movement and protect it unless relieved by a crew member of the other movement.\n(l) Unless otherwise directed by special instructions, the normal position for a main track junction\n    switch is when set for through movement on one subdivision.\n(m) When a movement diverges from a main track, the switch used must not be restored to normal\n    position until the fouling point has been cleared.\n(n) The switches at both ends of a crossover are normal when set for a through movement on the\n    other tracks. When a crossover is to be used, the switch in the track on which the movement is\n    standing must be reversed first. Both switches must be reversed before crossing over. Before\n    either switch is restored to normal position the movement must be clear of the crossover.\nHand Operated Non-Main Track Switches\n(o) Unless otherwise specified by special instructions, non-main track switches, when equipped\n    with a lock, must be lined in normal position and locked after having been used.\nMain Track Switches in OCS Territory\n(p) Unless or until the switch is seen to be in normal position, movements approaching a main track\n    hand operated switch in a facing point direction in OCS territory, unless otherwise governed by\n    signal indication, must not exceed the following speeds from one-quarter of a mile of the switch;\n    PASSENGER                           50 MPH\n    FREIGHT                             45 MPH\n    FREIGHT handling\n    Special Dangerous\n    Commodities                         40 MPH\n(q) The employee handling a main track hand operated switch in non-signalled territory must, from\n    the location of the switch, communicate with another employee to confirm the position in which\n    the switch has been left, lined and locked. The employee receiving this report must repeat it\n    back to the employee who handled the switch. Communication may be achieved by personal\n    contact, radio or telephone. A lone employee unable to communicate with any employee other\n    than the RTC, must communicate with the RTC.\n    This rule also applies where ABS signals do not govern movements in both directions.",

        text: "The employee handling a main track hand operated switch in non-signalled territory must, from the location of the switch, communicate with another employee to confirm the position in which the switch has been left, lined and locked. The employee receiving this report must repeat it back to the employee who handled the switch. Communication may be achieved by personal contact, radio or telephone. A lone employee unable to communicate with any employee other than the RTC, must communicate with the RTC. This rule also applies where ABS signals do not govern movements in both directions.",

      {
        id: "104.1",
        kind: "rule",
        number: "104.1",
        title: "Spring Switches",
        parent: "104",
        text: "(a) A spring switch will be identified by a spring switch sign bearing the letters \u201CSS\u201D.\n(b) Employees must keep clear of the switch handle while it is being lifted or released.\n(c) When trailing through a spring switch, a movement that stops must not be reversed, nor slack\n    taken, until the switch has been properly set by hand.\n(d) When ice or snow conditions warrant, all movements must stop before trailing through a spring\n    switch and examine the switch points, cleaning them if necessary.\n(e) When a movement is required to operate over a spring switch in the facing point direction at\n    RESTRICTED speed, a stop must be made before the leading wheels are on the switch points,\n    and the switch points must be examined from a position on the ground.\n    (i) If the points are found to be properly closed the movement will be governed by the indication\n         of the signal, if any.\n    (ii) If the switch points are not properly closed and cannot be closed by use of the switch\n         handle, the points must be spiked in the proper position and the movement will be governed\n         by the indication of the signal, if any.\n         After operating over a spiked spring switch, the spike must be removed and the RTC or\n         employee in charge notified as quickly as possible.",

        title: "Dual Control Switches",
        parent: "104",
        text: "(a) Except as required by rule, a dual control switch must not be placed in hand position without\n    permission from the RTC or signalman.\n(b) When a movement is required to operate over a dual control switch under a Stop indication,\n    unless relieved of the responsibility by the RTC or signalman, the movement must not proceed\n    until;\n    (i) the selector lever is placed in \u201Chand\u201D position;\n    (ii) the hand throw lever is operated until the switch points move in both directions with the\n          action of the hand throw lever; and\n    (iii) the switch is lined by hand for the route to be used. The selector lever must be restored to\n          \u201Cpower\u201D position and locked, but not before the movement has occupied the switch points.\n(c) The RTC or signalman must not relieve a crew of the requirements of paragraph (b) until it has\n    been determined, from the office control devices and indications, that dual control switches in\n    the route to be used are properly lined. When so relieved, a crew member must observe that\n    the switch points are lined for the authorized route.\n(c) OPTIONAL (to above with approved system)\n    The RTC or signalman may relieve a crew of the requirements of paragraph (b) when\n    automated office control devices confirm that dual control switches are properly lined for the\n    route generated on the authority that will be issued to the movement.\n(d) When switching is to be performed over a dual control switch, in conjunction with Rule 566.1 or\n    577.1, the switch may be operated by hand after authority has been obtained as prescribed by\n    Rule 566, 567 or 577. The selector lever must be placed in \u201Chand\u201D position. The hand throw\n    lever must be operated until the switch points move in both directions with the action of the\n    hand throw lever. The selector lever must be left in \u201Chand\u201D position until switching is completed.\n    The RTC must be advised when the selector lever has been restored to the \u201Cpower\u201D position\n    and locked.",

        number: "104.2(a)",
        parent: "104.2",
        text: "Except as required by rule, a dual control switch must not be placed in hand position without permission from the RTC or signalman.",
        hash: "84d85aa717b7"
      },
      {
        id: "104.2(b)",
        kind: "subrule",
        number: "104.2(b)",
        parent: "104.2",
        text: "When a movement is required to operate over a dual control switch under a Stop indication, unless relieved of the responsibility by the RTC or signalman, the movement must not proceed until;",
        hash: "76998b2ce8fe"
      },
      {
        id: "104.2(b)(i)",
        kind: "subrule",
        number: "104.2(b)(i)",
        parent: "104.2(b)",
        text: "the selector lever is placed in \u201Chand\u201D position;",
        hash: "e2a38ef05e6f"
      },
      {
        id: "104.2(b)(ii)",
        kind: "subrule",
        number: "104.2(b)(ii)",
        parent: "104.2(b)",
        text: "the hand throw lever is operated until the switch points move in both directions with the action of the hand throw lever; and",
        hash: "c92c2903d57d"
      },
      {
        id: "104.2(b)(iii)",
        kind: "subrule",
        number: "104.2(b)(iii)",
        parent: "104.2(b)",
        text: "the switch is lined by hand for the route to be used. The selector lever must be restored to \u201Cpower\u201D position and locked, but not before the movement has occupied the switch points.",
        hash: "882c4760eaa1"
      },
      {
        id: "104.2(c)",
        kind: "subrule",
        number: "104.2(c)",
        parent: "104.2",
        text: "The RTC or signalman must not relieve a crew of the requirements of paragraph (b) until it has been determined, from the office control devices and indications, that dual control switches in the route to be used are properly lined. When so relieved, a crew member must observe that the switch points are lined for the authorized route.",
        hash: "ccbca10f9602"
      },
      {
        id: "104.2(c)-2",
        kind: "subrule",
        number: "104.2(c)-2",
        parent: "104.2",
        text: "OPTIONAL (to above with approved system) The RTC or signalman may relieve a crew of the requirements of paragraph (b) when automated office control devices confirm that dual control switches are properly lined for the route generated on the authority that will be issued to the movement.",
        hash: "19f4b25710bb",
        flags: [
          "duplicate-label"
        ]
      },
      {
        id: "104.2(d)",
        kind: "subrule",
        number: "104.2(d)",
        parent: "104.2",
        text: "When switching is to be performed over a dual control switch, in conjunction with Rule 566.1 or 577.1, the switch may be operated by hand after authority has been obtained as prescribed by Rule 566, 567 or 577. The selector lever must be placed in \u201Chand\u201D position. The hand throw lever must be operated until the switch points move in both directions with the action of the hand throw lever. The selector lever must be left in \u201Chand\u201D position until switching is completed. The RTC must be advised when the selector lever has been restored to the \u201Cpower\u201D position and locked.",
        hash: "203ac83f1cde"
      },
      {
        id: "104.3",
        kind: "rule",
        number: "104.3",
        title: "Power-Operated Switches At A Stop Signal",
        parent: "104",
        text: "When the crew of a movement is authorized to pass a stop signal to move over a power-operated\nswitch, a crew member must observe that the switch points are lined for the authorized route.",
        hash: "a4ece1fc2c88",
        page: 46
      },
      {
        id: "104.4",
        kind: "rule",
        number: "104.4",
        title: "Semi-Automatic Switches",
        parent: "104",
        text: "(a) A semi-automatic switch will be equipped with reflectorized targets.\n(b) When ice or snow may affect the ability of the switch points on a semi-automatic switch to close\n    properly when operated by wheel flange, a member of the crew must manually line the switch\n    and ensure the points are properly lined before a trailing move is commenced over the switch.\n    Movements operating in a facing point direction must observe the position of the points in\n    addition to the target indication before proceeding over a semi-automatic switch.\n(c) After coupling to equipment at a semi-automatic switch, or when reversing direction through\n    such switch, a facing point move must not be made, unless one unit of equipment has trailed\n    entirely through the switch, or it is known that the points are properly lined for the movement.",
        hash: "d3a4fc2774ef",
        page: 47
      },

        kind: "subrule",
        number: "104.4(a)",
        parent: "104.4",

      {
        id: "104.5",
        kind: "rule",
        number: "104.5",
        title: "Derails",
        parent: "104",
        text: "(a) The location of each derail will be marked by a sign, unless otherwise directed by special\n    instructions. Employees must be familiar with the location of each derail.\n(b) A movement or track unit must stop short of a derail set in the derailing position.\n(c) Each derail, other than a Special Derail or a Blue Flag Derail, must be left in the derailing\n    position.\n(d) The location of SPECIAL DERAILS will be indicated in the time table or special instructions, will\n    be switch stand operated and identified in the field with a reflective red letter \u201CD\u201D on a reflective\n    yellow target, or a sign indicating \u201CSpecial Derail\u201D which will be visible when in the derailing\n    position.\n    The following requirements govern their use:\n    \u2022 they will only be in the derailing position when unattended equipment is present;\n    \u2022 equipment to be left must be coupled together except when required to clear a crossing or\n        on account of a mechanical defect; and\n    \u2022 movements required to move at RESTRICTED speed on a track where a SPECIAL DERAIL\n        is located must, in addition to the requirements of RESTRICTED speed, approach such\n        derail prepared to find it in the derailing position.\n(e) All derails must be left secured with a locking device.\n(f) Derails used in conjunction with blue flags will be in the derailing position only when protection\n    for personnel is required. When protection is no longer required, they will be locked in a non-\n    derailing position.\n(g) Where hand operated switch point derails are in use, the points must be examined and the\n    target observed to ensure that the derail is in the proper position.",

        id: "105",
        kind: "rule",
        number: "105",
        title: "Operation On Non-Main Track",
        parent: "sec:operation-of-movements",
        text: "Special instructions will indicate when this rule is not applicable on a specific track.\nUnless otherwise provided by signal indication, a movement using non-main track must operate at\nREDUCED speed and be prepared to stop short of the end of track or the red signal prescribed by\nRule 41.\n(a) In CTC, movements may only enter a siding by signal indication or with permission from the\n    RTC.\n(b) Unless otherwise provided by signal indication or special instructions, movements operating on\n    non-main tracks must not exceed fifteen (15) MPH.\n(c) In addition to moving at REDUCED speed, a movement using a non-signalled siding or using\n    other non-main tracks so designated in special instructions, must operate at a speed that will\n    allow it to stop within one-half the range of vision of a track unit.",
        hash: "8116e6872f4d",
        page: 47
      },

        kind: "subrule",

      {
        id: "106",
        kind: "rule",
        number: "106",
        title: "Crew Responsibilities",
        parent: "sec:operation-of-movements",
        text: "All crew members are responsible for the safe operation of movements and equipment in their\ncharge and for the observance of the rules. Under conditions not provided for by the rules, they\nmust take every precaution for protection.\nA utility employee becomes a crew member when working with any movement.",
        hash: "e9b9adbc739e",
        page: 48
      },
      {
        id: "107",
        kind: "rule",
        number: "107",
        title: "Restrictions At Passenger Train Stops",
        parent: "sec:operation-of-movements",
        text: "Unless otherwise directed by special instructions, a movement must operate with extreme care\nwhen passing along side a train carrying passengers that is discharging or receiving traffic.\nIt must not pass between such train and the station or platform, unless the movement is properly\nprotected.\nPassengers shall be allowed to entrain and detrain only after positive protection has been provided\nagainst movements approaching on any main track they must cross when moving between the\nstation and the train.",
        hash: "67c06c3e8d51",
        page: 48
      },
      {
        id: "108",
        kind: "rule",
        number: "108",
        title: "Precautions While Switching (Optional)",
        parent: "sec:operation-of-movements",
        text: "When switching is performed, precautions must be taken by crew members to prevent unintended\nrollbacks and/or fouling of other tracks and equipment.",
        hash: "5c087bbef5e2",
        page: 48
      },
      {
        id: "109",
        kind: "rule",
        number: "109",
        title: "Locomotive Engineer Precautions",
        parent: "sec:operation-of-movements",
        text: "When duties require the locomotive engineer to temporarily exit the controlling locomotive cab on a\nstanding movement, the locomotive engineer must:\n(a) fully apply the independent brake;\n(b) apply the automatic brake, if required;\n(c) remove the reverser, unless the locomotive is not equipped with a high idle feature;\n(d) immediately after stepping away from the control stand, visually verify that:\n    (i) the gauges do not indicate a possible release of the air brakes; and\n    (ii) the independent and automatic brake valve handles remain in the selected positions; and\n(e) verbally confirm with another employee the measures taken above.",
        hash: "4ec65255efb3",
        page: 48
      },
      {
        id: "109(a)",
        kind: "subrule",
        number: "109(a)",
        parent: "109",
        text: "fully apply the independent brake;",
        hash: "e97d8b552d8c"
      },
      {

        kind: "subrule",

        parent: "109",

        kind: "subrule",

        parent: "109",
        text: "remove the reverser, unless the locomotive is not equipped with a high idle feature;",

        hash: "c58ee1a08b5e"
      },
      {
        id: "110",
        kind: "rule",
        number: "110",
        title: "Inspecting Passing Trains And Transfers",
        parent: "sec:operation-of-movements",
        text: "(a) When duties and terrain permit, at least two crew members of a standing train or transfer and\n    other employees at wayside must position themselves on the ground on both sides of the track\n    to inspect the condition of equipment in passing trains and transfers. When performing a train or\n    transfer inspection, the locomotive engineer will inspect the near side. When a group of\n    wayside employees is present, at least two employees must perform the inspection.\n    EXCEPTION: Crew members of passenger trains are exempted from the above requirements\n    except when standing at meeting points in single track territory. However, every effort must be\n    made to stop a train or transfer when a dangerous condition is noted.\n(b) Employees inspecting the condition of equipment in a passing freight train or transfer must,\n    when possible, broadcast the results of the inspection.\n(c) Every effort must be made to stop a passing train or transfer if a dangerous condition is\n    detected. Each crew member of a train or transfer must be alert at all times for a stop signal or\n\n    communication given by an employee. The report to the train or transfer being inspected must\n    state only the location of the dangerous condition and what was observed and not speculate as\n    to the cause.\n(d) When a crew member is located at the rear of a train or transfer, a front crew member must,\n    when practicable, notify the rear crew member of the location of employees in position to\n    inspect their train or transfer.",

        page: 48
      },

      {
        id: "111",
        kind: "rule",
        number: "111",
        title: "Train And Transfer Inspection",
        parent: "sec:operation-of-movements",
        text: "(a) The crew must know that equipment in their train or transfer is in good order before starting and\n    inspect it whenever they have an opportunity to do so. Equipment added to a train or transfer\n    en route must be inspected with extra care to ensure it is in good order.\n(b) When crew members are on the rear of a moving train or transfer they must inspect, at every\n    opportunity, the track to the rear for evidence of dragging or derailed equipment.\n(c) All crew members on a moving train or transfer must make frequent inspections of both sides to\n    ensure that it is in order.\n(d) On completion of crew-planned inspections and at locations where inspection is required by\n    special instructions, crew members will, when possible, voice communicate to each other the\n    results of such inspections.\n(e) OPTIONAL: The conductor first arriving at a meeting point will arrange for a walking inspection\n    of their freight train or transfer, inspecting as much as time and conditions permit.",

        parent: "111",
        text: "OPTIONAL: The conductor first arriving at a meeting point will arrange for a walking inspection of their freight train or transfer, inspecting as much as time and conditions permit.",

      {
        id: "112",
        kind: "rule",
        number: "112",
        title: "Securing Unattended Equipment",
        parent: "sec:operation-of-movements",
        text: "When equipment is left unattended, it must be secured to prevent it from moving unintentionally.\n\nIn the application of this rule:\n(i) For the purpose of paragraphs (b) to (g), equipment is considered unattended when an\n      employee is not in close enough proximity to take effective action to stop the equipment should\n      it move unintentionally.\n(ii) Parking brakes are considered to be hand brakes.\n(iii) Application of hand brakes must not be made while equipment is being pulled or shoved.\n(iv) Before leaving equipment, the employee securing such equipment must confirm with another\n      employee the manner in which it has been secured.\n(v) When one or more locomotives are coupled to one or more cars, hand brakes must be applied\n      on all locomotives in the lead consist of the unattended movement. In the application of (g), the\n      number of hand brakes applied on each locomotive in the lead consist must not be included in\n      determining the number of hand brakes required on the cars.\n(vi) Testing Hand Brake Effectiveness\n      When testing the effectiveness of hand brakes, ensure all air brakes are released and:\n      (a) allow the slack to adjust. It must be apparent when slack runs in or out, that the hand\n           brakes are sufficient to prevent the equipment from moving; or\n      (b) apply sufficient tractive effort to determine that the hand brakes prevent the equipment from\n           moving when tractive effort is terminated.\n      If the effectiveness of hand brakes is not sufficient to prevent the equipment from moving, apply\n      one or more additional hand brakes and re-test.\n\n(a) Main Track, Subdivision Track, Siding or High Risk Locations\n\nEquipment shall be considered unattended and must be secured unless:\n  \u2022 The equipment is coupled to a controlling locomotive; and\n  \u2022 The brake pipe of the controlling locomotive is coupled to the equipment and the brake pipe\n      is open; and\n  \u2022 A qualified employee is on the controlling locomotive and able to operate the air brake\n      system. Alternatively, a locomotive engineer can be located on the ground in accordance\n      with CROR 109 and within arm\u2019s reach of the locomotive to complete passing train/transfer\n      inspections.\n\n   (i) When equipment not connected to an air source is left unattended, at least the minimum\n       number of hand brakes as indicated in (g) must be applied, tested for effectiveness, and at\n       least one of the following additional securement methods must be used:\n              \u2022 derail(s);\n              \u2022 track where rail physically ends;\n              \u2022 bowled terrain as identified in special instructions; or\n              \u2022 air brakes up to 2 hours.\n\n             When air brakes are used as an additional method of securement:\n             \u2022 the air brake system must be sufficiently charged to ensure proper brake\n                  application;\n             \u2022 the brake pipe must be fully vented at a service rate or has an emergency brake\n                  application; and\n             \u2022 on freight equipment, the angle cock is left fully open.\n             If required to be left longer, an employee must observe that the equipment has not\n             moved, the air brake pistons remain extended, and the hand brakes are still\n             applied. Such results must be communicated to another employee. This observation\n             must be carried out at consecutive intervals of 2 hours or less. If any change in the\n             condition of the above three items is observed, additional hand brakes must be\n             applied as indicated in (g), using the next grade column which requires an increased\n             number of hand brakes.\n\n   (ii) When equipment connected to an air source is left unattended, where air pressure is\n        maintained by continuous operation or auto start:\n              \u2022 at least the minimum number of hand brakes as indicated in (g) must be applied\n                 and tested for effectiveness;\n              \u2022 the air brake system must be sufficiently charged to ensure proper brake\n                 application;\n              \u2022 the equipment must be left with air brakes applied; and\n              \u2022 the independent brake on the controlling locomotive must be fully applied.\n\n             In addition, at least one of the following securement methods must be used:\n             \u2022 derails;\n             \u2022 track where rail physically ends;\n             \u2022 a Mechanical Emergency Device;\n             \u2022 bowled terrain as identified in special instructions; or\n             \u2022 a locomotive equipped with roll-away protection.\n\n             When rollaway protection is used as an additional means of securement, the proper\n             authority must be notified. One of the following means of verification must be used to\n             ensure the rollaway protection remains operational:\n             \u2022 When automatic notification is used, it must notify the proper authority when\n                  rollaway protection has been activated, who must arrange for prompt inspection.\n             \u2022 In the absence of the above, an employee must verify that air pressure is\n                  maintained, and a penalty brake application has not occurred. This verification\n                  must be carried out at consecutive intervals of 18 hours or less.\n             If air pressure cannot be maintained, notify the proper authority, and secure the\n             equipment per (a)(i).\n\n(b) Non-Main Tracks (Excluding Subdivision Track, Sidings, Yards and High Risk Locations)\n    When equipment is left unattended, a sufficient number of hand brakes must be applied and\n    tested for effectiveness. Unless otherwise indicated in special instructions, apply a minimum\n    number of hand brakes as indicated in (g).\n\n(c) Yard Tracks\n    When equipment is left unattended in a yard track, to prevent equipment from moving\n    unintentionally, it must be secured by using at least one of the following:\n    \u2022 hand brakes; unless otherwise indicated in special instructions, a minimum number applied\n       as indicated in (g) and tested for effectiveness;\n    \u2022 bowled terrain;\n    \u2022 retarders;\n    \u2022 wheel chocks or skates;\n    \u2022 air brakes, not connected to an air source, for up to 2 hours when:\n        (i) there are 10 or more cars;\n        (ii) the air brake system is sufficiently charged to ensure proper brake application;\n        (iii) the brake pipe is fully vented at a service rate or has an emergency brake application;\n              and\n        (iv) on freight equipment, the angle cock is left fully open.\n        If required to be left longer, an employee must observe that the equipment has not moved,\n        the air brake pistons remain extended, and the hand brakes (when used) are still\n       applied. Such results must be communicated to another employee. This observation must\n       be carried out at consecutive intervals of 2 hours or less. If any change in the condition of\n       the above items is observed, hand brakes must be applied as indicated in (g); or\n    \u2022 air brakes, connected to an air source, where air pressure is maintained by continuous\n       operation or auto start, and a Mechanical Emergency Device is used.\n\n(d) Exceptional weather situations, such as high winds or other unusual conditions, must be\n    factored when determining securement requirements. In addition, previously secured\n    equipment may require additional means of securement. Special instructions may contain\n    location specific requirements where extreme weather events are prevalent.\n\n(e) When advised that trespasser(s) or emergency responder(s) have been in contact with\n    unattended equipment, the person responsible for the territory must make arrangements to\n    have an employee verify the equipment remains secured without delay.\n\n(f) When sudden or unforeseen circumstances do not permit the full application of the\n    requirements of paragraphs (a) or (b), the proper authority must be promptly advised of what\n\naction was taken to secure the equipment, and to determine if additional action can be taken\nprior to leaving equipment unattended.\n\n(i) These circumstances are limited to when:\n    \u2022 a mechanical defect is encountered enroute;\n    \u2022 equipment is derailed or coupled to derailed equipment; or\n    \u2022 separation is required for clearing a crossing for emergency vehicles.\n\n(ii) Additional actions:\n     \u2022 When equipment with a mechanical defect is required to be left, and does not permit the\n        full application of the requirements of paragraph (a) or (b), add one operative hand brake\n        to the minimum number required, for each defective piece of equipment.\n     \u2022 When a mechanical defect requires equipment to be left, and does not permit the full\n        application of the requirements of paragraph (a) or (b); or cannot be conducted safely,\n        the equipment must be secured by applying hand brakes as indicated in (g), using the\n        next grade column which requires an increased number of hand brakes. Additional hand\n        brakes must be applied if those applied do not prevent the equipment from moving.\n\nThe railway company must notify Transport Canada of the time, date, and reason for any\napplication of (f) within 48 hours.\n\n      (g) Minimum Number Requirements for Hand Brakes\n          A single piece of equipment must always be left with the hand brake applied and tested for\n          effectiveness. For two or more pieces of equipment, the following table applies:\n\n Total Trailing                               Average Grade is Equal To or Less Than\n    Tons:         0.2%   0.4%   0.6         title: "Coupling To Equipment",
        parent: "sec:operation-of-movements",
        text: "(a) Before coupling to equipment, precautions must be taken to prevent the equipment from\n      moving unintentionally.\n  (b) When riding the side of equipment, other than a locomotive, detrain prior to making the\n      coupling.\n  (c) Before coupling to equipment, ensure at least one knuckle is open.\n  (d) Unless otherwise specified in special instructions, before coupling to or moving equipment\n      being loaded or unloaded, all persons in or about such equipment must be notified. Vehicles\n      and loading or unloading devices must be clear.\n  (e) Before coupling to or moving service equipment, employees occupying such equipment must\n      be notified and any attachments secured.\n  (f) When coupling to passenger equipment, a stop must be made not less than 6 nor greater than\n      12 feet from the coupling and a speed of 2 MPH must not be exceeded.\n  (g) To prevent by-pass couplers when coupling to equipment on other than tangent track, a stop\n      must be made not less than 6 nor greater than 12 feet from the coupling. Extreme caution must\n      then be used, ensuring couplers are properly aligned prior to the coupling being made.\n  (h) Coupling must be performed at the lowest speed necessary to make the coupling, not\n      exceeding 6 MPH.\n  (i) Prior to leaving, a coupling made with equipment not released under its own momentum must\n      be stretched using sufficient tractive effort to ensure a proper coupling.",

        parent: "113",
        text: "(a) Equipment must be stretched.\n(b) After stretching, and prior to moving, the equipment must be checked:\n    (i) to ensure it is coupled; and\n    (ii) for applied hand brakes as may normally be expected to be present.\n(c) Unless unintentional movement of the equipment can be prevented with the locomotive brakes,\n    hand brakes must not be released until the air brake system is sufficiently charged and an\n    effective Automatic Brake application made to prevent movement while the hand brakes are\n    being released.",
        hash: "dc71b5f639bf",
        page: 54
      },
      {
        id: "113.2(a)",
        kind: "subrule",
        number: "113.2(a)",
        parent: "113.2",
        text: "Equipment must be stretched.",
        hash: "a286f3b481d6"
      },
      {
        id: "113.2(b)",
        kind: "subrule",
        number: "113.2(b)",
        parent: "113.2",
        text: "After stretching, and prior to moving, the equipment must be checked:",
        hash: "a45988cb0a3b"
      },
      {
        id: "113.2(b)(i)",
        kind: "subrule",
        number: "113.2(b)(i)",
        parent: "113.2(b)",
        text: "to ensure it is coupled; and",
        hash: "bf7aed6deaa2"
      },
      {
        id: "113.2(b)(ii)",
        kind: "subrule",

        parent: "113.2(b)",
        text: "for applied hand brakes as may normally be expected to be present.",

      },
      {

        kind: "subrule",
        number: "113.2(c)",
        parent: "113.2",
        text: "Unless unintentional movement of the equipment can be prevented with the locomotive brakes, hand brakes must not be released until the air brake system is sufficiently charged and an effective Automatic Brake application made to prevent movement while the hand brakes are being released.",
        hash: "352aef6a7498"
      },
      {
        id: "113.3",
        kind: "rule",
        number: "113.3",
        title: "Switching With Air Brakes",
        parent: "113",
        text: "(a) Operative air brakes, in addition to the locomotive(s), must be used when switching:\n    (i) on a grade greater than 0.4%; and\n    (ii) with more than 2000 tons.\n(b) Special instructions must indicate:\n    (i) locations where (a)(i) is applicable; and\n    (ii) the minimum number of pieces of equipment, in addition to the locomotive(s), with operative\n         air brakes.",
        hash: "3c507ed5c416",
        page: 54
      },
      {
        id: "113.3(a)",
        kind: "subrule",
        number: "113.3(a)",
        parent: "113.3",
        text: "Operative air brakes, in addition to the locomotive(s), must be used when switching:",

        kind: "subrule",
        number: "113.3(a)(i)",
        parent: "113.3(a)",

      {
        id: "113.3(b)(ii)",
        kind: "subrule",
        number: "113.3(b)(ii)",
        parent: "113.3(b)",
        text: "the minimum number of pieces of equipment, in addition to the locomotive(s), with operative air brakes.",
        hash: "9c0a36918d49"
      },
      {
        id: "113.4",
        kind: "rule",
        number: "113.4",
        title: "Restrictions",
        parent: "113",
        text: "Kicking, running switch, and gravity drop are prohibited:\n(a) on a main track;\n(b) on a subdivision track;\n(c) on a siding;\n(d) at a high risk location;\n(e) on any main shop, diesel shop, or car shop track; and\n(f) onto, or with, passenger equipment.",
        hash: "a73e73c2c2cd",
        page: 54
      },
      {
        id: "113.4(a)",
        kind: "subrule",
        number: "113.4(a)",
        parent: "113.4",
        text: "on a main track;",
        hash: "483712328b67"
      },
      {
        id: "113.4(b)",
        kind: "subrule",
        number: "113.4(b)",
        parent: "113.4",
        text: "on a subdivision track;",
        hash: "1f5f4dff0207"
      },
      {
        id: "113.4(c)",
        kind: "subrule",
        number: "113.4(c)",
        parent: "113.4",
        text: "on a siding;",
        hash: "03350ec614ce"
      },
      {
        id: "113.4(d)",
        kind: "subrule",
        number: "113.4(d)",
        parent: "113.4",
        text: "at a high risk location;",
        hash: "1ec9b1ef0e4a"
      },
      {
        id: "113.4(e)",
        kind: "subrule",
        number: "113.4(e)",
        parent: "113.4",
        text: "on any main shop, diesel shop, or car shop track; and",
        hash: "f7a6f9d82a31"
      },
      {
        id: "113.4(f)",
        kind: "subrule",
        number: "113.4(f)",
        parent: "113.4",
        text: "onto, or with, passenger equipment.",
        hash: "c72280e514d1"
      },
      {
        id: "113.5",
        kind: "rule",
        number: "113.5",
        title: "Kicking Equipment",
        parent: "113",
        text: "(a) On tracks not listed in Rule 113.4, unless otherwise indicated in special instructions, the kicking\n    of equipment is prohibited. At locations where kicking is permitted:\n    (i) The walking surface of the area where equipment is uncoupled must be clear of obstacles.\n    (ii) The track(s) to be used beyond the area where equipment is uncoupled must be flat, and/or\n          descend in grade, to prevent equipment from rolling back and fouling a track previously\n          cleared.\n    (iii) Equipment must be prevented from exiting the intended track at either end.\n    (iv) Routing must prevent equipment kicked from fouling a main track, siding, subdivision track,\n          or a high risk location. This may include the use of switches, derails, switching leads, or\n          other controlled means.\n    (v) Special instructions will indicate the maximum tonnage that may be kicked at one time, as\n          determined by a Company approved process.\n(b) When hand brakes will be used to control the speed of equipment kicked, such hand brakes\n    must first be verified operational.\n\n(c) Equipment kicked must not be left foul of the intended route.\n(d) Once equipment is kicked, no additional equipment may be kicked until it has been confirmed\n    that:\n    (i) the route to be used is properly lined, and\n    (ii) equipment previously kicked is clear of the fouling point of the intended route.\n(e) Precautions must be taken to ensure that equipment kicked remains clear.\n(f) When kicking is completed, equipment must be secured per Rule 112(b) or (c).",
        hash: "106505953cb7",
        page: 54
      },
      {
        id: "113.5(a)",
        kind: "subrule",
        number: "113.5(a)",
        parent: "113.5",
        text: "On tracks not listed in Rule 113.4, unless otherwise indicated in special instructions, the kicking of equipment is prohibited. At locations where kicking is permitted:",

      },

        kind: "subrule",
        number: "113.5(a)(i)",
        parent: "113.5(a)",

        number: "113.5(a)(ii)",
        parent: "113.5(a)",

        hash: "1b57d0c7b718"
      },

        id: "113.5(c)",

        number: "113.5(c)",
        parent: "113.5",

        kind: "subrule",
        number: "113.5(d)",
        parent: "113.5",
        text: "Once equipment is kicked, no additional equipment may be kicked until it has been confirmed that:",

        number: "113.5(d)(i)",
        parent: "113.5(d)",

      },
      {

        kind: "subrule",
        number: "113.5(d)(ii)",
        parent: "113.5(d)",
        text: "equipment previously kicked is clear of the fouling point of the intended route.",
        hash: "65d5136ec06b"
      },
      {
        id: "113.5(e)",
        kind: "subrule",
        number: "113.5(e)",
        parent: "113.5",
        text: "Precautions must be taken to ensure that equipment kicked remains clear.",
        hash: "d269988cc79a"
      },
      {
        id: "113.5(f)",
        kind: "subrule",
        number: "113.5(f)",
        parent: "113.5",
        text: "When kicking is completed, equipment must be secured per Rule 112(b) or (c).",
        hash: "0f674b4ec759"
      },
      {
        id: "113.6",
        kind: "rule",
        number: "113.6",
        title: "Running Switch",
        parent: "113",
        text: "(a) It must be verified that the switch and hand brakes are in working order before the move is\n    commenced.\n(b) A running switch must not be made;\n    (i) with or onto occupied equipment;\n    (ii) with or onto equipment placarded to indicate it contains or contained dangerous goods;\n    (iii) where the switch to be used is a dual control, power-operated or spring switch; or\n    (iv) within interlocking limits of a drawbridge or railway crossing at grade.\n(c) At least 3 employees must be utilized when performing a running switch.",
        hash: "67b1412dd88f",
        page: 55
      },
      {
        id: "113.6(a)",
        kind: "subrule",
        number: "113.6(a)",
        parent: "113.6",
        text: "It must be verified that the switch and hand brakes are in working order before the move is commenced.",

      },
      {

      {
        id: "113.7",
        kind: "rule",
        number: "113.7",
        title: "Gravity Drop",
        parent: "113",
        text: "(a) It must be verified that the hand brakes, when used, are in working order before the move is\n    commenced.\n(b) A gravity drop must not be made with or onto occupied equipment.",
        hash: "47e097a5bcfe",
        page: 55
      },
      {

        kind: "subrule",
        number: "113.7(a)",
        parent: "113.7",
        text: "It must be verified that the hand brakes, when used, are in working order before the move is commenced.",
        hash: "9368f60bb080"
      },
      {
        id: "113.7(b)",
        kind: "subrule",
        number: "113.7(b)",
        parent: "113.7",
        text: "A gravity drop must not be made with or onto occupied equipment.",
        hash: "f8d845f0513e"
      },
      {
        id: "114",
        kind: "rule",
        number: "114",
        title: "Fouling Other Tracks",
        parent: "sec:operation-of-movements",
        text: "(a) Equipment must not be allowed to move foul of another track unless properly protected.\n(b) A movement must not foul a track until the switches connected with the move are properly\n    lined, or in the case of semi-automatic or spring switches, the conflicting route is known to be clear.\n    EXCEPTION: A movement may foul a track connected by a hand operated switch provided that:\n    (i) neither the track occupied nor the track to be fouled are main tracks;\n    (ii) the conflicting route is known to be clear; and\n    (iii) the switch is properly lined before the movement passes over it.\n(c) Equipment must not be left foul of a connecting track unless the switch is left lined for the track\n    upon which such equipment is standing.",
        hash: "d6ee5bd473d0",
        page: 55
      },
      {
        id: "114(a)",
        kind: "subrule",
        number: "114(a)",
        parent: "114",
        text: "Equipment must not be allowed to move foul of another track unless properly protected.",
        hash: "aaa0b30ad766"
      },
      {
        id: "114(b)",
        kind: "subrule",
        number: "114(b)",
        parent: "114",
        text: "A movement must not foul a track until the switches connected with the move are properly lined, or in the case of semi-automatic or spring switches, the conflicting route is known to be clear. EXCEPTION: A movement may foul a track connected by a hand operated switch provided that:",
        hash: "34a1d11d3bb2"
      },
      {
        id: "114(b)(i)",
        kind: "subrule",
        number: "114(b)(i)",
        parent: "114(b)",
        text: "neither the track occupied nor the track to be fouled are main tracks;",

      },
      {
        id: "114(b)(ii)",
        kind: "subrule",
        number: "114(b)(ii)",
        parent: "114(b)",
        text: "the conflicting route is known to be clear; and",
        hash: "cf6b1110b6dc"
      },
      {
        id: "114(b)(iii)",
        kind: "subrule",
        number: "114(b)(iii)",
        parent: "114(b)",
        text: "the switch is properly lined before the movement passes over it.",
        hash: "eb607128b0ea"
      },
      {
        id: "114(c)",
        kind: "subrule",
        number: "114(c)",
        parent: "114",
        text: "Equipment must not be left foul of a connecting track unless the switch is left lined for the track upon which such equipment is standing.",
        hash: "8123c8b4826b"
      },
      {
        id: "115",
        kind: "rule",
        number: "115",
        title: "Shoving Equipment",
        parent: "sec:operation-of-movements",
        text: "(a) When equipment is shoved by an engine or is headed by an unmanned remotely controlled\n    engine, a crew member must be on the leading piece of equipment or on the ground, in a\n    position to observe the track to be used and to give signals or instructions necessary to control\n    the move.\n    EXCEPTION: A crew member need not be so positioned when the portion of the track to be\n    used is known to be clear. However, equipment not headed by an engine must not approach to\n    within 100 feet of any public or private crossing unless such crossings are protected as\n    described in Rule 103 paragraph (b) or (g).\n(b) Known to be clear is defined as seeing the portion of the track to be used as being clear and\n    remaining clear of equipment and as having sufficient room to contain equipment being shoved.\n    This determination must be made by a qualified employee who can observe the track and has\n    radio contact with the employee controlling the movement. Where a track that has been seen to\n    be clear and no access to that track is possible by another movement, the track may be\n    considered as \u201Cknown to be clear\u201D.\n\n    Note: When it can be determined that other movements are not on duty or will not be\n    performing work in the track to be used, the requirement of \u201Cknown to be clear\u201D can be\n    considered to be fulfilled continuously.\n(c) On main track, when equipment is shoved by an engine or is headed by an unmanned remotely\n    controlled engine, unless protected by a crew member as described in paragraph (a), this move must:\n    (i) have the required authority;\n    (ii) not exceed the overall length of the equipment;\n    (iii) not exceed 15 MPH; and\n    (iv) not be made while the leading car is within cautionary limits.\n(d) Unless the route is known to be clear, when reversing with a locomotive consist and visibility is\n    restricted, a member of the crew must be on the leading end and in position from which signals\n    necessary can be properly given.",
        hash: "c14430385f96",
        page: 55
      },
      {
        id: "115(a)",
        kind: "subrule",
        number: "115(a)",
        parent: "115",
        text: "When equipment is shoved by an engine or is headed by an unmanned remotely controlled engine, a crew member must be on the leading piece of equipment or on the ground, in a position to observe the track to be used and to give signals or instructions necessary to control the move. EXCEPTION: A crew member need not be so positioned when the portion of the track to be used is known to be clear. However, equipment not headed by an engine must not approach to within 100 feet of any public or private crossing unless such crossings are protected as described in Rule 103 paragraph (b) or (g).",
        hash: "9c037578a44c"
      },
      {
        id: "115(b)",

        number: "115(b)",

        text: "Known to be clear is defined as seeing the portion of the track to be used as being clear and remaining clear of equipment and as having sufficient room to contain equipment being shoved. This determination must be made by a qualified employee who can observe the track and has radio contact with the employee controlling the movement. Where a track that has been seen to be clear and no access to that track is possible by another movement, the track may be considered as \u201Cknown to be clear\u201D. Note: When it can be determined that other movements are not on duty or will not be performing work in the track to be used, the requirement of \u201Cknown to be clear\u201D can be considered to be fulfilled continuously.",
        hash: "725b5183e74a"
      },
      {

        hash: "f2003a180648"

        number: "115(c)(i)",
        parent: "115(c)",
        text: "have the required authority;",

      {

      },
      {

        number: "115(c)(iii)",
        parent: "115(c)",
        text: "not exceed 15 MPH; and",
        hash: "013362b7163f"
      },
      {
        id: "115(c)(iv)",
        kind: "subrule",
        number: "115(c)(iv)",
        parent: "115(c)",
        text: "not be made while the leading car is within cautionary limits.",
        hash: "b4dab0c6a41b"
      },
      {
        id: "115(d)",
        kind: "subrule",
        number: "115(d)",
        parent: "115",
        text: "Unless the route is known to be clear, when reversing with a locomotive consist and visibility is restricted, a member of the crew must be on the leading end and in position from which signals necessary can be properly given.",
        hash: "3c20e1146a30"
      },
      {
        id: "117",
        kind: "rule",
        number: "117",
        title: "Reliability Tests",
        parent: "sec:radio",
        text: "The crew of a movement when equipped with radios must carry out an intra-crew test of such\n\nradios before leaving their initial terminal, change-off or starting point. When a movement is\nequipped with a single radio, it must be voice tested as soon as practicable after the crew\ncommences duty.",
        hash: "7fc72a528ed9",
        page: 56
      },
      {
        id: "118",
        kind: "rule",
        number: "118",
        title: "Devices Used In Lieu Of Radio",
        parent: "sec:radio",
        text: "When a communication device is used in lieu of a radio, all radio rules are applicable.",
        hash: "2f14567dcd8b",
        page: 56
      },
      {
        id: "119",
        kind: "rule",
        number: "119",
        title: "Continuous Monitoring",
        parent: "sec:radio",
        text: "(a) When not being used to transmit or receive a communication, receivers must be set to the\n    appropriate standby channel and at a volume which will ensure continuous monitoring. When\n    required to use another channel to perform other duties, at least one radio, when practicable,\n    should be set to the designated standby channel to receive emergency communications.\n(b) The volume of a radio receiver should be kept at a level that will avoid annoyance to the public\n    in passenger cars and station facilities.\n(c) Foremen named in Form Y GBO, TOP or clearance must set their radio to \u201Cscan mode\u201D when\n    not being used to communicate with another employee and must otherwise have their radio set\n    to monitor the applicable designated standby channel.",
        hash: "567bb84c6a16",
        page: 56
      },
      {
        id: "119(a)",
        kind: "subrule",
        number: "119(a)",
        parent: "119",
        text: "When not being used to transmit or receive a communication, receivers must be set to the appropriate standby channel and at a volume which will ensure continuous monitoring. When required to use another channel to perform other duties, at least one radio, when practicable, should be set to the designated standby channel to receive emergency communications.",
        hash: "cd0afcf6e06a"
      },
      {
        id: "119(b)",
        kind: "subrule",
        number: "119(b)",
        parent: "119",
        text: "The volume of a radio receiver should be kept at a level that will avoid annoyance to the public in passenger cars and station facilities.",
        hash: "8b4c2a8e6bcf"
      },
      {
        id: "119(c)",
        kind: "subrule",
        number: "119(c)",
        parent: "119",
        text: "Foremen named in Form Y GBO, TOP or clearance must set their radio to \u201Cscan mode\u201D when not being used to communicate with another employee and must otherwise have their radio set to monitor the applicable designated standby channel.",
        hash: "e1557fc3b5ca"
      },
      {
        id: "120",
        kind: "rule",
        number: "120",
        title: "Radio Terms",
        parent: "sec:radio",
        text: "(a) In radio communication the following terms when used will denote:\n    \u201CSTAND BY\u201D - Monitor this channel for my next transmission.\n    \u201COVER\u201D - Transmission is ended and a response is expected.\n    \u201COUT\u201D - Transmission is ended and no response is expected.\n(b) OPTIONAL:\n    Except when radio communication relates to switching operations, when a transmission is\n    complete and a response is expected or required, the transmitting employee must end each\n    transmission with the spoken word \u201COVER\u201D.",

        id: "121",

        title: "Positive Identification",
        parent: "sec:radio",
        text: "(a) The person initiating a radio communication and the responding party must establish positive\n    identification. The initial call must commence with the railway company initials of the person\n    being called.\n    In addition, when a non-railway company person is calling on a company\u2019s channels, they must\n    use their company\u2019s name to identify themselves within the initial transmission.\n(b) The person initiating the radio communication must end the initial call with the spoken word\n    \u201COVER.\u201D\n(c) Each party to a radio communication must end their final transmission with the spoken word\n    \u201COUT.\u201D\n(d) When an authority is requested from the RTC or signalman, communication must include the\n    information required for the issuance of the authority.\n    E.g. name, location, movement designation, required limits, signal number and/or track(s) to be\n    used or entered.",

        id: "123",

        number: "123",
        title: "Verification Procedures",
        parent: "sec:radio",
        text: "(a) When necessary, a repetition, acknowledgement or other response required from a crew\n    member may be checked and confirmed to the RTC by another crew member.\n(b) When GBO, clearances, other authorities or instructions, required to be in writing, are received\n    by radio, they must be verified by the procedures prescribed by their specific rules.\n(c) Except when transmitted by an automated device, or as otherwise provided, when verbal\n    instructions or information affecting the safety of a movement are received by radio, such\n    information must be repeated to the sender.",

        kind: "rule",
        number: "123.1",
        title: "Radio Or Hand Signals",
        parent: "123",
        text: "Before changing between radio or hand signals, a definite understanding as to the method of\ncommunication must be established between crew members giving or receiving instructions. In\ncase of an emergency, either method may be used in addition to that previously arranged.",
        hash: "68706a3d34a0",
        page: 57
      },
      {
        id: "123.2",
        kind: "rule",
        number: "123.2",
        title: "Switching By Radio",
        parent: "123",
        text: "When radio is used to control switching, and after positive identification has been established, the\nfollowing procedures are required:\n(i) direction in relation to the front of the controlling locomotive must be given in the initial\n      instruction and from then on whenever the direction is to change;\n(ii) distance to travel must be given with each communication and increments of less than two car\n      lengths need not be repeated;\n(iii) when the movement has travelled one-half the distance required by the last instruction and no\n      further communication is received, the movement must stop;\n(iv) the indication of block and interlocking signals affecting their movement, must be\n      communicated between crew members while switching;\n(v) doubt as to the meaning of an instruction or for whom it is intended must be regarded as a stop\n      signal; and\n(vi) when car lengths are used to communicate distance, unless otherwise arranged, the distance\n      referred to is 50 feet per car length.",

        id: "125",
        kind: "rule",
        number: "125",
        title: "Emergency Communication Procedures",
        parent: "sec:radio",
        text: "(a) An employee will transmit the word \u201CEMERGENCY\u201D three times at the beginning of the\n    transmission to indicate the report of;\n    (i) an accident involving injury to employees or others;\n    (ii) a condition which may constitute a hazard to employees or others;\n\n    (iii) a condition which may endanger the passage of movements; or\n    (iv) a derailment which has occurred on, or is fouling, a main track.\n(b) When an emergency communication, which is directed to a specific person or movement, has\n    not been acknowledged, any other employee hearing it will, if practicable, relay the\n    communication by any means available. Other employees must not interfere with such\n    communication.\n(c) An emergency communication has absolute priority over other transmissions.",

      {
        id: "127",
        kind: "rule",
        number: "127",
        title: "Conducting Emergency Radio Test",
        parent: "sec:radio",
        text: "(a) In order to ensure emergency communication channels are in operation, and to ensure\n    employees are familiar with the emergency procedures, the RTC may contact a crew member\n    of any movement or an engineering field employee and direct them to initiate an emergency\n    test call on their respective RTC channel.\n(b) These tests will be made randomly and employees receiving a request for an emergency test\n    will initiate it on the applicable RTC channel, using the following example for wording:\n    \u201CEmergency test, Emergency test, Emergency test. ABC 1234 East at mile 12 Canada Sub,\n    testing the Emergency call.\u201D\n(c) Upon completion of the test, the RTC will inform the employee if the test was successful.\n    Employees will then return to their designated standby channel.",

        id: "131",
        kind: "rule",
        number: "131",
        title: "Recording",
        parent: "sec:general-procedures",
        text: "(a) The RTC must maintain indelibly in a book provided for the purpose, or a computer assisted\n    system, a complete record of each GBO, clearance, TOP, authority, instruction and other\n    information that is required to be in writing. The record must be made prior to or during the\n    transmission and never from memory or memoranda, and if required to be sent again, it will be\n    transmitted from the original record. Such records must include original date of issue and\n    acknowledgement(s), when applicable.\n(b) When issuing by voice communication, if an error is detected in the record of a GBO, clearance,\n    TOP, or other authority, and before it has been completed to any employee, the RTC must\n    direct that all copies be immediately destroyed. The record must be marked void. If re-issued,\n    those which require numbering must be given a new number.\n(c) In copying and recording, the spelling of each station name must be exactly as shown in the\n    time table. The RTC, when recording addresses, may use standard station identity letters.\n    Underscoring will be recorded except when verified by a computer assisted system.\n(d) Where a computer assisted system is not in use, all movements authorized by a clearance and\n    all TOP limits must be recorded on a train sheet.",

        number: "131.1",
        title: "Electronic Transmission And Cancellation",
        parent: "131",
        text: "When a GBO, clearance, TOP, other authority, instruction or information is transmitted or cancelled\nusing an ECM and not by voice communication, it will not be repeated to the RTC. When\ntransmitted in this manner, the word \u201Ccomplete\u201D and the initials of the RTC will be generated by the\nECM. When cancelled, the initials of the RTC are not required.",
        hash: "b6db76833e5f",
        page: 59
      },
      {
        id: "132",
        kind: "rule",
        number: "132",
        title: "Brevity, Clarity, Pronunciation And Retention",
        parent: "sec:general-procedures",
        text: "(a) A GBO, clearance, TOP, authority, instruction and its record shall contain only essential\n    information. It must be brief, but clear in its meaning, in the prescribed form when applicable,\n    and without erasure or any condition which may render it difficult to read or understand.\n(b) In transmitting and repeating by voice communication, all words and numbers must be clearly\n    pronounced. When the communication is required to be in writing, numbers will be pronounced\n    in full, then repeated stating each digit separately. Numbers represented by a single digit must\n    be pronounced, then spelled.\n(c) The employee transmitting or repeating communications required to be in writing must regulate\n    the speed of transmission to allow compliance with this rule.\n(d) When an accident or incident occurs, all authorities, GBO or written instructions must be\n    retained until relieved of this requirement by a supervisor.\n(e) When a clearance, TOP or other written instruction or authority is fulfilled, cancelled or\n    superseded;\n    (i) where applicable, other employees must be advised; and\n    (ii) except when displayed electronically:\n         \u2022 an \u201CX\u201D must be immediately drawn across it to avoid further use; or\n         \u2022 when contained within a book, must be marked with a single diagonal line drawn across\n             the page to indicate that it is no longer active and a second diagonal line forming an \u201CX\u201D\n             will be drawn across the page when there are no preceding active items.",

        number: "133",
        title: "Numbering",
        parent: "sec:general-procedures",
        text: "Except where numbering is controlled by computer, each RTC desk in a multiple desk office and\ndesks controlling adjacent territories will use a separate series from other desks for numbering a\n\nGBO, clearance, TOP, authority, instruction or other information which requires numbering. Unless\notherwise provided each series must be numbered consecutively using whole numbers. All\nnumbers in a series may be preceded or followed by a letter(s). Duplicate numbers must not be in\neffect at the same time.",
        hash: "5fb69e6307f0",

      },
      {
        id: "134",
        kind: "rule",
        number: "134",
        title: "Designation Of Movements",
        parent: "sec:general-procedures",
        text: "(a) GBO, clearance or other authority, will be addressed to those who are to execute and observe\n    them. Addresses will be clear and concise and leave no doubt as to whom they are addressed.\n(b) In the body of a GBO or other authority where positive identification is required, the engine\n    number must be included in the designation.\n(c) When the locomotive number is used in the designation, it must, when practicable be the\n    leading locomotive. The number lights of the designated locomotive only will be illuminated at\n    all times.",

        title: "Employees Addressed",

        text: "A GBO, clearance or other authority addressed to a movement must be regarded as being\naddressed to the conductor and locomotive engineer and also to the pilot or snow plow foreman, if\nany. A crew member copying a GBO or clearance must ensure that those addressed receive a\ncopy.\nOPTIONAL A single copy may be made when all crew members are located in the same operating\ncab and such authority is visible and accessible to all crew members.",
        hash: "0ac10a97886d",
        page: 60
      },
      {
        id: "136",
        kind: "rule",
        number: "136",
        title: "Copying, Repeating, Completing And Cancelling",
        parent: "sec:general-procedures",
        text: "(a) The employee copying a GBO, clearance, TOP or other authority from the RTC or the\n    cancellation of same, must copy as it is transmitted and repeat from the copy received all\n    applicable written and pre-printed portions. The spelling of each station name must be exactly\n    as shown in the time table.\n(b) GBO, authorities or instructions must not be copied by the employee operating moving\n    equipment or track units, if it will interfere with the safe operation of such equipment or track\n    unit.\n(c) The RTC must verify each written word and digit each time it is repeated. If correct, the RTC will\n    respond \u201Ccomplete\u201D and the initials of the RTC, which will be recorded and acknowledged by\n    the employee copying. The employee copying must acknowledge by repeating \u201Ccomplete\u201D and\n    the initials of the RTC to the RTC.\n(d) When transmitted by voice communication direct to the crew of a movement, it must not be\n    completed until each crew member copying has correctly repeated it.",
