        kind: "definition",
        title: "Non-Main Track (Nmt)",
        parent: "sec:definitions",
        text: "Any track(s) other than those listed in time table columns as having CTC, OCS, ABS or Cautionary Limits applicable and unless otherwise provided include a requirement to operate at REDUCED speed.",
        hash: "da3ffa00af39"
      },

        kind: "definition",

      },
      {
        id: "def:occupancy-control-system-ocs",
        kind: "definition",
        title: "Occupancy Control System (OCS)",
        parent: "sec:definitions",
        text: "A system in which OCS rules apply. OCCUPATIONAL TERMS: Assistant Conductor An employee working under the supervision of a conductor. May also be referred to as trainman or yardman. Conductor An employee in charge of the operation of a movement. Employee A person qualified to regulatory and company standards employed by the company. Applies to contract employees and employees of other companies and railways operating and/or performing other rules related duties on the host railway trackage. Foreman An employee in charge of the protection of track work and track units. Locomotive Engineer An employee in control of the engine. Pilot An employee assigned to a movement when the locomotive engineer or conductor, or both, are not fully acquainted with the physical characteristics or rules of the railway over which the movement is to be operated. Proper Authority The rail traffic controller or the appropriate railway supervisor.",
        hash: "669de50ffc8d"
      },
      {
        id: "def:rail-traffic-controller-rtc",
        kind: "definition",
        title: "Rail Traffic Controller (RTC)",
        parent: "sec:definitions",
        text: "An employee in charge of the supervision and direction of movements and for the provision of protection for track work and track units on a specified territory. Signalman An employee in charge of an interlocking. Sub-foreman A rules qualified employee that works under the protection held by a foreman. Switchtender An employee that handles switches for other employees. Utility Employee An employee who can be used as a temporary crew member or perform other assigned duties.",
        hash: "32610ace0f70"
      },
      {
        id: "def:running-switch",
        kind: "definition",
        title: "Running Switch",

        text: "Pulling equipment then releasing it under its own momentum.",

      },
      {
        id: "def:schedule",
        kind: "definition",
        title: "Schedule",
        parent: "sec:definitions",
        text: "Information pertaining to the operating times of a passenger train.",

      },
      {
        id: "def:siding",
        kind: "definition",
        title: "Siding",

        text: "A track adjacent and connected to the main track which is so designated in the time table, GBO or operating bulletin.",

      },
      {
        id: "def:siding-control-territory-sct",
        kind: "definition",
        title: "Siding Control Territory (SCT)",
        parent: "sec:definitions",
        text: "Non-signalled sidings indicated in special instructions where SCT rules are applicable.",
        hash: "2d994ce77230"
      },
      {
        id: "def:signalled-siding",
        kind: "definition",
        title: "Signalled Siding",
        parent: "sec:definitions",
        text: "A siding where CTC rules apply.",

      {
        id: "def:signal-indication",
        kind: "definition",
        title: "Signal Indication",

        text: "The information conveyed by a fixed signal.",

      },
      {
        id: "def:single-track",
        kind: "definition",
        title: "Single Track",
        parent: "sec:definitions",
        text: "One main track on a subdivision at a location. SWITCHES: Auto-Normal Switch A locally-controlled switch, which will automatically restore to normal position after a movement has cleared the switch track circuit. Dual Control Switch A switch equipped for powered and hand operation. Electric Switch Lock An electric lock connected with a hand operated switch to prevent its operation until the lock is released. Main Track Hand Operated Switch A switch connected to the main track used to route equipment or a track unit to or from the main track. Normal Reverse Position Position Note: Switch targets may be different shapes than illustrated but must not be diamond shape. Non-Main Track Hand Operated Switch A switch used to route equipment or a track unit within non-main track territory. Normal     Reverse Position    Position Note: Switch targets may be different shapes than illustrated but must not be diamond shape. Power-Operated Switch A switch equipped for powered operation, but not equipped for hand operation. Semi-Automatic Switch A non-main track switch equipped with an internal securing mechanism that permits equipment to trail through the switch points thus setting the switch for the route being used. Set for Set for Other Normal Than Normal Route          Route Note: Switch targets must be diamond shaped. Spring Switch A switch equipped with a spring mechanism arranged to restore the switch points to normal position after having been trailed through. Switch A device used to route equipment or a track unit from one track to another. SPEEDS:",

      },

        title: "Diverging Speed",

        text: "A speed not exceeding 25 miles per hour.",

        id: "def:limited-speed",

        title: "Limited Speed",

        text: "A speed not exceeding 45 miles per hour.",

      },
      {

        title: "Medium Speed",

      },

        id: "def:restricted-speed",
        kind: "definition",
        title: "Restricted Speed",
        parent: "sec:definitions",
        text: "A speed that will permit stopping within one-half the range of vision of equipment, also prepared to stop short of a switch not properly lined and in no case exceeding SLOW speed. When moving at RESTRICTED speed, be on the lookout for broken rails. When a broken rail is detected, the movement must be stopped immediately and must not resume until permission is received from the RTC or signalman.",

        id: "def:slow-speed",

      {
        id: "def:track-occupancy-permit-top",
        kind: "definition",
        title: "Track Occupancy Permit (TOP)",
        parent: "sec:definitions",
        text: "Authority issued for the protection of track units and track work.",
        hash: "fc32c7a5777b"
      },
      {
        id: "def:track-unit-tu",
        kind: "definition",
        title: "Track Unit (Tu)",
        parent: "sec:definitions",
        text: "A vehicle or machine capable of on-track operation utilized for track inspection, track work and other railway activities when on a track.",

      {
        id: "def:track-unit-speed",
        kind: "definition",
        title: "Track Unit Speed",
        parent: "sec:definitions",
        text: "A speed that; (a) permits a track unit to stop within one-half the range of vision of equipment or a track unit; (b) permits a track unit to stop short of a switch not properly lined or any obstruction or track defect that may prevent safe passage; and (c) does not exceed maximum authorized speed for that track unit. Track units handling equipment must not exceed the lesser of; authorized freight, passenger or temporary speed restrictions. The delivery method for temporary speed restrictions will be indicated in special instructions.",
        hash: "ee3cbcb4759f"
      },
      {
        id: "def:track-work",
        kind: "definition",
        title: "Track Work",
        parent: "sec:definitions",
        text: "Any work on or near the track that may render the track unsafe for movements at normal speed or where protection against movements may be required for employees and machines involved in track construction and repairs.",
        hash: "9be73c434d38"
      },
      {
        id: "def:trailing-end",
        kind: "definition",
        title: "Trailing End",
        parent: "sec:definitions",
        text: "The tail end of the last piece of equipment in a movement in the direction of travel.",
        hash: "75fbf99e671a"
      },
      {
        id: "def:train",
        kind: "definition",
        title: "Train",
        parent: "sec:definitions",
        text: "An engine with or without cars intended to operate on the main track at speeds in excess of 15 MPH or a track unit when so designated.",
        hash: "a8df880123fd"
      },
      {
        id: "def:train-information-braking-system-tibs",
        kind: "definition",
        title: "Train Information Braking System (Tibs)",
        parent: "sec:definitions",
        text: "A system with rear and front communication components capable of: (i) monitoring and displaying brake pipe pressure on the rear car; (ii) calculating and displaying distance measurement; (iii) initiating an emergency brake application at the rear of the train from the controlling locomotive.",
        hash: "eb88d2d3ec7b"
      },
      {
        id: "def:transfer",
        kind: "definition",
        title: "Transfer",
        parent: "sec:definitions",
        text: "An engine with or without cars operating on main track at speeds not exceeding 15 MPH.",
        hash: "835052f7156c"
      },
      {
        id: "def:unattended",
        kind: "definition",
        title: "Unattended",
        parent: "sec:definitions",
        text: "When an employee is not in close enough proximity to take effective action.",
        hash: "83cf5b7eb9ee"
      },
      {
        id: "def:yard",
        kind: "definition",
        title: "Yard",
        parent: "sec:definitions",
        text: "A system of non-main tracks, utilized to switch equipment and for other purposes over which movements may operate subject to prescribed signals, rules and special instructions.",
        hash: "56b2874ef810"
      },
      {
        id: "A",
        kind: "general",
        number: "A",
        parent: "sec:general-rules",
        text: "Every employee in any service connected with movements, handling of main track switches and\n  protection of track work and track units shall;\n  (i)    be subject to and conversant with applicable CROR rules, special instructions and\n         general operating instructions;\n  (ii)   have a copy of this rule book, the general operating instructions, current time table and\n         any supplements, and other documents specified by the company accessible while on\n         duty;\n  (iii) provide every possible assistance to ensure every rule, special instruction and general\n         operating instruction is complied with and shall report promptly to the proper authority any\n         violations thereof;\n  (iv) communicate by the quickest available means to the proper authority any condition which\n         may affect the safe operation of a movement and be alert to the company\u2019s interest and\n         join forces to protect it;\n  (v)    obtain assistance promptly when it is required to control a harmful or dangerous\n         condition;\n  (vi) be conversant with and governed by every safety rule and instruction of the company\n         pertaining to their occupation;\n  (vii) pass the required examination at prescribed intervals, not to exceed three years, and\n         carry while on duty, a valid certificate of rules qualification;\n  (viii) seek clarification from the proper authority if in doubt as to the meaning of any rule or\n         instruction;\n  (ix) conduct themselves in a courteous and orderly manner;\n  (x)    when reporting for duty, be fit, rested and familiar with their duties and the territory over\n         which they operate;\n  (xi) while on duty, not engage in non-railway activities which may in any way distract their\n         attention from the full performance of their duties. Except as provided for in company\n         policies, sleeping or assuming the position of sleeping is prohibited. The use of personal\n         entertainment devices is prohibited. Printed material not connected with the operation of\n         movements or required in the performance of duty, must not be openly displayed or left in\n         the operating cab of a locomotive or track unit or at any work place location utilized in\n         train, transfer or engine control; and\n  (xii) restrict the use of communication devices to matters pertaining to railway operations.\n         Cellular telephones must not be used when normal railway radio communications are\n         available. When cellular telephones are used in lieu of radio all applicable radio rules\n         must be complied with.",
        hash: "307de225f138"
      },
      {
        id: "B",
        kind: "general",
        number: "B",
        parent: "sec:general-rules",
        text: "Special Instructions will be found in time tables, general operating instructions, operating\n  bulletins or GBO. They may be appended to or included within copies of the Canadian Rail\n  Operating Rules but do not diminish the intent of the rule unless official exemption has been\n  granted.",
        hash: "b75c12c56369"
      },
      {
        id: "C",
        kind: "general",
        number: "C",
        parent: "sec:general-rules",
        text: "Employees must:\n   (i) be vigilant to avoid the risk of injury to themselves or others;\n   (ii) expect a movement, track unit or equipment to move at any time, on any track, in either\n          direction;\n   (iii) not stand in front of approaching equipment for the purpose of entraining;\n   (iv) not ride the side or above the roof of moving equipment when passing side and/or\n          overhead restrictions;\n   (v) not be on the roof of moving equipment, or on the lading of a moving open top car;\n   (vi) not be on the end of a car while in motion except for the purpose of operating a hand\n          brake; and\n   (vii) not ride on any car known or suspected to contain a shifted load or damaged such that\n          its structure or components may not be secure, or any car trailing such car.\n   (viii) not entrain or detrain moving equipment at a speed exceeding 4 MPH except in the case\n          of an emergency. The intent to entrain or detrain moving equipment must be\n          communicated to the locomotive engineer, who must confirm when the speed is less\n          than 4 MPH.",
        hash: "738826bdb06c"
      },
      {
        id: "D",
        kind: "general",
        number: "D",
        parent: "sec:general-rules",
        text: "Each employee must be acquainted with, and be on the lookout for, restricted side and\n  overhead clearances. Where standard restricted clearance signs are used, no other advice of\n  restricted clearance will elsewhere or otherwise be given. If such signs are not provided in a\n  yard or terminal, the location of the restricted clearance will be shown in special instructions.",
        hash: "d0bb261ce59f"
      },
      {
        id: "E",
        kind: "general",
        number: "E",
        parent: "sec:general-rules",
        text: "Overhead and side clearance may be restricted on a track at a main shop, diesel shop or car\n  shop. Where restricted clearance exists on such track, it will not be marked by a standard\n  restricted clearance sign nor will its location be elsewhere or otherwise given.",
        hash: "96d9082838d4"
      },
      {
        id: "F",
        kind: "general",
        number: "F",
        parent: "sec:general-rules",
        text: "Employees must not ride on top or side of equipment when on any main shop, diesel shop or\n  car shop track, whether or not the overhead and side clearance is restricted.",
        hash: "f19eb53cf126"
      },
      {
        id: "G",
        kind: "general",
        number: "G",
        parent: "sec:general-rules",
        text: "(i) The use of intoxicants or narcotics by employees subject to duty, or their possession or use\n          while on duty, is prohibited.\n    (ii) The use of mood altering agents by employees subject to duty, or their possession or use\n          while on duty, is prohibited except as prescribed by a doctor.\n    (iii) The use of drugs, medication or mood altering agents, including those prescribed by a\n          doctor, which, in any way, will adversely affect their ability to work safely, by employees\n          subject to duty, or on duty, is prohibited.\n    (iv) Employees must know and understand the possible effects of drugs, medication or mood\n          altering agents, including those prescribed by a doctor, which, in any way, will adversely\n          affect their ability to work safely.",
        hash: "4f547de85872"
      },
      {
        id: "H",
        kind: "general",
        number: "H",
        parent: "sec:general-rules",
        text: "Unless otherwise specified, these rules are applicable without respect to the number of main\n  tracks.",
        hash: "2d6e8303a2e9"
      },
      {
        id: "I",
        kind: "general",
        number: "I",
        parent: "sec:general-rules",
        text: "Rules pertaining to the main track also apply to tracks specified as signalled sidings and other\n    signalled tracks.",
        hash: "8203e97c00ab"
      },
      {
        id: "J",
        kind: "general",
        number: "J",
        parent: "sec:general-rules",
        text: "When an Electronic Communications Method (ECM) is used, each transmission received must\n  be examined to ensure legibility. If the transmission is not legible this must immediately be\n  reported to, and retransmitted by, the RTC. Illegible transmissions must not be used and in the\n  case of paper based authorities, must be destroyed.",
        hash: "031255fb5cb1"
      },
      {
        id: "K",
        kind: "general",
        number: "K",
        parent: "sec:general-rules",
        text: "When the term \u201Cin writing\u201D is used in these rules, special instructions and general operating\n  instructions, if the written permission, authority or instruction referred to is not received\n  personally by the receiving employee, it must be copied by the receiving employee and\n  repeated back to the sender to ensure it was correctly received.",
        hash: "0c3216ed0125"
      },
      {
        id: "L",
        kind: "general",
        number: "L",
        parent: "sec:general-rules",
        text: "Wherever the following occupational names or titles appear in these rules, special instructions,\n  or general operating instructions, they apply to the employee, who is qualified and is\n  responsible for performing the duties of:\n  conductor,\n  assistant conductor,\n  flagman,\n  foreman,\n  locomotive engineer,\n  pilot,\n  rail traffic controller,\n  signalman,\n  snow plow foreman,\n  sub-foreman,\n  switchtender.",
        hash: "41c5bef9a57e"
      },
      {
        id: "M",
        kind: "general",
        number: "M",
        parent: "sec:general-rules",
        text: "Wherever the following: engine, train, transfer or movement appear in these rules, special\n  instructions or general operating instructions, the necessary action will be carried out by a crew\n  member or crew members of the movement. In addition:\n  (i) where only one crew member is employed, operating rules and instructions requiring joint\n        compliance may be carried out by either the locomotive engineer or conductor, and\n  (ii) in the absence of a locomotive engineer on a crew consisting of at least two members, the\n        conductor will designate another qualified employee to perform the rules required duties of\n        the locomotive engineer.\n  (iii) the minimum operating crew requirement for a freight train or transfer carrying one or more\n        loaded tank cars of dangerous goods is two (2) crew members.\n  (iv) the minimum operating crew requirement for a transfer using remote control locomotives\n        (excluding distributed power) is two crew members.",
        hash: "4a8109ecb40f"
      },
      {
        id: "N",
        kind: "general",
        number: "N",
        parent: "sec:general-rules",
        text: "The following abbreviations and acronyms as well as those authorized by special instructions\n  may be used:\n  ABS             Automatic Block Signal System\n   ack              Acknowledgement\n   ANS              Auto Normal Switch\n   AWD              Automatic Warning Devices\n   B/E CTC Sign     Begin/End CTC Sign\n   B/E MT Sign      Begin/End Main Track Sign\n   CL Sign          Cautionary Limit Sign\n   cndr             Conductor\n   com              Complete\n   CTC              Centralized Traffic Control System\n\nDOB    Daily Operating Bulletin\nE      East\nECM    Electronic Communications Method\neng    Engine\nengr   Locomotive engineer\nexp    Express\nFIT    Field Information Terminal\nfrmn   Foreman\nfrt    Freight\nGBO    General Bulletin Order(s)\nHBD    Hot Box and Dragging Equipment Detector\njct    Junction\nLCS    Local Control Switch\nMPH    Miles per hour\nMP     Mile Post\nN      North\nNA     Not Applicable\nNMT    Non-main Track\nno     Number\nOCS    Occupancy Control System\npsgr   Passenger\nrpt    Repeat\nRTC    Rail Traffic Controller\nSCS    Special Control System\nSCT    Siding Control Territory\nSNS    Station Name Sign\nS      South\nsdg    Siding\nSI     Special Instruction\nSTK    Subdivision Track\nsub    Subdivision\nswt    Switch\nTGBO   Tabular General Bulletin Order\nTIBS   Train Information Braking System\n\n   TOP              Track Occupancy Permit\n   trk              Track\n   trnm             Trainman\n   TU               Track Unit\n   W                 West\n   wk                Work\n   xover             Crossover\n   xing              Crossing\n\n   RTC may use approved office abbreviations for station and subdivision names and for\n   controlled points when entering addresses on computer generated forms. The normal\n   abbreviations for days of the week and calendar months may be used.",
        hash: "d81788c09c3f"
      },
      {
        id: "O",
        kind: "general",
        number: "O",
        parent: "sec:general-rules",
        text: "In these rules when the distance prescribed for the placement of signals, signs or flags is not\n  possible due to track configuration, the maximum distance available applies. If the maximum\n  distance available will place an advance flag at the same location as the flag it governs the\n  approach to, such advance flag need not be placed but such must be indicated in the GBO.",
        hash: "b98a771d45d2"
      },
      {
        id: "1",
        kind: "rule",
        number: "1",
        title: "Time",
        parent: "sec:time-and-time-tables",
        text: "The 24 hour system will be used and will be expressed in four digits. The digits 2359 or 0001 will\nbe used to express the time at midnight.",
        hash: "006afe07358a",
        page: 22
      },
      {
        id: "2",
        kind: "rule",
        number: "2",
        title: "Watches",
        parent: "sec:time-and-time-tables",
        text: "Every conductor, assistant conductor, locomotive engineer, pilot, foreman, snow plow foreman and\nsuch other employees as the company may direct, shall, when on duty, use a reliable watch that\nindicates hours, minutes and seconds and shall;\n(i) be responsible to ensure that it is kept in proper working condition so that it does not reflect a\n      variation of more than 30 seconds in a 24 hour period;\n(ii) set it to reflect the correct time if it reflects a variation of more than 30 seconds;\n(iii) before commencing work, compare the time on their watch with a railway approved time\n      source. Where a railway approved time source is not accessible, obtain the correct time from\n      the RTC or by comparing with another employee who has obtained the correct time. Every crew\n      member assigned to train, transfer or yard service shall compare the time with one another as\n      soon as possible after commencing work.",
        hash: "365a858784b0",
        page: 22
      },
      {
        id: "2(i)",
        kind: "subrule",
        number: "2(i)",
        parent: "2",
        text: "be responsible to ensure that it is kept in proper working condition so that it does not reflect a variation of more than 30 seconds in a 24 hour period;",
        hash: "9743597ec54f"
      },
      {
        id: "2(ii)",
        kind: "subrule",
        number: "2(ii)",
        parent: "2",
        text: "set it to reflect the correct time if it reflects a variation of more than 30 seconds;",
        hash: "3b4d827894f0"
      },
      {
        id: "2(iii)",
        kind: "subrule",
        number: "2(iii)",
        parent: "2",
        text: "before commencing work, compare the time on their watch with a railway approved time source. Where a railway approved time source is not accessible, obtain the correct time from the RTC or by comparing with another employee who has obtained the correct time. Every crew member assigned to train, transfer or yard service shall compare the time with one another as soon as possible after commencing work.",
        hash: "7c41d800e0d1"
      },
      {
        id: "3",
        kind: "rule",
        number: "3",
        title: "Time In Effect",
        parent: "sec:time-and-time-tables",
        text: "Special instructions will indicate whether Standard Time, Daylight Saving Time or other designated\ntime is in effect.",
        hash: "4e3e63efc4c5",
        page: 22
      },
      {
        id: "4",
        kind: "rule",
        number: "4",
        title: "Notice Of Time Change",
        parent: "sec:time-and-time-tables",
        text: "Notice of time change will be given by operating bulletin and posted at least 72 hours prior to the\ntime change taking effect. Notice will also be given by GBO at least 24 hours prior to the change\nand for not less than 6 days after it takes effect.",
        hash: "e8544a9a65d7",
        page: 22
      },
      {
        id: "5",
        kind: "rule",
        number: "5",
        title: "Employees On Duty When Time Changes",
        parent: "sec:time-and-time-tables",
        text: "Each employee on duty when time changes, who is required to use a watch, must change time as\nfollows:\n(i) From Standard Time to Daylight Saving Time: At 0200 Standard Time, set the time ahead one\n     hour to indicate 0300 Daylight Saving Time;\n(ii) From Daylight Saving Time to Standard Time: At 0200 Daylight Saving Time, set the time back\n     one hour to indicate 0100 Standard Time;\n     and immediately verify correct time according to Rule 2 clause (iii).",
        hash: "cddcef0eaa44",
        page: 22
      },
      {
        id: "5(i)",
        kind: "subrule",
        number: "5(i)",
        parent: "5",
        text: "From Standard Time to Daylight Saving Time: At 0200 Standard Time, set the time ahead one hour to indicate 0300 Daylight Saving Time;",
        hash: "f3b5c8c446f4"
      },
      {
        id: "5(ii)",
        kind: "subrule",
        number: "5(ii)",
        parent: "5",
        text: "From Daylight Saving Time to Standard Time: At 0200 Daylight Saving Time, set the time back one hour to indicate 0100 Standard Time; and immediately verify correct time according to Rule 2 clause (iii).",
        hash: "120268be8dfe"
      },
      {
        id: "6",
        kind: "rule",
        number: "6",
        title: "Time Tables",
        parent: "sec:time-and-time-tables",
        text: "Each time table, from the moment it takes effect, supersedes the preceding time table.",
        hash: "dfefd229d5e9",
        page: 22
      },
      {
        id: "7",
        kind: "rule",
        number: "7",
        title: "Notice Of New Time Table Or Supplement",
        parent: "sec:time-and-time-tables",
        text: "Notice will be given by operating bulletin and posted at least 72 hours prior to a new time table or\nsupplement taking effect. Notice will also be given by GBO at least 24 hours prior to the new time\ntable or supplement taking effect and for not less than 6 days after it takes effect.\nNotice must also be communicated to all other affected employees.",
        hash: "5c31828a4665",
        page: 22
      },
      {
        id: "8",
        kind: "rule",
        number: "8",
        title: "Symbols And Diagrams",
        parent: "sec:time-and-time-tables",
        text: "(a) The following symbols when used in the time table indicate:\n    B Operating bulletins\n    C Cautionary limits\n    D Trains or Transfers report departure to RTC\n    S Special Derail\n    X Crossover between main tracks\n    Y Wye\n    * See footnote\n    + Interlocking - see footnotes.\n(b) Method of control and the limits of single track or multi-track will be indicated in the time table.\n(c) The location of each interlocking, non-interlocked drawbridge and non-interlocked railway\n    crossing at grade will be indicated in subdivision footnotes or special instructions.\n(d) Siding capacity and the extent of Cautionary Limits, TGBO and DOB limits will be indicated in\n    time table columns, to the side of the station column or in subdivision footnotes.",
        hash: "114272b6d986",
        page: 23
      },
      {
        id: "8(a)",
        kind: "subrule",
        number: "8(a)",
        parent: "8",
        text: "The following symbols when used in the time table indicate: B Operating bulletins C Cautionary limits D Trains or Transfers report departure to RTC S Special Derail X Crossover between main tracks Y Wye * See footnote + Interlocking - see footnotes.",
        hash: "c1ad1d8ceb4a"
      },
      {
        id: "8(b)",
        kind: "subrule",
        number: "8(b)",
        parent: "8",
        text: "Method of control and the limits of single track or multi-track will be indicated in the time table.",
        hash: "1ac06912517c"
      },
      {
        id: "8(c)",
        kind: "subrule",
        number: "8(c)",
        parent: "8",
        text: "The location of each interlocking, non-interlocked drawbridge and non-interlocked railway crossing at grade will be indicated in subdivision footnotes or special instructions.",
        hash: "d1e8db4f5dc6"
      },
      {
        id: "8(d)",
        kind: "subrule",
        number: "8(d)",
        parent: "8",
        text: "Siding capacity and the extent of Cautionary Limits, TGBO and DOB limits will be indicated in time table columns, to the side of the station column or in subdivision footnotes.",
        hash: "8ba69c4e7b49"
      },
      {
        id: "11",
        kind: "rule",
        number: "11",
        title: "Fusees",
        parent: "sec:signals-general",
        text: "(a) A movement approaching a red fusee burning on or near its track, or beyond the nearest rail of\n    an adjacent track, must proceed at REDUCED speed to a point two miles beyond the location\n    of the fusee. If moving at other than REDUCED speed, the movement must immediately reduce\n    to that speed.\n(b) A fusee should not be placed on a public crossing at grade or where it may cause fire.\n(c) OPTIONAL\n    When the fusee is located on the track occupied by an approaching movement operating at\n    REDUCED or RESTRICTED speed as required by other than Rule 11, a stop must be made\n    before passing the location of the fusee.",
        hash: "ca9b854987b6",
        page: 24
      },
      {
        id: "11(a)",
        kind: "subrule",
        number: "11(a)",
        parent: "11",
        text: "A movement approaching a red fusee burning on or near its track, or beyond the nearest rail of an adjacent track, must proceed at REDUCED speed to a point two miles beyond the location of the fusee. If moving at other than REDUCED speed, the movement must immediately reduce to that speed.",
        hash: "01868d250d7b"
      },
      {
        id: "11(b)",
        kind: "subrule",
        number: "11(b)",
        parent: "11",
        text: "A fusee should not be placed on a public crossing at grade or where it may cause fire.",
        hash: "ba38ef1e7c81"
      },
      {
        id: "11(c)",
        kind: "subrule",
        number: "11(c)",
        parent: "11",
        text: "OPTIONAL When the fusee is located on the track occupied by an approaching movement operating at REDUCED or RESTRICTED speed as required by other than Rule 11, a stop must be made before passing the location of the fusee.",
        hash: "42f8ffc69611"
      },
      {
        id: "12",
        kind: "rule",
        number: "12",
        title: "Hand Signals",
        parent: "sec:signals-general",
        text: "(a) Employees whose duties may require them to give hand signals must have the proper\n    appliances, keep them in good order and ready for immediate use. Night signals must be used\n    from sunset to sunrise and when day signals cannot be plainly seen.\n    Note: The hand or a flag displayed in the same manner as the lantern, which is illustrated in the\n    following diagrams, gives the same indication.\n\n                             METHOD OF DISPLAY AND INDICATION\n\n      (i) Swung from side to side at right angle to the track.\n\n                       STOP\n\n      (ii) Swung in a circle at right angle to the track at a speed in proportion to the speed\n           required.\n\n                MOVE BACKWARD\n      (iii) Raised and lowered at a speed in proportion to the speed required.\n\n                  MOVE FORWARD\n\n       (iv) Raised and swung horizontally above the head, at right angle to the track when standing.\n\n                   APPLY AIR BRAKES\n\n       (v) Raised and held at arm\u2019s length above the head when standing.\n\n                    RELEASE AIR BRAKES\n\n       (vi) Held horizontally at arm\u2019s length.\n\n                   REDUCE SPEED\n\n        (vii) Any object waved violently by anyone on or near the track is a signal to stop.\n(b) A signal given to move forward or move backward must be given in relation to the front of the\n    controlling locomotive.\n(c) A signal must be given in sufficient time before the required action to permit compliance. It must\n    be given from a point where it can be plainly seen, and in such a manner that it cannot be\n    misunderstood. If there is doubt as to the meaning of a signal, or for whom it is intended, it must\n    be regarded as a stop signal.\n(d) Whenever practicable, when switching is being performed, required signals shall be given\n    directly to the locomotive engineer.\n(e) When moving under the control of hand signals, the disappearance from view of either the crew\n    member or lights by which signals controlling the movement are being given, must be regarded\n    as a stop signal.\n(f) A crew member, whose movement is clear of the main track, must not give an approaching\n    movement a hand signal to move forward.\n(g) Where radio is used in lieu of hand signals, employees will be governed by Rule 123.1.",
        hash: "93504aab9a4d",
        page: 24
      },
      {
        id: "12(a)",
        kind: "subrule",
        number: "12(a)",
        parent: "12",
        text: "Employees whose duties may require them to give hand signals must have the proper appliances, keep them in good order and ready for immediate use. Night signals must be used from sunset to sunrise and when day signals cannot be plainly seen. Note: The hand or a flag displayed in the same manner as the lantern, which is illustrated in the following diagrams, gives the same indication. METHOD OF DISPLAY AND INDICATION",
        hash: "776a26e2b11f"
      },
      {
        id: "12(a)(i)",
        kind: "subrule",
        number: "12(a)(i)",
        parent: "12(a)",
        text: "Swung from side to side at right angle to the track. STOP",
        hash: "cfcdc2ae7bd8"
      },
      {
        id: "12(a)(ii)",
        kind: "subrule",
        number: "12(a)(ii)",
        parent: "12(a)",
        text: "Swung in a circle at right angle to the track at a speed in proportion to the speed required. MOVE BACKWARD",
        hash: "05c63e2f5857"
      },
      {
        id: "12(a)(iii)",
        kind: "subrule",
        number: "12(a)(iii)",
        parent: "12(a)",
        text: "Raised and lowered at a speed in proportion to the speed required. MOVE FORWARD",
        hash: "65df92bbeaba"
      },
      {
        id: "12(a)(iv)",
        kind: "subrule",
        number: "12(a)(iv)",
        parent: "12(a)",

      {
        id: "12(b)",
        kind: "subrule",
        number: "12(b)",
        parent: "12",
        text: "A signal given to move forward or move backward must be given in relation to the front of the controlling locomotive.",

      },
      {
        id: "12(c)",
        kind: "subrule",
        number: "12(c)",
        parent: "12",
        text: "A signal must be given in sufficient time before the required action to permit compliance. It must be given from a point where it can be plainly seen, and in such a manner that it cannot be misunderstood. If there is doubt as to the meaning of a signal, or for whom it is intended, it must be regarded as a stop signal.",

      },
      {
        id: "12(d)",
        kind: "subrule",
        number: "12(d)",
        parent: "12",
        text: "Whenever practicable, when switching is being performed, required signals shall be given directly to the locomotive engineer.",

      },
      {
        id: "12(e)",
        kind: "subrule",
        number: "12(e)",
        parent: "12",
        text: "When moving under the control of hand signals, the disappearance from view of either the crew member or lights by which signals controlling the movement are being given, must be regarded as a stop signal.",

        id: "12(f)",
        kind: "subrule",

        kind: "subrule",
        number: "12(g)",

        text: "Where radio is used in lieu of hand signals, employees will be governed by Rule 123.1.",

      {
        id: "13",
        kind: "rule",
        number: "13",
        title: "Engine Bell",
        parent: "sec:signals-general",
        text: "(a) The engine bell must be rung when:\n      (i) an engine is about to move, except when switching requires frequent stopping and starting\n            after the initial move;\n      (ii) passing any movement standing on an adjacent track;\n      (iii) approaching, passing or moving about station facilities or shop track areas; and\n      (iv) one-quarter of a mile from every public crossing at grade (except within limits as may be\n            prescribed in special instructions) until the crossing is fully occupied by the engine or cars.\n            At crossings where engine whistle signal 14(l) is applicable the engine bell need not be\n            rung.\n(b) Should the engine bell fail on the lead locomotive in the consist, repairs must be made as\n    quickly as possible. If repairs cannot be made the movement may proceed to the first point\n    where repairs can be made. The engine bell if available on another locomotive in the consist\n    will be rung continuously or operated by another member of the crew, when available, under the\n    direction of the locomotive engineer.",
        hash: "75db1fe7e8e8",
        page: 26

        text: "NOTE:\n(i) Wherever the words \u201Cengine whistle\u201D appear in these rules they also refer to \u201Cengine horn\u201D.\n      Signals prescribed by this rule are illustrated by \u201Co\u201D for short sounds; \u201C \u201D for longer sounds.\n(ii) Engine whistle signals must be sounded as prescribed by this rule, and should be distinct, with\n      intensity and duration proportionate to the distance the signal is to be conveyed. Unnecessary\n      use of the whistle is prohibited.\n(iii) Radio must not be used in lieu of engine whistle signals for indications prefixed by the symbol\n      (#).\n\n(a)                                 o\n    When standing - braking system is equalized; angle cock may be closed.\n(b)                                  oo\n    Note: Not applicable when switching.\n    (i) Answer to a \u201Cstop\u201D signal (except a fixed signal).\n    (ii) Answer to any signal not otherwise provided for.\n(e)                             ooo ooo\n    To notify track forces of fire on or near the right of way (to be repeated as often as required).\n(f)                   Succession of short sounds\n    (#) Alarm for persons or animals on or near the track.\n(l)                                     o\n    (i) (#)At public crossings at grade:\n          A whistle post will be located 1/4 mile before each public crossing where required. Whistle\n          signal must be sounded by movements:\n          \u2022 exceeding 44 MPH, at the whistle post\n          \u2022 operating at 44 MPH or less, in order to provide 20 seconds warning prior to entering the\n              crossing.\n          Whistle signal must be prolonged or repeated until the crossing is fully occupied.\n          EXCEPTION: Not applicable when manual protection is to be provided or when shoving\n          equipment other than a snow plow over a crossing protected by automatic warning devices.\n    (ii) (#) At other whistle posts indicated in special instructions.\n    (iii) (#) At frequent intervals when view is restricted by weather,\n          curvature or other conditions.\n    (iv) Special instructions will govern when such signal is prohibited in whole or in part.\n(r) In case of engine whistle failure the engine bell must be rung continuously;\n\n    (i) approaching and moving through curves; and\n    (ii) approaching and passing station facilities, yards and public crossings at grade. In addition,\n         the movement must not exceed 25 MPH entering each public crossing at grade which is not\n         protected by automatic warning devices, until such crossing is fully occupied.\n(t) When a snow plow is operated ahead of an engine, the employee in charge of the snow plow\n    must sound engine whistle signals 14(f) and 14(l). All other engine whistle signals must be\n    sounded by the locomotive engineer as prescribed by the rule.",

        id: "17",
        kind: "rule",
        number: "17",
        title: "Headlight",
        parent: "sec:signals-general",
        text: "Movements headed by equipment equipped with a headlight must display the headlight:\n(a) at full power in the direction of travel approaching all public crossings at grade until such\n    crossings are fully occupied;\n(b) at full power in the direction of travel while moving on the main track;\n(c) on both ends of the engine while moving on non-main track but may be extinguished on the end\n    coupled to cars.\nExceptions: When not approaching a public crossing at grade the headlight may be extinguished or\ndimmed:\n(i) approaching or being approached by an opposing movement;\n(ii) on a passenger carrying train, approaching a location where passengers will entrain or detrain;\n(iii) facing oncoming vehicles at night which may be affected on adjacent roadways; or\n(iv) when weather conditions cause the vision of the operating crew to be impaired.",
        hash: "b64635f3232d",
        page: 27
      },
      {
        id: "17(a)",
        kind: "subrule",
        number: "17(a)",

      },

        id: "18",
        kind: "rule",
        number: "18",
        title: "Headlight Failure",
        parent: "sec:signals-general",
        text: "(a) If the headlight on a movement fails and repairs cannot be made, ditch lights will be used in lieu\n    of the headlight and the movement may proceed.\n(b) If all headlights and ditch lights have failed, such lights as are available must be used\n    proceeding to the first point where repairs can be made. At public and private crossings at\n    grade not protected by automatic warning devices, movements must not exceed 10 MPH\n    entering the crossing unless it is known to be clear of traffic and will remain clear until occupied.",
        hash: "ccaa8a08886e",
        page: 27
      },
      {
        id: "18(a)",
        kind: "subrule",
        number: "18(a)",
        parent: "18",
        text: "If the headlight on a movement fails and repairs cannot be made, ditch lights will be used in lieu of the headlight and the movement may proceed.",
        hash: "96ef0cd4379b"
      },
      {

        kind: "subrule",
        number: "18(b)",
        parent: "18",
        text: "If all headlights and ditch lights have failed, such lights as are available must be used proceeding to the first point where repairs can be made. At public and private crossings at grade not protected by automatic warning devices, movements must not exceed 10 MPH entering the crossing unless it is known to be clear of traffic and will remain clear until occupied.",

      },
      {
        id: "19",
        kind: "rule",
        number: "19",
        title: "Ditch Lights",
        parent: "sec:signals-general",
        text: "A train must have ditch lights displayed continuously in the direction of travel when the headlight is\nrequired to be displayed full power.\nIf ditch light(s) fail en route, the movement may proceed to the next point where repairs can be\nmade.",
        hash: "e75172222c4c",
        page: 27
      },
      {
        id: "26",
        kind: "rule",
        number: "26",
        title: "Blue Signal Protection",
        parent: "sec:signals-general",
        text: "(a) A blue flag by day, and in addition a blue light by night or when day signals cannot be plainly\n    seen, displayed at one or both ends of equipment indicates that workmen are in the vicinity of\n    such equipment. On a track which permits entry of a movement from one end only, a blue\n    signal displayed between the equipment and the switch permitting entry indicates that workmen\n    are in the vicinity of such equipment. When such signals are displayed the equipment must not\n    be coupled to or moved. The removal of the signal from one or both ends of equipment\n    indicates that no workmen are in the vicinity of the equipment and such equipment may be\n    coupled to or moved.\n    EXCEPTION: When repairs must be undertaken on a manned movement, the locomotive\n    engineer must be notified before repair work is commenced. When so notified, the movement\n    must not be moved nor the brakes applied or released until the workmen have advised that they\n    are in the clear.\n\n(b) Other equipment must not be placed on the same track which will block a clear view of the blue\n    signal(s) without first notifying the workmen. When equipment is placed on the same track, the\n    movement placing such equipment must remain on that track until the workmen have relocated\n    the blue signal(s) to include the additional equipment.\n(c) Each class of workmen will display the blue signal(s) and the same class of workmen only are\n    authorized to remove them.\n(d) Special instructions will govern the use of other approved methods of protecting workmen\n    performing equipment repairs or inspections.\n(e) When protection is required on a track where the kicking of equipment is permitted per Rule\n    113.5(a):\n           (i) lock switch(es) with a special lock, in a position to prevent a movement from entering\n                the working limits; or\n           (ii) a blue signal displayed per (a) and a derail locked in the derailing position with a\n                special lock.",

      {
        id: "27",
        kind: "rule",
        number: "27",
        title: "Signal Imperfectly Displayed",
        parent: "sec:signals-general",
        text: "(a) Except as provided in paragraph (b), a fixed signal which is imperfectly displayed, or the\n    absence of a fixed signal where one is usually displayed, must be regarded as the most\n    restrictive indication that such signal is capable of displaying. An imperfectly displayed signal\n    must be communicated to the proper authority as soon as possible.\n(b) Where a block or interlocking signal is observed with one or more lights extinguished, and at\n    least one light remains displaying either green or yellow, movements may proceed reducing to\n    SLOW speed through turnouts, when practicable, preparing to stop at the next signal.\n    EXCEPTION: Where a signal displays a solid yellow on the bottom position and one or all of\n    the remaining positions are extinguished, a movement approaching such signal operating:\n       \u2022 at restricted speed;\n       \u2022 prepared to stop; or\n       \u2022 prepared to comply with restricted or reduced speed;\n    must consider the signal as displaying RESTRICTING.\n(c) When a signal is known or suspected of being damaged, it must be regarded as displaying the\n    most restrictive indication that can be given by that signal.\n(d) When a block or interlocking signal displays an indication that is in other than the normal\n    progression in relationship to the indication of the advance signal to that signal, the movement\n    must stop immediately consistent with safe train handling practices and contact the RTC or\n    signalman for further instructions.\n(e) Repairs to damaged signals must not be made by other than qualified employees. Signals that\n    have been knocked over must not be re-erected by other than an authorized employee. If it is\n    known or suspected that a signal bungalow has been damaged, such fact must be reported to\n    the RTC immediately.",

        number: "27(d)",
        parent: "27",
        text: "When a block or interlocking signal displays an indication that is in other than the normal progression in relationship to the indication of the advance signal to that signal, the movement must stop immediately consistent with safe train handling practices and contact the RTC or signalman for further instructions.",
        hash: "48df0c767870"
      },
      {
        id: "27(e)",
        kind: "subrule",
        number: "27(e)",
        parent: "27",
        text: "Repairs to damaged signals must not be made by other than qualified employees. Signals that have been knocked over must not be re-erected by other than an authorized employee. If it is known or suspected that a signal bungalow has been damaged, such fact must be reported to the RTC immediately.",
        hash: "465b08a6a7d1"
      },
      {
        id: "33",
        kind: "rule",
        number: "33",
        title: "Speed Compliance",
        parent: "sec:signals-general",
        text: "If speed requirements for their movement are exceeded, crew members must remind one another\nof such requirements. If no action is then taken, or if the locomotive engineer is observed to be\nnon-responsive or incapacitated, other crew members must take immediate action to ensure the\nsafety of the movement, including stopping it in emergency if required.",
        hash: "7898188d49e2",
        page: 28
      },
      {
        id: "34",
        kind: "rule",
        number: "34",
        title: "Fixed Signal Recognition And Compliance",
        parent: "sec:signals-general",
        text: "(a) The crew on the controlling engine of any movement and snow plow foremen must know the\n    indication of each fixed signal (including switches where practicable) before passing it.\n(b) Crew members within physical hearing range must communicate to each other, in a clear and\n    audible manner, the indication by name, of each fixed signal they are required to identify. Each\n\n    signal affecting their movement must be called out as soon as it is positively identified, but crew\n    members must watch for and promptly communicate and act on any change of indication which\n    may occur.\n    The following signals/operating signs must be communicated:\n        (i)    Block and interlocking signals;\n        (ii)   Rule 42 and 43 signals;\n        (iii) One mile sign to interlocking;\n        (iv) One mile sign to hot box detector;\n        (v) Stop sign;\n        (vi) OCS begins sign;\n        (vii) Red signal between the rails;\n        (viii) Stop signal displayed by a flagman;\n        (ix) A switch not properly lined for the movement affected;\n        (x) One mile to Cautionary Limit Sign;\n        (xi) Cautionary Limit Sign;\n        (xii) Advance Permanent Slow Order (PSO) Signs; and\n        (xiii) Zone speed Signs where there is a reduction in speed from the previous zone.\n(c) If prompt action is not taken to comply with the requirements of each signal indication affecting\n    their movement, crew members must remind one another of such requirements. If no action is\n    then taken, or if the locomotive engineer is observed to be incapacitated, other crew members\n    must take immediate action to ensure the safety of the movement, including stopping it in\n    emergency if required.",

        hash: "108e581f6384"

      {
        id: "35",
        kind: "rule",
        number: "35",
        title: "Emergency Protection",
        parent: "sec:signals-general",
        text: "This rule does not authorize main track occupancy or track work.\n(a) Any employee discovering a hazardous condition, which may affect the safe passage of a\n    movement, must by the use of flags, lights, fusees, radio, telephone, or other means, make\n    every possible effort to stop and/or provide necessary instructions to any movement that may\n    be affected. Flag protection must be provided on main track unless or until otherwise relieved of\n    the requirement.\n(b) A flagman must go the required distance from the condition, and in each direction when\n    possible, to ensure that an approaching movement will have sufficient time and distance to be\n    able to stop before the condition. Unless otherwise provided, a flagman must go at least two\n    miles from the condition to a location where there will be an unobstructed view of the flagman\n    from an approaching movement.\n    When a movement is observed approaching, the flagman must display a stop signal using a red\n    flag by day or a lighted red fusee by night or when day signals cannot be plainly seen. The\n    flagman must continue to display a stop signal until the movement being flagged has:\n    (i) acknowledged the stop signal with engine whistle signal 14 (b) (two short);\n    (ii) come to a stop; or\n    (iii) reached the location of the flagman.\n(c) A movement stopped by a flagman must not proceed until so instructed by the flagman.\n(d) A flagman must be equipped with a red flag and eight red fusees. The presence of an unbroken\n    seal verifies that a flagging kit is properly supplied.",

        parent: "sec:protection-of-track-work-and-track-conditions",
        text: "LIMITS\nThis rule is not applicable on main tracks outside of cautionary limits, signalled sidings and other\nsignalled tracks, or on other tracks specified in special instructions.\n(i) A movement required to operate on a track protected by a red signal between the rails or a\n      switch locked with a special lock must be stopped before passing it and be governed by any\n      instructions from the foreman.\n(ii) Only the foreman or an employee authorized by the foreman may remove the red signal and/or\n      special lock.\n(iii) Equipment must not be left on the same track that will block a clear view of any red signal.\n\n                              NOTE: Foreman must refer to Rule 841",

        id: "42",

        number: "42",
        title: "Planned Protection",
        parent: "sec:protection-of-track-work-and-track-conditions",
        text: "(a) Rule 42 signals must not be in place more than 30 minutes prior to or after the times stated in\n    the GBO unless provided for in the GBO.\n\n                                 Note: Foreman must refer to Rule 842\n\n(b) A movement in possession of the Form Y must not proceed beyond the red signal located at\n    the identifiable location stated in the GBO, enter the track limits stated in the GBO, or make a\n    reverse movement within such track limits until instructions have been received from the\n    foreman named in the GBO.\n    When a specific track is to be used, instructions from the foreman must specify the track upon\n    which the instructions apply.\n(c) The instructions must be repeated to, and acknowledged by, the foreman named in the GBO\n    before being acted upon.\n(d) When a signalled turnout is within two miles of Rule 42 protection which does not apply on all\n    tracks, every movement must approach such location prepared to comply with the requirements\n    of Rule 42 until it is known which route is to be used.\n                       .",

        id: "43",

        number: "43",
        title: "Slow Track Protection",
        parent: "sec:protection-of-track-work-and-track-conditions",
        text: "Form V GBO slow track protection will be marked in the field by a:\n(i) yellow signal to the right of the track as seen from an approaching movement at least two miles\n     in each direction from the outermost limits indicated in the GBO, and\n(ii) green signal to the right of the track as seen from an approaching movement in each direction,\n     immediately beyond the defect.\n     Exception: When there are abutting limits contained within a single GBO, a single green signal\n     will be displayed to either side of the track to identify each restriction within the limits.\nWhen a Rule 43 restriction is located at a single mile point, one green signal will be displayed to\nidentify the restriction and may be displayed to either side of the track.\nWhen the placement of signals as prescribed by Rule 43 is delayed, the following will be added to\nthe Form V: \u201CSignals may not be in place.\u201D\n\n(a) A movement must not exceed the speed requirement of the GBO while at/or between opposing\n    green signals.\n\n                               Note: Foreman must refer to Rule 843.\n\n(b) When a signalled turnout is within two miles of a speed restriction which does not apply on all\n    tracks, every movement must approach such location prepared to comply with the speed\n    restriction until it is known which route is to be used.",

        id: "44",
        kind: "rule",
        number: "44",
        title: "Unusual Track Signal Conditions",
        parent: "sec:protection-of-track-work-and-track-conditions",
        text: "(a) In the absence of any of the signals prescribed by Rule 42, between the times stated in a Form\n    Y, a movement must be governed as though the signals are properly placed. Such condition\n    must be communicated to the RTC as quickly as possible.\n(b)\n    (i) A movement that encounters a yellow over red signal within the 30 minutes provided for in\n          Rule 42(a), may proceed on the instructions received from the foreman named in the GBO.\n          If the foreman cannot be contacted, the movement must be prepared to stop at a red signal\n          and, if no red signal is encountered at the location stated in the GBO, the RTC must be\n          advised.\n    (ii) A movement that encounters a red signal within the 30 minutes provided for in Rule 42(a),\n          must stop, unless authorized to proceed on the instructions received from the foreman\n          named in the GBO. If the foreman cannot be contacted, a crew member must communicate\n          with the RTC as quickly as possible and be governed by instructions received.\n    (iii) A movement that encounters a yellow over red signal or red signal, outside the 30 minutes\n          provided for in Rule 42(a) or without being in possession of a Form Y requiring the\n          placement of such signal, must stop.\n          A crew member must communicate with the RTC as quickly as possible and be governed by\n          instructions received.\n    (iv) If the TGBO/DOB system and the engineering supervisor for the territory indicate that Rule\n          42 is not or will not be in effect within the limits of the signal, the RTC may authorize the\n          movement to resume normal speed. The engineering supervisor will arrange for removal of\n          the signals that may include having the crew on a movement pick up the signals.\n(c) A movement within the track limits of a Form Y, at the time such protection takes effect, must\n    be stopped unless a crew member is otherwise instructed by the foreman named in the GBO.\n(d) In the absence of one or more of the signals prescribed by Rule 43, the movement will be\n    governed by the requirement of the Form V. Such condition must be communicated to the RTC\n    as quickly as possible.\n(e) A movement that encounters a yellow or green signal without a GBO requiring the placement of\n    such signal, must reduce speed to 10 MPH and immediately communicate with the RTC. The\n    movement will be governed by instructions received from the RTC. If the TGBO/DOB system\n    and the engineering supervisor for the territory indicate that Rule 43 is not or will not be\n    imminently in effect within the limits of the signal, the RTC may authorize the movement to\n    resume normal speed. The engineering supervisor will arrange for removal of the signals that\n    may include having the crew on a movement pick up the signals.\n(f) When a rail break has been detected by an engineering employee and it is safe to operate over\n    the break at a speed less than posted speed, the RTC will provide GBO protection to affected\n    movements stating the authorized speed over the break and how such location is marked in the\n    field, by either a Rail Break Sign or foreman, at the break. Signals required by Rule 43 will not\n    be in place.",

        text: "A movement that encounters a yellow or green signal without a GBO requiring the placement of such signal, must reduce speed to 10 MPH and immediately communicate with the RTC. The movement will be governed by instructions received from the RTC. If the TGBO/DOB system and the engineering supervisor for the territory indicate that Rule 43 is not or will not be imminently in effect within the limits of the signal, the RTC may authorize the movement to resume normal speed. The engineering supervisor will arrange for removal of the signals that may include having the crew on a movement pick up the signals.",
        hash: "8340469b6483"
      },
      {
        id: "44(f)",
        kind: "subrule",
        number: "44(f)",
        parent: "44",
        text: "When a rail break has been detected by an engineering employee and it is safe to operate over the break at a speed less than posted speed, the RTC will provide GBO protection to affected movements stating the authorized speed over the break and how such location is marked in the field, by either a Rail Break Sign or foreman, at the break. Signals required by Rule 43 will not be in place.",
        hash: "3d6c4417760c"
      },
      {
        id: "45",
        kind: "rule",
        number: "45",
        title: "Signal Placement Multi-Track",
        parent: "sec:protection-of-track-work-and-track-conditions",
        text: "Except on a subdivision designated in special instructions, signals required by Rules 42/842 and\n43/843, must be placed to the outside of the outermost track(s) and not between the main tracks.",
        hash: "a2adb1209bd7",
        page: 34
      },
      {

        kind: "rule",
        number: "62",
        title: "Unattended Engines",
        parent: "sec:operation-of-movements",
        text: "When an engine is left unattended outside of an attended yard or terminal:\n(a) the cab of the engine must be secured to prevent unauthorized entry; and\n(b) subject to (c), the reverser must be removed from the engine;\n(c) during subzero temperatures, an engine that does not have a high idle feature is exempt from\n    (b).",
        hash: "180de68fc91c",
        page: 35

        number: "62(b)",
        parent: "62",
        text: "subject to (c), the reverser must be removed from the engine;",
        hash: "ca75043e8fc3"

        number: "62(c)",
        parent: "62",

        hash: "ab7530767c05"
      },
      {
        id: "63",
        kind: "rule",
        number: "63",
        title: "Freight Train Requirements",
        parent: "sec:operation-of-movements",
        text: "Freight trains with cars must operate with TIBS or a manned caboose.\nException: A freight train that must be separated in order to double, set off or lift cars, cut a\ncrossing or for other similar situations may operate without a TIBS or manned caboose to the\nextent necessary to perform these tasks, at a speed not exceeding 25 MPH while handling cars.",
        hash: "a774c053bb95",
        page: 35
      },
      {
        id: "64",
        kind: "rule",
        number: "64",
        title: "Transfer Requirements",
        parent: "sec:operation-of-movements",
        text: "(i) Transfers must have air applied throughout the entire equipment consist. The last three cars, if\n      applicable, must be verified to have operative brakes.\n(ii) The locomotive engineer must verify that there are sufficient operative brakes to control the\n      transfer, confirmed by a running test as soon as possible.\n(iii) Remote control locomotives in transfer service must be operated with two operative operator\n      controlled units (OCU).",
        hash: "fe36a246f336",
        page: 35
      },
      {
        id: "64(i)",
        kind: "subrule",

        hash: "0982b77c9f4c"

      {

        kind: "subrule",
        number: "64(ii)",

        hash: "982a4b694a03"
      },
      {
        id: "65",
        kind: "rule",
        number: "65",
        title: "Engine In Yard Service Requirements",
        parent: "sec:operation-of-movements",
        text: "An engine in yard service that is required to enter main track to double over, take head room or\ncross over a main track will not be considered a train or transfer except in application of\nRules 301-315 and 560-578.",
        hash: "4946f87bfbca",
        page: 35
      },
      {
        id: "66",
        kind: "rule",
        number: "66",
        title: "Securing Equipment After An Emergency Brake Application On Grade",
        parent: "sec:operation-of-movements",
        text: "(a) When a train experiences an emergency brake application on a heavy or mountain grade, the\noperating crew must immediately provide details of the situation to the proper authority, and be\ngoverned by any additional instructions received from the proper authority.\n\n(b) When a train experiences an emergency brake application and any portion of the train is\nlocated on a mountain grade, the entire train must be considered to be on mountain grade.\n\n(c) In the event of a derailment or a train separation on heavy grade or mountain grade, the portion\nof the train at greatest risk of unintended movement must be secured first.\n\n(d) When a train experiences an emergency brake application on a mountain grade, the hand\nbrakes must be immediately applied as per (f) before attempting to recover the air brake system.\n\n(e) When a train experiences an emergency brake application on a heavy grade\n\n  i.     the train must be secured immediately per (f) if any of the following conditions exist:\n       - ambient temperature is -20 degrees Celsius or colder;\n       - ambient temperature is between -15 and -19 degrees Celsius, and snow is three inches or\n         greater above the top of rail;\n       - the crew has experienced unusual braking conditions or difficulty controlling speed;\n\n   - doubt exists as to the ability to safely recover and control the movement;\n   - more than one emergency brake application has occurred on the grade; or\n   - operating conditions do not permit a recovery attempt\n\n     ii.   If none of the conditions in (e) (i) apply, attempt to recover from the emergency brake\n           application. If air does not recover, the train must be immediately inspected for cause. If\n           cause cannot be determined or immediately corrected, so that air can recover, the train\n           must be secured per (f).\n\n(f) When securing the train using the hand brake requirement table, the following apply\n\n     i.    If less equipment is present in the movement than required by the following table, hand\n           brakes must be applied on all equipment.\n     ii.   The retarding force of locomotive(s) is not included in the following hand brake\n           requirements, and must not be used to diminish these requirements.",

      {
        id: "70",
        kind: "rule",
        number: "70",
        title: "Remote Control Operation",
        parent: "sec:operation-of-movements",
        text: "(a) Where a remote control operation is comprised of two or more employees, two operative OCU\n    must be used.\n\n(b) Should one OCU become inoperative:\n    (i) Repairs must be made as soon as possible.\n    (ii) The tour of duty may continue with one operative OCU.\n    (iii) The movement may operate on main track in order to proceed to the first point where\n          repairs can be made, provided an employee other than the one with the operative OCU is\n          positioned to operate the emergency brake valve.\n(c) Any crew member other than the employee with the controlling OCU must not foul the\n    equipment without first obtaining verbal confirmation of positive protection.\n(d) OCU must not be operated while moving on other than the movement the employee is\n    controlling.\n(e) When an engine begins to move, a crew member must visually verify the direction the\n    movement is travelling in.\n(f) Movements must not exceed 15 MPH.\n(g) When coupling to equipment, the employee protecting the leading end of the movement must\n    have the controlling OCU.\n(h) Prior to stopping or coupling to equipment, the OCU must be set to its lowest speed.",

      {
        id: "80",
        kind: "rule",
        number: "80",
        title: "Main Track Authorization",
        parent: "sec:operation-of-movements",
        text: "(a) A movement must not foul or enter a main track without authority. Authority is conveyed in:\n    CTC                 By signal indication, RTC permission or written authority.\n    OCS                 Clearance\n    Cautionary Limits Rule 94\n    SCS                 Special Instructions\n(b) If a movement occupies or fouls a main track or siding controlled territory without authority, or\n    passes a block or interlocking signal indicating stop without authority to pass such signal; it\n    must be stopped and protection as required by Rules 35 and 125 initiated. The RTC or\n\n   signalman must be advised as soon as practicable.\n   (i) The RTC or signalman will issue instructions as necessary.\n   (ii) If the instructions include the authority to proceed or reverse direction, unless relieved of the\n        requirement by the RTC or signalman:\n        \u2022 any dual control or power-operated switches occupied by the movement must be\n             examined to ensure that the switch points are properly lined for the route to be used and\n             no part of the switch is damaged or broken.\n        \u2022 Rule 104.2(b) must be complied with at dual control switch(es). In application of\n             Rule 104.2(b), the movement may be moved before the dual control switch is operated\n             by hand, but only sufficient distance to clear the wheels from the actual switch points.",

        page: 37

      {
        id: "82",
        kind: "rule",
        number: "82",
        title: "Limits Of Authority",
        parent: "sec:operation-of-movements",
        text: "Specific limits contained in written authorities must be defined by identifiable locations. These may\ninclude station names, station name signs, switches, signals, mile posts and other signs or\ninfrastructure that are identified with a specific mileage.\n(a) When a switch or signal is used to define the limits, the authority extends only to the fouling\n    point of the switch or to the signal location.\n(b) When mile posts or specific mileages are used to define the limits, the authority extends only to\n    the specific mileage indicated.\n(c) When station names are used to define the limits, the authority does not include the use of the\n    main track between the siding switches at either station named. Where there is no siding,\n    authority extends to the station name sign.",
        hash: "901c04b70ae1",

      {
        id: "83",
        kind: "rule",
        number: "83",
        title: "Operating Bulletins",
        parent: "sec:operation-of-movements",
        text: "(a) Operating bulletins will be issued by the proper authority and in the prescribed format.\n    Employees responsible for posting or displaying operating bulletins must record on each\n    bulletin the time and date it is posted or displayed. Operating bulletins will only contain\n    information or instructions pertaining to the operation of movements. Duplicate bulletin numbers\n    must not be in effect at the same time.\n(b) Before commencing work at their home location where operating bulletins are posted or\n    displayed, every employee responsible for the operation or supervision of movements must\n    read and understand the operating bulletins that are applicable to the territory that they will\n    operate on.\n(c) A Summary bulletin, containing the number, date and contents of, or reference to, each\n    operating bulletin remaining in effect, will be issued at intervals indicated in special instructions.\n    Operating bulletins of a previous date, which are not included or referred to in the Summary\n    bulletin, become void. Summary bulletins may also contain full content of operating bulletins\n    that take effect on or after the effective date of the Summary bulletin and will not be posted or\n    displayed. All employees responsible for the operation or supervision of movements must have\n    a copy of the current Summary bulletin accessible while on duty.",

        text: "The conductor must ensure that the RTC is promptly advised of any known condition which may\ndelay their train or transfer.",

        text: "Prior to making such report, the employee providing the report must confirm with other crew members the accuracy of the information to be provided.",

        kind: "subrule",

        text: "When a location report is transmitted to the RTC, it must be entered in the computer system by the RTC as it is received; repeated from the computer screen by the RTC to the movement. If correct, the employee who provided the report must confirm correctness of the report to the RTC.",

      {
        id: "94",
        kind: "rule",
        number: "94",
        title: "Cautionary Limits",
        parent: "sec:operation-of-movements",
        text: "This rule is not applicable in CTC and does not authorize track work.\n(a) A movement or track unit is authorized to use the main track within cautionary limits.\n(b) Movements must comply with the provisions of Rule 105(c), and in addition must also be\n    prepared to stop short of the red signal prescribed by Rule 41 or a switch not properly lined.\n(c) Each cautionary limit sign and advance sign will be reflectorized. An advance sign will be\n    placed at least one mile in advance of each cautionary limit sign. At locations where the\n    placement of an advance sign or signs is not practicable at the required distance, it will be so\n    indicated in special instructions.",

        id: "101",
        kind: "rule",
        number: "101",
        title: "Protection Against Extraordinary Conditions",
        parent: "sec:operation-of-movements",
        text: "(a) A movement must be fully protected against any known or suspected condition that may\n    interfere with its safe passage.\n(b) A movement must stop at once and be fully inspected when it is known or suspected to have\n    struck any object that may interfere with its safe operation. The RTC must be notified as quickly\n    as possible.\n(c) When a portion of a movement is left on the main track, precautions must be taken by the crew\n    to protect the remaining portion against the return move.",

        page: 39

        kind: "subrule",

        text: "When the dimensions of traffic require that special arrangements be made to permit moving past\nother movements, the wide traffic will be protected by the RTC against other main track\nmovements. Advice of such protection will be provided to the crew in writing or verbally.\nThe RTC will not provide protection against equipment on non-main tracks. The crew handling the\nwide traffic must protect it from such equipment.",

        kind: "rule",
        number: "101.2",
        title: "Equipment Left On Main Track",
        parent: "101",
        text: "Equipment may be left on the main track when protected by:\n\n(i) clearance;\n(ii) Form T GBO; or\n(iii) cautionary limits.\nCommunication to the RTC must include the location of the equipment and the outer limits of\nthe Form T protection must be expressed in whole miles or by other identifiable locations. In\nCTC and controlled interlockings, once the RTC has been advised, Form T protection need\nnot be provided. The RTC must inform each movement, required to enter the occupied track,\nof the location of the unattended equipment.",

      {
        id: "102",
        kind: "rule",
        number: "102",
        title: "Emergency Stop Protection",
        parent: "sec:operation-of-movements",
        text: "(a) The crew of a movement stopping as a result of an emergency brake application, or\n    other abnormal condition, which may cause an adjacent main track to be\n    obstructed, must:\n    (i) immediately transmit a radio broadcast on the standby channel in the following\n          manner: \u201CEMERGENCY, EMERGENCY, EMERGENCY, (movement) on (designated\n          track), stopped (stopping) in emergency between mile                     and mile\n          (subdivision)\u201D;\n    (ii) as soon as possible, advise the RTC of the movement\u2019s emergency stop location,\n          indicating whether adjacent tracks and tracks of other railways are liable to be\n          obstructed;\n    (iii) repeat the emergency broadcast outlined in (i) at intervals not exceeding 90 seconds\n          until advised by the RTC that all affected movements on other tracks have been\n          secured, stopped or advised of the emergency stop, or it is known that adjacent\n          tracks or tracks of other railways are safe and clear for movements;\n    (iv) if unable to comply with (i), (ii), (iii), the adjacent track must be protected as per Rule\n          35(b) EMERGENCY PROTECTION.\n    (v) When tracks of other railways may be obstructed the emergency radio broadcast must\n          be transmitted on their standby channel if practicable.\n(b) Other movements must;\n    (i) stop at once if closely approaching the location stated in the emergency broadcast; or\n    (ii) stop prior to reaching the location stated in the emergency broadcast; and\n    (iii) after stop has been made, proceed prepared to stop short of an obstruction until it is\n          known that the track is safe and clear.\n(c) The RTC must:\n    (i) immediately secure and advise affected movements on other tracks of the location of\n          the movement in an emergency stop;\n    (ii) by use of a dedicated emergency communication system, alert the RTC controlling\n          adjacent tracks of other railways liable to be obstructed, providing the location of the\n          emergency stop; and\n    (iii) advise the crew of the movement involved in the emergency stop when all other\n          affected movements have been advised of the condition.\n(d) Rule 102 is applicable to a movement operating on a track that is adjacent to a siding\n    where siding control territory rules (SCT) are applicable.",
