        title: "Reversing Direction",
        parent: "sec:centralized-traffic-control-system-ctc-rules",
        text: "(a) A train or transfer, having passed beyond the limits of a block, must not back into that block\n    until the RTC has been informed, and such train or transfer is authorized by;\n    (i) the indication of a block signal, other than a Restricting Signal equipped with a plate\n          displaying the letter \u201CR\u201D, or a Stop and Proceed Signal;\n    (ii) Rule 564 or 567.3; or\n    (iii) Rule 566, 567 or 577.\n    NOTE: (iii) does not dispense with the requirements of Rule 564 at a Stop Signal except in the\n    application of Rule 566(g) or 577(f).\n\n(b) When a train or transfer has entered a controlled location on signal indication, and stops with its\n    trailing end within such controlled location, it may only move in the opposite direction within the\n    controlled location with permission from the RTC. Unless relieved by the RTC, the movement\n    must comply with Rule 104.2(b). RTC permission does not authorize occupancy outside of the\n    controlled location.\n(c) Provided it will not re-enter a block it has cleared, a train or transfer may reverse direction within\n    a block without Rule 566, 567 or 577 protection as follows:\n    (i) to reverse a distance of 300 feet or less, a crew member must take up a position to see the\n         section of track to be used is clear and will remain clear of equipment or a track unit; or\n    (ii) to reverse a distance greater than 300 feet, a flagman must take up a position beyond the\n         farthest point to which the train or transfer may extend. Stop signals must be given by the\n         flagman from a point where they can be plainly seen from an approaching train or transfer\n         from not less than 300 yards.",

        id: "576",
        kind: "rule",

        title: "Switching At A Controlled Location",
        parent: "sec:centralized-traffic-control-system-ctc-rules",
        text: "(a) Signal Indication - The preferred method of switching at a controlled location is with the use of\n    the signal system by having the RTC signal the train or transfer over the controlled location with\n    directional signals. If unable to clear the controlled location when switching is completed, the\n    RTC will authorize departure by issuing a Rule 566 or 577 to the train or transfer. If the first\n    move into the block was authorized by Rule 564, operation to the next signal must be made at\n    RESTRICTED speed.\n    Rule 566 or 577 would not be required when the RTC verbally authorizes the train or transfer to\n    pull ahead to the next signal where there are no dual control switches to be encountered.\n(b) Switching Signals - A member of the crew will request the switching signal so that multiple\n    moves may be made through the controlled location on a specific route. When switching is\n    completed, the RTC must be advised to ensure the signal will be cancelled. Before doing so,\n    the member of the crew requesting the cancellation must advise all other crew members and\n    receive their assurance that they are and will remain clear of the switching signal limits. If\n    unable to clear the controlled location, the RTC will verbally authorize departure. The RTC will\n    then cancel the switching signal. The train or transfer may then proceed to the next signal at\n    RESTRICTED speed.\n    To avoid having to proceed at RESTRICTED speed, trains or transfers should attempt to back\n    clear of the switching signal on the final move and leave on a more permissive signal indication.\n(c) Rule 566.1 and 577.1 Signals Suspended - The train or transfer must be authorized to enter\n    the block before Rule 566/566.1 or 577/577.1 authority is issued by the RTC. If the train or\n    transfer is unable to be clear of the limits when switching is completed, they must advise the\n    RTC before leaving the location. If Rule 564 authorized the first move into the block, the train or\n    transfer must operate to the next signal at RESTRICTED speed.\n(d) Taking Head-Room - Provided that the trailing end remains within non-main track territory, a\n    train or transfer may accept a signal to enter a controlled location, where the intent of the move\n    is to subsequently reverse direction so as to be completely in the clear in the non-main track\n    territory. The RTC must be informed of the intended head-room move when the signal is\n    requested. The crew may request one or more head-room moves but each time the signal\n    provides a permissive indication, it is for one head-room move only.",

        kind: "rule",

        title: "Optional To 566/567 With System: Work Authority",
        parent: "sec:centralized-traffic-control-system-ctc-rules",
        text: "(a) A train or transfer may be given work authority in writing which permits moving in either\n    direction within specified limits. Before issuing such authority, the RTC must:\n    (i) ensure that there are no other trains or transfers within, or authorized to enter, the required\n         limits, and;\n    (ii) block at Stop all devices controlling signals governing other trains or transfers into such\n         limits.\n(b) Other trains or transfers may be authorized to work within the limits of one or more trains or\n    transfers authorized to work provided such trains or transfers are restricted on their authority as\n    follows: \u201CProtect against work (number) between (location) and (location)\u201D.\n(c) When entry is to be provided by signal indication, the signal may only be requested when the\n    train or transfer is within:\n    (i) two controlled blocks of the limits; or\n    (ii) 25 miles of the limits when there is no controlled block prior\n    The RTC must ensure the authorized train or transfer is the only one which will encounter the\n    signal governing entry into the limits.\n(d) Trains or transfers so authorized as outlined in paragraph (b) must not enter or move within the\n    working limits until a written understanding has been established with the conductor and\n    locomotive engineer of each train or transfer. This understanding must include information with\n    respect to the intended operation of each train or transfer and remain in place until the affected\n    train(s) or transfer(s) has left the working limits.\n(e) The RTC must maintain signal blocking against trains or transfers and must not authorize any\n    train or transfer, other than one authorized by Rule 567.3 or as outlined in paragraph (b), to\n    enter the affected limits until the work authority has been cancelled. Each train or transfer must\n    be clear of the affected limits before its work authority is cancelled.\n    EXCEPTION: If the work authority remains to be cancelled to only one train or transfer, it may\n    be cancelled while that train or transfer is within the affected limits. In such case, the conductor\n    or locomotive engineer must inform the RTC of the intended direction of operation. The RTC\n    must maintain signal protection against opposing trains or transfers until the protected train or\n    transfer has cleared the controlled block.\n    The locomotive engineer of a train or transfer so authorized must be made aware of the track\n    limits before moving.\n(f) Controlled signals within the limits other than the entry and exit signals of the authority that are\n    indicating STOP may be considered as indicating \u201Cproceed at RESTRICTED speed\u201D. Not\n    applicable at automatic interlockings or interlockings controlled by a foreign railway. Rule\n    104.2(b) is not applicable when advised by the RTC that dual control switch(es) are lined for the\n    route to be used.",

        title: "Application",
        parent: "sec:interlocking-rules",
        text: "A movement will be governed by interlocking rules within interlocking limits. Interlocking signal\nindications govern the use of the routes within interlocking limits. Instructions may be issued by a\nsignalman when necessary.",
        hash: "c1e07d55bb42",
        page: 90
      },
      {
        id: "602",
        kind: "rule",
        number: "602",
        title: "Proper Signal Indications Required",
        parent: "sec:interlocking-rules",
        text: "(a) Except in case of emergency, radio or hand signals must not be used when the proper\n    indication can be displayed by the interlocking signals.\n(b) A movement stopped by the signalman, other than by means of signal indication, while\n    approaching, or within an interlocking, must not move in either direction until the proper signal\n    or instructions have been received from the signalman.\n(c) When a movement stops with its trailing end within interlocking limits, it must not reverse\n    direction without the proper interlocking signal indication, or permission from the signalman.",
        hash: "6ae4df297b9b",
        page: 90
      },
      {
        id: "602(a)",
        kind: "subrule",
        number: "602(a)",
        parent: "602",
        text: "Except in case of emergency, radio or hand signals must not be used when the proper indication can be displayed by the interlocking signals.",
        hash: "0dba5a4d44fb"
      },
      {
        id: "602(b)",
        kind: "subrule",
        number: "602(b)",
        parent: "602",
        text: "A movement stopped by the signalman, other than by means of signal indication, while approaching, or within an interlocking, must not move in either direction until the proper signal or instructions have been received from the signalman.",
        hash: "2c5212106508"
      },
      {
        id: "602(c)",
        kind: "subrule",
        number: "602(c)",
        parent: "602",
        text: "When a movement stops with its trailing end within interlocking limits, it must not reverse direction without the proper interlocking signal indication, or permission from the signalman.",
        hash: "6a4c52754481"
      },
      {
        id: "604",
        kind: "rule",
        number: "604",
        title: "Establishing And Changing Routes",
        parent: "sec:interlocking-rules",
        text: "(a) Signals for an approaching movement must not be restored to indicate stop unless the\n    locomotive engineer has acknowledged that they are stopped or able to stop their movement\n    without passing the interlocking signal to be restored.\n(b) In case of emergency, a signal may be restored to Stop at any time.\n(c) No part of a route may be changed, nor signals cleared for a movement on a conflicting route,\n    unless the locomotive engineer of the movement for which the route was cleared has\n    acknowledged that they are able to comply with the new routing.",
        hash: "a4c1eeac5302",
        page: 90
      },
      {
        id: "604(a)",
        kind: "subrule",
        number: "604(a)",
        parent: "604",
        text: "Signals for an approaching movement must not be restored to indicate stop unless the locomotive engineer has acknowledged that they are stopped or able to stop their movement without passing the interlocking signal to be restored.",
        hash: "0b94a61cb549"
      },
      {
        id: "604(b)",
        kind: "subrule",
        number: "604(b)",
        parent: "604",
        text: "In case of emergency, a signal may be restored to Stop at any time.",
        hash: "e3b118916448"
      },
      {
        id: "604(c)",
        kind: "subrule",
        number: "604(c)",
        parent: "604",
        text: "No part of a route may be changed, nor signals cleared for a movement on a conflicting route, unless the locomotive engineer of the movement for which the route was cleared has acknowledged that they are able to comply with the new routing.",
        hash: "c754cab3a367"
      },
      {
        id: "605",
        kind: "rule",
        number: "605",
        title: "Delayed In Timing Circuit",
        parent: "sec:interlocking-rules",
        text: "A movement approaching an automatic interlocking, equipped with a timing circuit, must approach\nthe interlocking signal prepared to stop if occupying the timing circuit in excess of the time specified\nin special instructions.\nAt automatic interlockings not equipped with a timing circuit, a movement occupying the track\nbetween the advance signal and the interlocking signal in excess of 5 minutes must approach the\ninterlocking signal prepared to stop.",
        hash: "8db510b86b87",
        page: 90
      },
      {
        id: "606",
        kind: "rule",
        number: "606",
        title: "Approaching Interlocking Limits",
        parent: "sec:interlocking-rules",
        text: "At a location not protected by an advance signal, a movement must approach interlocking limits\nprepared to comply with a signal indicating Stop.",
        hash: "2a54a85b9f27",
        page: 90
      },
      {
        id: "607",
        kind: "rule",
        number: "607",
        title: "Rule Applicable At A Stop Signal",
        parent: "sec:interlocking-rules",
        text: "When an interlocking signal indicates Stop and no conflicting movement is evident, the following\nwill apply:\nTYPE OF INTERLOCKING                   APPLICABLE RULE\n(as indicated in special instructions)\nManual                                 608\nLocally-Controlled                     609\nRemotely-Controlled                    610\nAutomatic                              611",
        hash: "ee7183ef57ed",
        page: 91
      },
      {
        id: "608",
        kind: "rule",
        number: "608",
        title: "Manual Interlocking",
        parent: "sec:interlocking-rules",
        text: "Movements operating through the limits of a manual interlocking will be governed by special\ninstructions.",
        hash: "69b7137215bd",
        page: 91
      },
      {
        id: "609",
        kind: "rule",
        number: "609",
        title: "Locally-Controlled Interlocking Signal Indicating Stop",
        parent: "sec:interlocking-rules",
        text: "(a) A movement must have authority to pass a locally-controlled interlocking signal indicating Stop.\n    When no conflicting movement is evident:\n    (i) the signalman may authorize such movement to pass the signal, but before doing so, the\n         signalman must provide protection against all conflicting movements; and\n    (ii) the movement so authorized need not stop at the signal but must positively identify the\n         signal by number. It must move at RESTRICTED speed to the next signal or Block End sign\n         and will be governed by Rule 104.1 at spring switches, Rule 104.2 at dual control switches\n         and Rule 104.3 at power-operated switches.\n(b) Before moving, the locomotive engineer must be informed of the situation.\n(c) When the signalman is off duty at a locally-controlled interlocking, a movement stopped by an\n    interlocking signal indicating Stop will be governed by special instructions.",
        hash: "56662984fae2",
        page: 91
      },
      {
        id: "609(a)",
        kind: "subrule",
        number: "609(a)",
        parent: "609",

        hash: "0e12846b8e50"

        text: "When the signalman is off duty at a locally-controlled interlocking, a movement stopped by an interlocking signal indicating Stop will be governed by special instructions.",
        hash: "4bac17a72186"
      },
      {
        id: "610",
        kind: "rule",
        number: "610",
        title: "Remotely-Controlled Interlocking Signal Indicating Stop",
        parent: "sec:interlocking-rules",
        text: "(a) A movement must have authority to pass a remotely-controlled interlocking signal indicating\n    Stop. The signalman may authorize the movement to pass the signal but before doing so must\n    ensure that there is no conflicting movement in the route to be used, and that all devices\n    controlling signals governing conflicting movements are blocked at Stop. The authorization\n    must specify the route to be used, and must be in writing.\n(b) The movement so authorized need not stop at the signal but must positively identify the signal\n    by number. It must move at RESTRICTED speed to the next signal or Block End sign and will\n    be governed by Rule 104.1 at spring switches, Rule 104.2 at dual control switches and Rule\n    104.3 at power-operated switches. If there is a railway crossing at grade equipped with a box\n    marked \u201Cswitches\u201D within the interlocking, the provisions of Rule 611 apply.\n(c) The locomotive engineer must be made aware of the route to be used before moving.",
        hash: "f1a3481aeb9b",
        page: 91
      },
      {
        id: "610(a)",
        kind: "subrule",
        number: "610(a)",
        parent: "610",
        text: "A movement must have authority to pass a remotely-controlled interlocking signal indicating Stop. The signalman may authorize the movement to pass the signal but before doing so must ensure that there is no conflicting movement in the route to be used, and that all devices controlling signals governing conflicting movements are blocked at Stop. The authorization must specify the route to be used, and must be in writing.",
        hash: "2edcca7812a5"
      },
      {
        id: "610(b)",
        kind: "subrule",

        hash: "2e0d4f96484f"
      },
      {
        id: "610(c)",
        kind: "subrule",
        number: "610(c)",
        parent: "610",
        text: "The locomotive engineer must be made aware of the route to be used before moving.",
        hash: "1d93844fd849"
      },
      {
        id: "611",
        kind: "rule",
        number: "611",
        title: "Automatic Interlocking Signal Indicating Stop",
        parent: "sec:interlocking-rules",
        text: "When a movement is stopped by an automatic interlocking signal indicating Stop:\n\u2022 paragraphs (a), (b) and (c) apply when no other movement or track work is evident; or\n\u2022 paragraph (d) applies when track work is evident.\n(a) When no other movement or track work is evident;\n    (i) a crew member, after opening the box marked \u201Cswitches\u201D, will observe panel lights, where\n        provided. If those of the conflicting route(s) are lighted and no conflicting movement is\n        evident, the crew member will open the knife switch and may then allow the movement to\n        proceed;\n\n    (ii) (MULTI-TRACK) in the box marked \u201Cswitches\u201D where lights are provided to indicate the\n          approach of a movement, if those of the conflicting route and those of the same railway on\n          the adjacent track are lighted and no other movement is seen approaching, the crew\n          member will open the knife switch and may then allow the movement to proceed;\n    (iii) where lights are not provided, or where those of the conflicting route(s) are not lighted, the\n          crew member, after opening the knife switch, must wait five minutes, unless a greater period\n          is specified in special instructions and posted in the box marked \u201Cswitches\u201D, before\n          permitting the movement to proceed;\n          (MULTI-TRACK) - When the lights of the same railway on the adjacent track are not lighted\n          and no other movement is seen approaching, the crew member will contact the RTC before\n          opening the knife switch, to ascertain whether or not a movement is closely approaching on\n          that adjacent track to prevent displaying STOP indications to such movement.\n    (iv) after complying with (i), (ii) or (iii) the movement must then operate at RESTRICTED speed\n          to the next signal or Block End sign; and\n    (v) after the movement has occupied the crossing, the switch must be closed and the box\n          marked \u201Cswitches\u201D locked.\n(b) Where a pushbutton is provided, to enable a reverse move to be made over the crossing, the\n    crew member will open the box, depress the pushbutton and be governed by signal indication.\n    If the signal fails to clear, the instructions contained in paragraph (a) must be complied with.\n(c) A movement required to switch within or into automatic interlocking limits must, after complying\n    with (a)(iii) leave the knife switch open until switching is completed. When the knife switch is in\n    the open position, signals governing the switching may be considered suspended but only while\n    switching.\n(d) When track work is evident; i.e. when encountering a \u201C840.3 Protection\u201D visible indicator or a\n    special lock on the box marked \u201Cswitches\u201D; after stopping at the signal, the movement must not\n    proceed beyond the signal until instructions have been received from the foreman. When so\n    authorized by the foreman to proceed, the movement must move at RESTRICTED speed to the\n    next signal or Block End sign.",
        hash: "bd995ff6602b",
        page: 91
      },
      {
        id: "611(a)",
        kind: "subrule",
        number: "611(a)",
        parent: "611",
        text: "When no other movement or track work is evident;",

      },

        hash: "7f96f1f7e2c9"

        hash: "1e1b0416c92d"
      },
      {

        number: "611(a)(iv)",
        parent: "611(a)",

      {

        hash: "b6543923ed82"
      },
      {

        parent: "611",
        text: "Where a pushbutton is provided, to enable a reverse move to be made over the crossing, the crew member will open the box, depress the pushbutton and be governed by signal indication. If the signal fails to clear, the instructions contained in paragraph (a) must be complied with.",
        hash: "99e8912077a7"
      },
      {
        id: "611(c)",
        kind: "subrule",
        number: "611(c)",

        text: "A movement required to switch within or into automatic interlocking limits must, after complying with (a)(iii) leave the knife switch open until switching is completed. When the knife switch is in the open position, signals governing the switching may be considered suspended but only while switching.",
        hash: "b84a793d0ac3"
      },
      {
        id: "611(d)",
        kind: "subrule",
        number: "611(d)",
        parent: "611",
        text: "When track work is evident; i.e. when encountering a \u201C840.3 Protection\u201D visible indicator or a special lock on the box marked \u201Cswitches\u201D; after stopping at the signal, the movement must not proceed beyond the signal until instructions have been received from the foreman. When so authorized by the foreman to proceed, the movement must move at RESTRICTED speed to the next signal or Block End sign.",
        hash: "b8eed055ec4a"
      },
      {
        id: "612",
        kind: "rule",
        number: "612",
        title: "Stopped Foul Of Signal",
        parent: "sec:interlocking-rules",
        text: "When a movement, which has accepted an indication of an interlocking signal permitting it to\nproceed, stops before the leading locomotive or car has completely passed such signal, it may\nthen proceed only after receiving permission from the signalman or under the provisions of\nRule 611.",
        hash: "452df7ab4b7c",
        page: 92
      },
      {
        id: "614",
        kind: "rule",
        number: "614",
        title: "Leaving Interlocking In Abs Or Ctc",
        parent: "sec:interlocking-rules",
        text: "When an interlocking is located in ABS or CTC, the indication of the last interlocking signal, in the\ndirection of travel, also governs the movement to the next signal or Block End sign. If necessary to\npass such signal in accordance with Rule 609, 610 or 611, unless otherwise specified in special\ninstructions, Rule 509 or 564 also applies beyond the interlocking limits.",
        hash: "bd4d7bfa6e0a",
        page: 92
      },
      {
        id: "615",
        kind: "rule",
        number: "615",
        title: "Single Unit Of Equipment Restricted",
        parent: "sec:interlocking-rules",
        text: "A single unit of equipment must not be left standing on the movable portion of an interlocked\ndrawbridge or within the interlocking limits of a railway crossing at grade.",
        hash: "8b73ba23920e",
        page: 92
      },
      {
        id: "616",
        kind: "rule",
        number: "616",
        title: "Damage To Interlocking",
        parent: "sec:interlocking-rules",
        text: "When it is known or suspected that:\n(i) a derailment has occurred; or\n(ii) track, appliances or signals are damaged or malfunctioning;\n\nthe signalman must block all controls for signals governing movements over the affected routes at\nStop. No move may then be permitted until the signalman has established that they may pass\nsafely.",
        hash: "9857b46f4f55",
        page: 92
      },
      {
        id: "616(i)",
        kind: "subrule",
        number: "616(i)",
        parent: "616",
        text: "a derailment has occurred; or",
        hash: "c2316470f66e"
      },
      {
        id: "616(ii)",
        kind: "subrule",
        number: "616(ii)",
        parent: "616",
        text: "track, appliances or signals are damaged or malfunctioning; the signalman must block all controls for signals governing movements over the affected routes at Stop. No move may then be permitted until the signalman has established that they may pass safely.",
        hash: "0e4b9bba0726"
      },
      {
        id: "617",
        kind: "rule",
        number: "617",
        title: "Disconnecting Track Parts Or Locking Devices",
        parent: "sec:interlocking-rules",
        text: "Before any movement is permitted to pass over any movable track part or locking device which has\nbeen disconnected, all movable track parts affected must be spiked or secured in the required\nposition and their controls blocked to prevent them from being operated.",
        hash: "1c59f4319777",
        page: 93
      },
      {
        id: "618",
        kind: "rule",
        number: "618",
        title: "Protecting Against A Foreman",
        parent: "sec:interlocking-rules",
        text: "(a) A movement may be authorized to enter or move within the limits of a TOP when instructed to\n    protect against the foreman within specified limits.\n    \u201CProtect against foreman (name) between (location) and (location).\u201D\n(b) The conductor and locomotive engineer must be made aware of the authority granted and have\n    received instructions from the foreman before moving. The instructions must be repeated to,\n    and acknowledged by, the foreman before being acted upon.\n(c) The signalman must maintain signal blocking against all other movements and must not\n    authorize any other movement, or issue another TOP to apply, within the protected limits until\n    the authority granted under this rule has been cancelled. Other members of the crew must\n    immediately be advised of the cancellation and all copies of the cancelled authority must be\n    destroyed.",
        hash: "9884c2282308",
        page: 93
      },
      {
        id: "618(a)",
        kind: "subrule",
        number: "618(a)",
        parent: "618",
        text: "A movement may be authorized to enter or move within the limits of a TOP when instructed to protect against the foreman within specified limits. \u201CProtect against foreman (name) between (location) and (location).\u201D",
        hash: "07b9bb7dba58"
      },
      {
        id: "618(b)",
        kind: "subrule",
        number: "618(b)",
        parent: "618",
        text: "The conductor and locomotive engineer must be made aware of the authority granted and have received instructions from the foreman before moving. The instructions must be repeated to, and acknowledged by, the foreman before being acted upon.",
        hash: "5bfeb263c33f"
      },
      {
        id: "618(c)",
        kind: "subrule",
        number: "618(c)",
        parent: "618",
        text: "The signalman must maintain signal blocking against all other movements and must not authorize any other movement, or issue another TOP to apply, within the protected limits until the authority granted under this rule has been cancelled. Other members of the crew must immediately be advised of the cancellation and all copies of the cancelled authority must be destroyed.",
        hash: "57fc337254c9"
      },
      {
        id: "618.1",
        kind: "rule",
        number: "618.1",
        title: "Optional: To 618 With System. Protecting Against A Foreman",
        parent: "618",
        text: "Movements may be authorized to enter or move within the limits of a TOP.\n(a) Each time a movement is so authorized, the movement must be restricted as follows:\n    \u201CProtect against foreman (name) between (location) and (location)\u201D.\n    Such restriction must be provided when the movement is within:\n    (i) two controlled blocks of the limits; or\n    (ii) 25 miles of the limits when there is no controlled block prior.\n    The RTC must ensure that the authorized movement is the only one that will encounter the\n    signal indication to enter the limits.\n(b) No entry into TOP limits may be made until both the conductor and locomotive engineer are\n    aware of the authority and limits granted and have received instructions from the foreman\n    named in the authority. Such instructions must be repeated to, and acknowledged by, the\n    foreman before being acted upon.\n(c) In addition to the permission and instructions received from a foreman to enter and/or move\n    within the limits, trains or transfers must also be authorized to enter the TOP limits by signal\n    indication or the provisions of Rules 609, 610 or to reverse within the TOP limits under the\n    permission of the signalman.",
        hash: "86bfe9dbc61a",
        page: 93
      },

        hash: "9444681ca428"
      },
      {

        hash: "3fe881bc5ec1"
      },
      {
        id: "619",
        kind: "rule",
        number: "619",
        title: "Transfer By Signalmen",
        parent: "sec:interlocking-rules",
        text: "(a) Where an ECM is used or where a computer assisted system generates a list as outlined in (b),\n    the relieving signalman must sign into the system in the presence of the on-duty signalman, and\n    receive verbal and/or written transfer of other necessary instructions and information.\n(b) Except as prescribed in paragraph (a), before being relieved, the signalman must make a\n    transfer in a book or on a form provided for that purpose, of TOP and other authorities in effect.\n    The transfer must include the time and other necessary information and must be signed by both\n    the relieved and the relieving signalman.",
        hash: "7ac14d14fdda",

      },
      {

        number: "619(a)",

        text: "Where an ECM is used or where a computer assisted system generates a list as outlined in (b), the relieving signalman must sign into the system in the presence of the on-duty signalman, and receive verbal and/or written transfer of other necessary instructions and information.",
        hash: "13ba6761c1d4"

      {

        text: "Except as prescribed in paragraph (a), before being relieved, the signalman must make a transfer in a book or on a form provided for that purpose, of TOP and other authorities in effect. The transfer must include the time and other necessary information and must be signed by both the relieved and the relieving signalman.",
        hash: "f1b38aaac6aa"
      },
      {
        id: "620",
        kind: "rule",
        number: "620",
        title: "Non-Interlocked Drawbridges And Railway Crossings At Grade",
        parent: "sec:interlocking-rules",
        text: "A movement must stop before any part of it passes the governing stop sign at a non-interlocked\ndrawbridge or at a non-interlocked railway crossing at grade. If no conflicting movement is evident\nand the route is properly lined, the movement may resume. Special instructions will govern when\nthere is an attendant in charge.",
        hash: "31df598705a2",
        page: 94
      },
      {
        id: "801",
        kind: "rule",
        number: "801",
        title: "Ocs Clearance In Lieu Of Top",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "A clearance may be issued in lieu of TOP and the provisions of Rules 80(b), 82, 85, 302, 308.1,\n311, 803(c) and 849 apply.",
        hash: "edc84ce429f5",
        page: 95
      },
      {
        id: "802",
        kind: "rule",
        number: "802",
        title: "Speed",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "Unless otherwise authorized, track units must always be operated at track unit speed.",
        hash: "1f42b3f7344d",
        page: 95
      },
      {

        parent: "sec:protection-of-track-units-and-track-work",
        text: "Refer to Rules 805 to 813 for rules applicable within interlocking limits and non-interlocked railway\ncrossings at grade and non-interlocked drawbridges.\n(a) Track occupancy by a track unit is permitted as follows:\n\n       Territory                                Rule or Authority\n     OCS              Rule 842, TOP or Clearance\n     CTC              Rule 842 or TOP\n     Signalled        Rule 842 or TOP\n     Track\n     Cautionary       Rule 94\n     Limits\n     NMT              Rule 841\n                      Rule 105(c) or where it is not applicable, it must be known that there is no\n                      conflicting movement(s)\n                      TOP when SCT is applicable or specified by special instructions\n                      Other forms of protection when specified by special instructions\n                      On tracks where kicking is permitted per Rule 113.5(a), track must be\n                      protected by Rule 841(c)(i) or (iii).\n(b) Track work is permitted as follows:\n        Territory                                  Rule or Authority\n      OCS             Rules 842, TOP or Clearance\n      CTC             Rules 842 or TOP\n      Signalled       Rules 842 or TOP\n      Track\n      Cautionary      Rules 841, Rule 842 or TOP\n      Limits\n      NMT             Rule 841\n                      TOP when SCT is applicable or specified by special instructions\n                      Other forms of protection when specified by special instructions\n                      On tracks where kicking is permitted per Rule 113.5(a), track must be\n                      protected by Rule 841(c)(i) or (iii).\n(c) When no longer required, the foreman must promptly cancel or remove the protection and\n    advise any person responsible for the track.\n\n(d) Prior to the removal, cancellation or expiration of protection, or providing instructions to a\n    movement; the foreman must ensure, unless otherwise protected:\n    (i) the track is safe for movements at normal speed; and\n    (ii) employees or track units for which the foreman is responsible are clear of the track.\n\n       TRACK WORK AND TRACK UNITS AT RAILWAY CROSSINGS\n          AT GRADE, DRAWBRIDGES, INTERLOCKINGS AND\n                      NON-INTERLOCKINGS",

        hash: "67cdb13bcbc6"
      },
      {
        id: "805",
        kind: "rule",
        number: "805",
        title: "Manual And Other Interlockings Not Specified In These Rules \u2013",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "",
        hash: "e3b0c44298fc",
        page: 97
      },
      {
        id: "806",
        kind: "rule",
        number: "806",
        title: "Automatic Interlockings \u2013 Railway Crossings At Grade",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "(a) Track Work:\n    Rule 840.3 applicable.\n(b) Track Units:\n    If no conflicting movement is evident, the track unit may proceed but must stop clear of the\n    conflicting route, where the foreman must then unlock the box marked \u201Cswitches\u201D, and open the\n    switch at the interlocking. The switch must not be closed until the track unit has cleared the\n    conflicting route(s).\n    EXCEPTION: A track unit that affects the signal system must stop before passing the\n    interlocking signal.\n    Before permitting the track unit to proceed the foreman must wait five minutes or such greater\n    time as may be posted in the box or indicated in special instructions. The required waiting\n    period need not be observed when occupancy indication lights on the conflicting route(s) are\n    illuminated.\n    MULTI-TRACK - When the lights of the same railway on the adjacent track are not lighted and\n    no movement is seen approaching, the foreman will contact the RTC before opening the switch,\n    to ascertain whether or not a movement is closely approaching on that adjacent track to prevent\n    displaying STOP indications to such movement.",
        hash: "c517819cf53d",
        page: 97
      },
      {
        id: "806(a)",
        kind: "subrule",
        number: "806(a)",
        parent: "806",
        text: "Track Work: Rule 840.3 applicable.",
        hash: "ba6e1622da2a"
      },
      {
        id: "806(b)",
        kind: "subrule",
        number: "806(b)",
        parent: "806",
        text: "Track Units: If no conflicting movement is evident, the track unit may proceed but must stop clear of the conflicting route, where the foreman must then unlock the box marked \u201Cswitches\u201D, and open the switch at the interlocking. The switch must not be closed until the track unit has cleared the conflicting route(s). EXCEPTION: A track unit that affects the signal system must stop before passing the interlocking signal. Before permitting the track unit to proceed the foreman must wait five minutes or such greater time as may be posted in the box or indicated in special instructions. The required waiting period need not be observed when occupancy indication lights on the conflicting route(s) are illuminated. MULTI-TRACK - When the lights of the same railway on the adjacent track are not lighted and no movement is seen approaching, the foreman will contact the RTC before opening the switch, to ascertain whether or not a movement is closely approaching on that adjacent track to prevent displaying STOP indications to such movement.",
        hash: "74a71c0141d6"
      },
      {
        id: "807",
        kind: "rule",
        number: "807",
        title: "Locally-Controlled Interlocking \u2013 Railway Crossing At Grade",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "(a) Track Work:\n    Separate TOP for the interlocking or other written instructions issued by the signalman.\n(b) Track Units:\n    Operation beyond the interlocking signal must not be made until verbal authority, hand signal or\n    separate TOP for the interlocking has been received from the signalman.\n    If the control office is closed or all attempts to communicate with the signalman fail, the foreman\n    must;\n    (i) if no conflicting movement is evident, unlock the box marked \u201Cswitches\u201D located at the\n          interlocking and, after opening the switch must wait five minutes or such greater time as\n          may be specified in the box before permitting the track unit to proceed;\n    (ii) not close the switch until the track unit clears the interlocking limits; and\n    (iii) where switches are not provided, follow the instructions posted in the box or contained in\n          special instructions.",

        page: 97
      },
      {

        kind: "subrule",

        kind: "subrule",
        number: "807(b)",
        parent: "807",
        text: "Track Units: Operation beyond the interlocking signal must not be made until verbal authority, hand signal or separate TOP for the interlocking has been received from the signalman. If the control office is closed or all attempts to communicate with the signalman fail, the foreman must;",

        hash: "b3d57ee1cf75"

        hash: "5d9f19c0a04f"

      {
        id: "811",
        kind: "rule",
        number: "811",
        title: "Signalman Requirements \u2013 Controlled Interlockings",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "Before giving verbal authority or a hand signal to proceed, a signalman must;\n(a) ensure there are no conflicting movements within or authorized to enter the authorized route;\n(b) block at STOP all devices controlling signals governing movements into the authorized route;\n    and\n(c) maintain the blocking until the foreman has reported clear of the authorized route.",
        hash: "35860b940745",
        page: 98
      },
      {
        id: "811(a)",
        kind: "subrule",
        number: "811(a)",
        parent: "811",
        text: "ensure there are no conflicting movements within or authorized to enter the authorized route;",
        hash: "d19504418e56"
      },
      {
        id: "811(b)",
        kind: "subrule",
        number: "811(b)",
        parent: "811",
        text: "block at STOP all devices controlling signals governing movements into the authorized route; and",

      {

        parent: "sec:protection-of-track-units-and-track-work",
        text: "(a) Track Work:\n    Rule 841 applicable.\n(b) Track Units:\n    Operation beyond the governing stop sign must not be made until it is ascertained that no\n    conflicting movement is evident.\n    Special instructions will govern, when there is an attendant in charge.",

      {

        hash: "3aee65e049ba"

      {

        kind: "subrule",
        number: "813(b)",
        parent: "813",
        text: "Track Units: Operation beyond the governing stop sign must not be made until it has been ascertained that the route is properly lined. Special instructions will govern, when there is an attendant in charge. TRACK UNITS OPERATING OVER POWER-OPERATED AND DUAL CONTROL SWITCHES",
        hash: "a312d115ab49"
      },
      {
        id: "814",
        kind: "rule",
        number: "814",
        title: "Power-Operated Switches",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "When a track unit(s) is required to move over a power-operated switch;\n(a) the switch must be lined by the RTC, except where the RTC gives permission to the foreman to\n    have it operated by a qualified employee; and\n(b) when a power-operated switch is operated by a qualified employee, and after the track unit has\n    cleared the switch points, the foreman must immediately advise the RTC.",
        hash: "0fc8a00103cf",
        page: 99
      },
      {
        id: "814(a)",
        kind: "subrule",
        number: "814(a)",
        parent: "814",
        text: "the switch must be lined by the RTC, except where the RTC gives permission to the foreman to have it operated by a qualified employee; and",
        hash: "c4ef58e9f385"
      },
      {
        id: "814(b)",
        kind: "subrule",
        number: "814(b)",
        parent: "814",
        text: "when a power-operated switch is operated by a qualified employee, and after the track unit has cleared the switch points, the foreman must immediately advise the RTC.",

      },
      {
        id: "815",
        kind: "rule",
        number: "815",
        title: "Dual Control Switches",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "When a track unit(s) is required to move over a dual control switch;\n(a) the switch must be lined by the RTC, except where the RTC gives permission to the foreman to\n    operate such switch in the \u201Chand\u201D position; and\n(b) when a dual control switch is operated by the foreman in the \u201Chand\u201D position, and after the track\n    unit has cleared the switch points, the foreman must ensure that the selector lever has been\n    restored to the \u201Cpower\u201D position and locked and immediately advise the RTC.",

        page: 99

      {

        kind: "subrule",
        number: "815(a)",
        parent: "815",
        text: "the switch must be lined by the RTC, except where the RTC gives permission to the foreman to operate such switch in the \u201Chand\u201D position; and",
        hash: "3336eac3b821"
      },
      {
        id: "815(b)",
        kind: "subrule",
        number: "815(b)",
        parent: "815",
        text: "when a dual control switch is operated by the foreman in the \u201Chand\u201D position, and after the track unit has cleared the switch points, the foreman must ensure that the selector lever has been restored to the \u201Cpower\u201D position and locked and immediately advise the RTC.",
        hash: "bb27d9f8619b"
      },
      {
        id: "816",
        kind: "rule",
        number: "816",
        title: "Foreman Requirements - Identifying Arrival And/Or Departure Of",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "MOVEMENTS\nWhen a foreman has been authorized to perform track work behind or has authorized a\nmovement(s) to pass through working limits, the foreman or sub-foreman must not enter the track\nat a location within the limits until it has been positively ascertained that the movement(s) have\narrived and/or left that location. Such information must be received from the RTC or a crew\nmember or by the foreman or a sub-foreman identifying that a movement has arrived by visually\nidentifying the designated engine and marker. Movements operating without a marker must be\nidentified by the foreman or a sub-foreman by direct communication with a member of the crew of\nsuch or by the foreman through the RTC.\nOPTIONAL \u2013 ONLY REQUIRED FOR THOSE USING RULES 862 and 863\nThis requirement is also applicable to an employee providing arrival and departure information to\nthe RTC from a field location.",
        hash: "0b3c0a47dc08",
        page: 99
      },
      {
        id: "840.3",
        kind: "rule",
        number: "840.3",
        title: "Protection Of Track Work At Automatic Interlockings Railway",
        parent: "840",
        text: "CROSSINGS AT GRADE\nForeman must also refer to Rule 611(d).\nWhen the foreman is in possession of other protection encompassing all routes within the\ninterlocking limits, protection as per Rule 840.3 is not required.\nTrack work may be performed within the limits of an automatic interlocked railway crossing at\ngrade after protection has been provided as follows:\n(a) Permission must be obtained from the RTC of both railways (where applicable).\n(b) After permission has been obtained and before any track work is started, the foreman must\n    open the box marked \u201Cswitches\u201D, open the knife switch and must wait five minutes or such\n    greater time as may be posted in the box. The switch must be left open until track work is\n    completed.\n(c) In addition, a visible indicator marked \u201C840.3 Protection\u201D or special lock must be secured to the\n    box marked \u201Cswitches\u201D to indicate that track work is ongoing.\n(d) After track work is completed the RTC of both railways (where applicable) must be notified.",
        hash: "c34a2b5e896b",
        page: 99
      },
      {
        id: "840.3(a)",
        kind: "subrule",
        number: "840.3(a)",
        parent: "840.3",
        text: "Permission must be obtained from the RTC of both railways (where applicable).",
        hash: "196fa7a7954d"
      },
      {
        id: "840.3(b)",
        kind: "subrule",
        number: "840.3(b)",
        parent: "840.3",
        text: "After permission has been obtained and before any track work is started, the foreman must open the box marked \u201Cswitches\u201D, open the knife switch and must wait five minutes or such greater time as may be posted in the box. The switch must be left open until track work is completed.",
        hash: "d9d37602d60a"
      },
      {

        kind: "subrule",
        number: "840.3(c)",
        parent: "840.3",
        text: "In addition, a visible indicator marked \u201C840.3 Protection\u201D or special lock must be secured to the box marked \u201Cswitches\u201D to indicate that track work is ongoing.",
        hash: "72d0ea0cefc5"
      },
      {
        id: "840.3(d)",
        kind: "subrule",
        number: "840.3(d)",
        parent: "840.3",
        text: "After track work is completed the RTC of both railways (where applicable) must be notified.",
        hash: "fd8689463325"
      },
      {
        id: "841",
        kind: "rule",
        number: "841",
        title: "Protection Of Track Work On Non-Main Track And In Cautionary Limits",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "(a) Before applying protection the employee responsible, if any, for the track must be advised.\n(b) When working limits are on a track where the kicking of equipment is permitted per Rule\n    113.5(a), protection must be provided by (c)(i) or (iii).\n(c) The foreman must provide protection to prevent access to the working limits using one or more\n    of the following methods:\n    (i) lock switch(es) with a special lock, in a position to prevent a movement from entering the\n          working limits;\n    (ii) place a red flag by day, and in addition, a red light by night, or when day signals cannot be\n          plainly seen, between the rails to prevent a movement from entering the working limits.\n          Such signal(s) must be placed at least 100 yards from the working point where practicable,\n          where there will be a clear view of the signal(s) from an approaching movement of at least\n          300 yards. If there is equipment on the track which will prevent a clear view of 300 yards,\n          the red signals must be placed to include such equipment; or\n    (iii) a red signal displayed per (ii) and a derail locked in the derailing position with a special lock.",
        hash: "73e80d2241be",
        page: 100
      },
      {
        id: "841(a)",
        kind: "subrule",
        number: "841(a)",
        parent: "841",
        text: "Before applying protection the employee responsible, if any, for the track must be advised.",
        hash: "8ca3b7df2af9"
      },
      {
        id: "841(b)",
        kind: "subrule",
        number: "841(b)",
        parent: "841",
        text: "When working limits are on a track where the kicking of equipment is permitted per Rule 113.5(a), protection must be provided by (c)(i) or (iii).",
        hash: "3c9b25e17aa0"
      },
      {
        id: "841(c)",
        kind: "subrule",
        number: "841(c)",
        parent: "841",
        text: "The foreman must provide protection to prevent access to the working limits using one or more of the following methods:",
        hash: "5a8abea69267"
      },
      {
        id: "841(c)(i)",
        kind: "subrule",
        number: "841(c)(i)",
        parent: "841(c)",
        text: "lock switch(es) with a special lock, in a position to prevent a movement from entering the working limits;",
        hash: "83ec161214e3"
      },
      {
        id: "841(c)(ii)",
        kind: "subrule",
        number: "841(c)(ii)",
        parent: "841(c)",
        text: "place a red flag by day, and in addition, a red light by night, or when day signals cannot be plainly seen, between the rails to prevent a movement from entering the working limits. Such signal(s) must be placed at least 100 yards from the working point where practicable, where there will be a clear view of the signal(s) from an approaching movement of at least 300 yards. If there is equipment on the track which will prevent a clear view of 300 yards, the red signals must be placed to include such equipment; or",
        hash: "3305f34cc761"
      },
      {
        id: "841(c)(iii)",
        kind: "subrule",
        number: "841(c)(iii)",
        parent: "841(c)",
        text: "a red signal displayed per (ii) and a derail locked in the derailing position with a special lock.",
        hash: "a9857b0175ce"
      },
      {
        id: "842",
        kind: "rule",
        number: "842",
        title: "Planned Protection \u2013 Rule 42",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "(a) When protection is required, the request must be in writing and on the prescribed form. When\n    protection has been provided, the track and time limits must be confirmed in writing prior to the\n    foreman named in the GBO arranging for the display of the prescribed flags as follows;\n    (i) place a red flag at each identifiable location stated in the GBO to the right of the track as\n          seen from an approaching movement; and\n    (ii) place a yellow over red flag at least two miles outside the track limits defined by the red\n          flags, to the right of the track as seen from an approaching movement.\n    (iii) Track work must not be undertaken until the prescribed signals are in place in all directions.\n    (iv) flags must not be in place more than 30 minutes prior to or after the times stated in the GBO\n          unless provided for in the GBO.\n    (v) Track limits must not be overlapped.\n(b) When a specific track is to be used, instructions from the foreman must specify the track upon\n    which the instructions apply.\n    In CTC, when protection is in effect on more than one track or when signalled turnouts are\n    within the limits there must be a clear understanding in writing between the foreman and the\n    RTC as to what route(s) movements are to use. The foreman\u2019s instructions to the movement\n    must be identical to the routing arrangement with the RTC. Should the foreman require\n    operation on a specific track when the arrangement with the RTC was for more than one route,\n    the foreman must make a new arrangement with the RTC before authorizing the movement.\n(c) Track limits shall be kept as short as practicable and be expressed in whole miles or by other\n    identifiable locations.\n(d) The GBO must indicate the location of flags that cannot be placed at the distance prescribed.",
        hash: "456456101099",
        page: 7
      },
      {
        id: "842(a)",
        kind: "subrule",
        number: "842(a)",
        parent: "842",

        text: "When a specific track is to be used, instructions from the foreman must specify the track upon which the instructions apply. In CTC, when protection is in effect on more than one track or when signalled turnouts are within the limits there must be a clear understanding in writing between the foreman and the RTC as to what route(s) movements are to use. The foreman\u2019s instructions to the movement must be identical to the routing arrangement with the RTC. Should the foreman require operation on a specific track when the arrangement with the RTC was for more than one route, the foreman must make a new arrangement with the RTC before authorizing the movement.",
        hash: "5935663584ad"

      {
        id: "842(c)",

        parent: "842",
        text: "Track limits shall be kept as short as practicable and be expressed in whole miles or by other identifiable locations.",
        hash: "2493a68e115b"
      },
      {
        id: "842(d)",
        kind: "subrule",
        number: "842(d)",
        parent: "842",
        text: "The GBO must indicate the location of flags that cannot be placed at the distance prescribed.",
        hash: "a9f515903e52"
      },
      {
        id: "843",
        kind: "rule",
        number: "843",
        title: "Slow Track Protection \u2013 Rule 43",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "(a) When slow track protection is required the request must be in writing and when practicable on\n    the prescribed form, and after GBO protection has been provided, the speed restriction(s) and\n    limits must be confirmed to the foreman in writing who will arrange to place a:\n    (i) yellow flag to the right of the track as seen from an approaching movement at least two\n         miles in each direction from the outermost limits indicated in the GBO, and\n    (ii) green flag to the right of the track as seen from an approaching movement in each direction,\n         immediately beyond the defect.\n         Exception: When there are abutting limits contained within a single GBO, a single green flag\n         will be displayed to either side of the track to identify each restriction within the limits.\n(b) The GBO must indicate the location of flags that cannot be placed at the distance prescribed.\n(c) When the placement of flags as prescribed is delayed, the RTC must be advised and the\n    following must be added to the Form V: \u201CSignals may not be in place.\u201D The flags must be placed\n    as soon as possible and the GBO changed accordingly.\n(d) When a restriction is located at a single mile point, one green signal will be displayed to identify\n    the restriction and may be displayed to either side of the track.\n(e) When a rail break has been detected by an engineering employee and it is safe to operate over\n    the break at a speed less than posted speed, the RTC will provide GBO protection to affected\n    movements stating the authorized speed over the break and how such location is marked in the\n    field, by either a Rail Break Sign or foreman, at the break. Flags required will not be in place.\n(f) The regular placement of flags must be utilized after 24 hours if the defect is continuing.",
        hash: "d72d6b959f02",
        page: 7
      },
      {
        id: "843(a)",
        kind: "subrule",
        number: "843(a)",
        parent: "843",
        text: "When slow track protection is required the request must be in writing and when practicable on the prescribed form, and after GBO protection has been provided, the speed restriction(s) and limits must be confirmed to the foreman in writing who will arrange to place a:",
        hash: "b9a900baa82f"
      },
      {

        hash: "d318f5c67f5a"

      {

        hash: "0126f58ddf20"
      },
      {
        id: "843(f)",
        kind: "subrule",
        number: "843(f)",
        parent: "843",
        text: "The regular placement of flags must be utilized after 24 hours if the defect is continuing.",
        hash: "2ebd11beac81"
      },
      {
        id: "845",
        kind: "rule",
        number: "845",
        title: "Signal Placement Multi-Track",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "Except on a subdivision designated in special instructions, signals required by Rules 842 and 843,\nmust be placed to the outside of the outermost track(s) and not between the main tracks.",
        hash: "3a5699ab6f43",
        page: 7
      },
      {
        id: "846",
        kind: "rule",
        number: "846",
        title: "Mounting Of Signals",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "(a) Signals displayed for protection of track work and track conditions must provide an\n    unobstructed view of them as seen by the crew of an approaching movement. They will be of\n    the prescribed colour, size and shape.\n(b) When a day signal cannot be plainly seen, each flag must be reflectorized or equipped with a\n    reflectorized lens, target or disc, or a reflectorized sign may be used instead. In the application\n    of Rule 841, the required light must be displayed.\n(c) Red, yellow, and yellow over red flags may display those colours only in the direction of an\n    affected approaching movement. Green flags must display that colour in both directions.\n\n                            TRACK OCCUPANCY PERMITS",
        hash: "0eac5c1cd1fa",
        page: 7
      },
      {
        id: "846(a)",
        kind: "subrule",
        number: "846(a)",
        parent: "846",
        text: "Signals displayed for protection of track work and track conditions must provide an unobstructed view of them as seen by the crew of an approaching movement. They will be of the prescribed colour, size and shape.",
        hash: "bb9610375b3c"
      },
      {
        id: "846(b)",
        kind: "subrule",
        number: "846(b)",
        parent: "846",
        text: "When a day signal cannot be plainly seen, each flag must be reflectorized or equipped with a reflectorized lens, target or disc, or a reflectorized sign may be used instead. In the application of Rule 841, the required light must be displayed.",
        hash: "2bc3fab36e8e"
      },
      {
        id: "846(c)",
        kind: "subrule",
        number: "846(c)",
        parent: "846",
        text: "Red, yellow, and yellow over red flags may display those colours only in the direction of an affected approaching movement. Green flags must display that colour in both directions. TRACK OCCUPANCY PERMITS",
        hash: "d31f9ce18724"
      },
      {
        id: "849",
        kind: "rule",
        number: "849",
        title: "Before Issuing Top Authority",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "Before issuing TOP authority, the RTC must;\n(a) ensure there is no conflicting movement within, or authorized to enter, the TOP limits to be\n    granted unless such movement has been restricted in accordance with Rule 311, 567.1, 567.2,\n    618 or 618.1; and\n(b) in CTC and controlled interlockings, block at Stop all devices controlling signals governing the\n    entry of movements into the limits to be granted. Signal blocking applied to protect a TOP must\n    be maintained until the TOP is cancelled to the foreman.",
        hash: "94fcc2480380",
        page: 7
      },
      {
        id: "849(a)",
        kind: "subrule",
        number: "849(a)",
        parent: "849",
        text: "ensure there is no conflicting movement within, or authorized to enter, the TOP limits to be granted unless such movement has been restricted in accordance with Rule 311, 567.1, 567.2, 618 or 618.1; and",
        hash: "69470f028449"
      },
      {
        id: "849(b)",
        kind: "subrule",
        number: "849(b)",
        parent: "849",
        text: "in CTC and controlled interlockings, block at Stop all devices controlling signals governing the entry of movements into the limits to be granted. Signal blocking applied to protect a TOP must be maintained until the TOP is cancelled to the foreman.",
        hash: "46cd22500218"
      },
      {
        id: "850",
        kind: "rule",
        number: "850",
        title: "Same Or Overlapping Top Limits",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "The RTC must not authorize a movement to enter overlapping TOP limits.",
        hash: "50ae31077daf",
        page: 7
      },
      {
        id: "851",
        kind: "rule",
        number: "851",
        title: "Top Authority Within Cautionary Limits",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "(a) A TOP must not be issued to apply within cautionary limits where there are movements\n    operated that cannot be controlled by the RTC.\n(b) The RTC must not authorize a movement to the cautionary limit sign while a TOP is in effect\n    within such limits.",
        hash: "31c8a9b7d89a",
        page: 7
      },
      {
        id: "851(a)",
        kind: "subrule",
        number: "851(a)",
        parent: "851",
        text: "A TOP must not be issued to apply within cautionary limits where there are movements operated that cannot be controlled by the RTC.",
        hash: "fd27c828bbf9"
      },
      {
        id: "851(b)",
        kind: "subrule",
        number: "851(b)",
        parent: "851",
        text: "The RTC must not authorize a movement to the cautionary limit sign while a TOP is in effect within such limits.",
        hash: "d5ea6385ba3f"
      },
      {
        id: "852",
        kind: "rule",
        number: "852",
        title: "Top Encompassing Controlled Locations",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "When authorized by a TOP to occupy a track within a controlled location, the authority includes any\ntrack within the controlled location that connects to that track but only to a point on the connecting\ntrack where occupancy would require separate TOP authority.",
        hash: "358c9b1241d3",
        page: 7
      },
      {
        id: "853",
        kind: "rule",
        number: "853",
        title: "Remains In Effect",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "A TOP once in effect continues so until superseded or cancelled.",
        hash: "2192db72b776",
        page: 7
      },
      {
        id: "854",
        kind: "rule",
        number: "854",
        title: "One Track Unit \u2013 Foreman Requirements",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "Before acting under the authority of a TOP, a foreman in charge of a single track unit must;\n(a) read the TOP aloud to the employees accompanying the track unit; and\n(b) require those employees who hold a valid certificate of rules qualification to read and initial the\n    TOP.",
        hash: "aa8beca39f6c",
        page: 7
      },
      {
        id: "854(a)",
        kind: "subrule",
        number: "854(a)",
        parent: "854",
        text: "read the TOP aloud to the employees accompanying the track unit; and",
        hash: "cd32cd643c2e"
      },
      {
        id: "854(b)",
        kind: "subrule",
        number: "854(b)",
        parent: "854",
        text: "require those employees who hold a valid certificate of rules qualification to read and initial the TOP.",
        hash: "117fc6b9f381"
      },
      {
        id: "855",
        kind: "rule",
        number: "855",
        title: "Multiple Track Units And/Or Track Work \u2013 Foreman Requirements",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "Before acting under the authority of a TOP, a foreman in charge of the protection of track work or in\ncharge of more than one track unit must;\n(a) read the TOP aloud to at least one other employee involved in the work who holds a valid\n    certificate of rules; and\n(b) when conditions permit, require those to whom the TOP is read aloud, to read and initial the\n    TOP.\nSpecial instructions will indicate additional procedures for protection of sub-foreman.",
        hash: "4d4851875dfb",
        page: 7
      },
      {
        id: "855(a)",
        kind: "subrule",
        number: "855(a)",
        parent: "855",
        text: "read the TOP aloud to at least one other employee involved in the work who holds a valid certificate of rules; and",
        hash: "d4d359ee240e"
      },
      {
        id: "855(b)",
        kind: "subrule",
        number: "855(b)",
        parent: "855",
        text: "when conditions permit, require those to whom the TOP is read aloud, to read and initial the TOP. Special instructions will indicate additional procedures for protection of sub-foreman.",
        hash: "2d23de4e6d33"
      },
      {
        id: "856",
        kind: "rule",
        number: "856",
        title: "Communication Between Employees And Foremen",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "An employee who has been made aware of the contents of the TOP must remind the foreman of\nthe contents in sufficient time to ensure compliance.",
        hash: "62bde3a66496",
        page: 7
      },
      {
        id: "857",
        kind: "rule",
        number: "857",
        title: "Multiple Top",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "Where required, special instructions will indicate additional procedures.\n\n                                     EXCLUSIVE TOP",
        hash: "77cb95330e05",
        page: 7
      },
      {
        id: "858",
        kind: "rule",
        number: "858",
        title: "Exclusive Designation",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "When an Exclusive TOP is issued, it must be indicated in the appropriate section of the TOP.",
        hash: "947c1367afc1",
        page: 7
      },
      {
        id: "859",
        kind: "rule",
        number: "859",
        title: "Exclusivity",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "Before an Exclusive TOP is issued, the RTC must verify that no other TOP, Form Y or Form T is in\neffect within the limits to be covered by the TOP.\nAn Exclusive TOP must not be issued as a Follow-Up TOP.",
        hash: "a1134b7eea66",
        page: 7
      },
      {
        id: "860",
        kind: "rule",
        number: "860",
        title: "After Issuing An Exclusive Top",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "Within the limits of an Exclusive TOP, the RTC must;\n(a) not issue another TOP;\n(b) not issue a Form T or Form Y;\n(c) not issue a Rule 311, 567.1, 567.2, 618 or 618.1 authority to a movement.",
        hash: "defff8747777",
        page: 7
      },
      {
        id: "860(a)",
        kind: "subrule",
        number: "860(a)",
        parent: "860",
        text: "not issue another TOP;",
        hash: "7da1a491b528"
      },
      {
        id: "860(b)",
        kind: "subrule",
        number: "860(b)",
        parent: "860",
        text: "not issue a Form T or Form Y;",
        hash: "5ba6c02c528e"
      },
      {
        id: "860(c)",
        kind: "subrule",
        number: "860(c)",
        parent: "860",
        text: "not issue a Rule 311, 567.1, 567.2, 618 or 618.1 authority to a movement.",
        hash: "77845fd23e1f"
      },
      {
        id: "861",
        kind: "rule",
        number: "861",
        title: "Exclusive Top \u2013 Two Track Units",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "When a second track unit is occupying the limits, both track unit operators must have a thorough\nunderstanding in writing as to the operation of each other.\n\n                                     FOLLOW-UP TOP",
        hash: "adef6b1f378a",
        page: 7
      },
      {
        id: "862",
        kind: "rule",
        number: "862",
        title: "Rtc Requirements",
        parent: "sec:protection-of-track-units-and-track-work",
        text: "When one or more movements remain within the limits to be covered by a TOP, the RTC may\nissue a Follow-Up TOP to a foreman, provided such movements are authorized to proceed in the\nsame direction and have left the location where the foreman will enter the limits of the TOP.\nThe RTC;\n(a) may only issue the TOP to the foreman when the foreman is at the location where the foreman\n    will enter the limits of the TOP;\n(b) must not issue the TOP if any of the movements are authorized to reverse within the limits; or\n(c) authorize any of the movements to reverse within the limits; and\n(d) before issuing the TOP, verify that each movement has left the location where the foreman will\n    enter the limits; and\n(e) in the TOP, include the designation and location that the last movement has left.",
        hash: "e920ce6af43b",
        page: 7
      },
      {
        id: "862(a)",
        kind: "subrule",
        number: "862(a)",
        parent: "862",
        text: "may only issue the TOP to the foreman when the foreman is at the location where the foreman will enter the limits of the TOP;",
        hash: "0bcb53cacb72"
      },
      {
        id: "862(b)",
        kind: "subrule",
        number: "862(b)",
        parent: "862",
        text: "must not issue the TOP if any of the movements are authorized to reverse within the limits; or",
        hash: "520a8948e2aa"
      },
      {
        id: "862(c)",
        kind: "subrule",
        number: "862(c)",
        parent: "862",
        text: "authorize any of the movements to reverse within the limits; and",
        hash: "bd39ad0a3b36"
      },
      {
        id: "862(d)",
        kind: "subrule",
        number: "862(d)",
        parent: "862",
        text: "before issuing the TOP, verify that each movement has left the location where the foreman will enter the limits; and",
        hash: "a59d7713119b"
      },
      {
        id: "862(e)",
        kind: "subrule",
        number: "862(e)",
        parent: "862",
        text: "in the TOP, include the designation and location that the last movement has left.",
        hash: "c097419652ec"
      },
      {
        id: "862.1",
        kind: "rule",
        number: "862.1",
        title: "Optional Rtc Requirements",
        parent: "862",
        text: "When one or more movements remain within, are, or will be authorized into the limits to be covered\nby a TOP, the RTC may issue a Follow-Up TOP to a foreman, provided such movements are\nauthorized to proceed in the same direction.\nThe RTC must;\n(a) specify the designation of each movement on the TOP; and\n(b) not authorize any of the movements to reverse within the limits.",
        hash: "fc508dbef7dc",
        page: 7
      },
      {
        id: "862.1(a)",
        kind: "subrule",
        number: "862.1(a)",
        parent: "862.1",
        text: "specify the designation of each movement on the TOP; and",
        hash: "b8e949e5af19"
      },
      {
        id: "862.1(b)",
        kind: "subrule",
        number: "862.1(b)",
        parent: "862.1",
        text: "not authorize any of the movements to reverse within the limits.",
        hash: "39360d1d951d"
      },
