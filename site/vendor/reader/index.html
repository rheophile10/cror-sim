        id: "136(b)",
        kind: "subrule",
        number: "136(b)",
        parent: "136",
        text: "GBO, authorities or instructions must not be copied by the employee operating moving equipment or track units, if it will interfere with the safe operation of such equipment or track unit.",
        hash: "4b4077f811c5"
      },
      {
        id: "136(c)",
        kind: "subrule",
        number: "136(c)",
        parent: "136",
        text: "The RTC must verify each written word and digit each time it is repeated. If correct, the RTC will respond \u201Ccomplete\u201D and the initials of the RTC, which will be recorded and acknowledged by the employee copying. The employee copying must acknowledge by repeating \u201Ccomplete\u201D and the initials of the RTC to the RTC.",
        hash: "9e85ca811503"
      },
      {
        id: "136(d)",
        kind: "subrule",
        number: "136(d)",
        parent: "136",
        text: "When transmitted by voice communication direct to the crew of a movement, it must not be completed until each crew member copying has correctly repeated it.",
        hash: "ae3b98a6e2d7"
      },
      {
        id: "137",
        kind: "rule",
        number: "137",
        title: "Foreman\u2019S Instructions",
        parent: "sec:general-procedures",
        text: "Instructions from a foreman must be in writing except when the instructions permit unrestricted\noperation through the entire limits.",
        hash: "20faeba73f93",
        page: 60
      },
      {
        id: "138",
        kind: "rule",
        number: "138",
        title: "Foreman\u2019S Instructions (Optional)",
        parent: "sec:general-procedures",
        text: "Instructions from a foreman must be in writing.",
        hash: "260749c14c2b",
        page: 60
      },
      {
        id: "139",
        kind: "rule",
        number: "139",
        title: "Becoming Effective",
        parent: "sec:general-procedures",
        text: "A GBO, clearance, TOP or other authority becomes effective at the moment the word \u201Ccomplete\u201D\nand initials of the RTC are given by the RTC. However, the RTC must not take further action if\nthere is a restriction contained therein until acknowledged by the employee copying.",
        hash: "9e480dc2956b",
        page: 60
      },
      {
        id: "140",
        kind: "rule",
        number: "140",
        title: "Changes After Becoming Effective",
        parent: "sec:general-procedures",
        text: "Changes must not be made to a GBO, clearance, TOP or other authority after becoming effective,\nexcept when;\n(i) an address is added to a GBO, the number and the applicable portion of the GBO address must\n      be repeated to and verified by the RTC;\n(ii) a time or location to call the RTC is indicated on a clearance, TOP or other authority, such time\n      or location may be changed as required. When so changed, the employee copying must draw a\n      line through the previous time or location;\n(iii) a computer assisted system is used to issue GBO, the effective time and/or date may be\n      removed from the GBO in the system after the effective time, and in the application of Rule 43\n      instructions in the GBO stating \u201Csignals may not be in place\u201D may be removed after the foreman\n      confirms that signals have been placed;\n(iv) speed is changed, the employee copying must draw a line through the current and replace with\n      the revised. The GBO number and revised speed must be repeated to and acknowledged by\n      the RTC; and\n(v) a computer-assisted system is used, the limit(s) of a TOP may be changed as required, the\n      employee copying must draw a line through the current location(s) and replace with the revised.\n      The TOP number and revised limits must be repeated to and acknowledged by the RTC.",
        hash: "a2acbe7bc891",
        page: 61
      },
      {
        id: "140(i)",
        kind: "subrule",
        number: "140(i)",
        parent: "140",
        text: "an address is added to a GBO, the number and the applicable portion of the GBO address must be repeated to and verified by the RTC;",
        hash: "a21b97807a70"
      },
      {
        id: "140(ii)",
        kind: "subrule",
        number: "140(ii)",
        parent: "140",
        text: "a time or location to call the RTC is indicated on a clearance, TOP or other authority, such time or location may be changed as required. When so changed, the employee copying must draw a line through the previous time or location;",
        hash: "77798f62c0fa"
      },
      {
        id: "140(iii)",
        kind: "subrule",
        number: "140(iii)",
        parent: "140",
        text: "a computer assisted system is used to issue GBO, the effective time and/or date may be removed from the GBO in the system after the effective time, and in the application of Rule 43 instructions in the GBO stating \u201Csignals may not be in place\u201D may be removed after the foreman confirms that signals have been placed;",
        hash: "ebeddcb0648d"
      },
      {
        id: "140(iv)",
        kind: "subrule",
        number: "140(iv)",
        parent: "140",
        text: "speed is changed, the employee copying must draw a line through the current and replace with the revised. The GBO number and revised speed must be repeated to and acknowledged by the RTC; and",
        hash: "daf86cb4faec"
      },
      {
        id: "140(v)",
        kind: "subrule",
        number: "140(v)",
        parent: "140",
        text: "a computer-assisted system is used, the limit(s) of a TOP may be changed as required, the employee copying must draw a line through the current location(s) and replace with the revised. The TOP number and revised limits must be repeated to and acknowledged by the RTC.",
        hash: "d5eb40a44b30"
      },
      {
        id: "141",
        kind: "rule",
        number: "141",
        title: "Making Additional Copies",
        parent: "sec:general-procedures",
        text: "(a) When additional copies of a GBO, clearance, TOP or other authority are required, they may be\n    received from the RTC or made from one previously completed. Such copies must be repeated\n    to the RTC from the new copy except when received from an ECM or reproduced by a\n    duplicating device.\n(b) An employee producing or reproducing a copy for delivery to another employee must check\n    each copy to ensure legibility.",
        hash: "336152f41af3",
        page: 61
      },
      {
        id: "141(a)",
        kind: "subrule",
        number: "141(a)",
        parent: "141",
        text: "When additional copies of a GBO, clearance, TOP or other authority are required, they may be received from the RTC or made from one previously completed. Such copies must be repeated to the RTC from the new copy except when received from an ECM or reproduced by a duplicating device.",
        hash: "0d925e8ec58a"
      },
      {
        id: "141(b)",
        kind: "subrule",
        number: "141(b)",
        parent: "141",
        text: "An employee producing or reproducing a copy for delivery to another employee must check each copy to ensure legibility.",
        hash: "0eb9a2a42965"
      },
      {
        id: "142",
        kind: "rule",
        number: "142",
        title: "Understanding Between Crew Members",
        parent: "sec:general-procedures",
        text: "(a) Every conductor, locomotive engineer, pilot and snow plow foreman must read and have a\n    proper understanding of all GBO and clearances as soon as possible after they have been\n    received. Each must be made available to other crew members, as soon as practicable,\n    ensuring that each crew member has read and understands them and, when required, the\n    arrangements for protection between crews and between foremen and crews.\n(b) Crew members within physical hearing range are required to remind one another of the\n    restrictions contained in GBO and clearances in sufficient time to ensure compliance.",
        hash: "ab4ec66304c0",
        page: 61
      },
      {
        id: "142(a)",
        kind: "subrule",
        number: "142(a)",
        parent: "142",
        text: "Every conductor, locomotive engineer, pilot and snow plow foreman must read and have a proper understanding of all GBO and clearances as soon as possible after they have been received. Each must be made available to other crew members, as soon as practicable, ensuring that each crew member has read and understands them and, when required, the arrangements for protection between crews and between foremen and crews.",
        hash: "32b53dda1845"
      },
      {
        id: "142(b)",
        kind: "subrule",
        number: "142(b)",
        parent: "142",
        text: "Crew members within physical hearing range are required to remind one another of the restrictions contained in GBO and clearances in sufficient time to ensure compliance.",
        hash: "4c314bd5a39c"
      },
      {
        id: "143",
        kind: "rule",
        number: "143",
        title: "Gbo Numbers On Clearance",
        parent: "sec:general-procedures",
        text: "When specified in special instructions, the number of each GBO in effect at the time the clearance\nis issued, which will affect the movement on each subdivision or on the entire trip, will be shown on\nthe first clearance sent to that crew. When there are no GBO for that movement, the word \u201Cnil\u201D will\nbe shown.",
        hash: "fa0beb2bb6c4",
        page: 61
      },
      {
        id: "147",
        kind: "rule",
        number: "147",
        title: "Transfer Between Crews",
        parent: "sec:general-procedures",
        text: "(a) When a conductor, locomotive engineer or both are changed off, or relieved, all GBO, DOB,\n    clearances, authorities, TGBO and other written instructions and all necessary information still\n    in effect must be transferred personally to the relieving crew. The transfer of information must\n    be known to be understood by the relieving employee(s).\n(b) When it is not practicable to carry out a personal transfer, crews relieved of duty on line must\n    contact the RTC as to the disposition of all documentation and authorities held for their\n    movement. If documentation is to be left at any point for the relieving crew, a list of the items\n\n    transferred must be prepared and signed by the crew member(s) going off duty. The relieving\n    crew must compare all pertinent information with the RTC before proceeding.\n(c) The relieving crew of a movement that has been tied up on line must contact the RTC to ensure\n    that there are no restrictions against moving any portion of their movement. In addition when\n    taking control of a movement occupying a CTC controlled track, if unable to ascertain the last\n    signal indication for their movement, RESTRICTED speed applies to the next signal.\n(d) Verbal instructions received from a foreman must not be transferred between crews. The\n    relieving crew must contact the foreman and obtain the necessary authority and/or instructions.",

        title: "Personal Transfer Between Rtc",
        parent: "sec:general-procedures",
        text: "(a) Where an ECM is used or where a computer assisted system generates a list as defined in\n    paragraph (b), the relieving RTC must sign into the system in the presence of the on-duty RTC,\n    and receive verbal and/or written transfer of other necessary instructions and information.\n(b) Except as prescribed in paragraph (a), before being relieved, an RTC must make an indelible\n    list in a book provided for the purpose, of GBO, TOP, clearances, and other authorities in effect:\n    (i) Each such record must have been read, understood and initialled by the relieving RTC.\n    (ii) Other necessary instructions and information must also be transferred.\n    (iii) Both RTC must sign the transfer and the relieving RTC will record the time the transfer is\n          completed.",

      {
        id: "151",
        kind: "rule",
        number: "151",
        title: "Identical Meaning To All",
        parent: "sec:general-bulletin-order-gbo",
        text: "The body of each GBO must be given in the same words and figures to each employee and\nmovement addressed.",
        hash: "ee1db9b0ed95",
        page: 63
      },
      {
        id: "152",
        kind: "rule",
        number: "152",
        title: "Delivery Of Gbo",
        parent: "sec:general-bulletin-order-gbo",
        text: "The RTC must ensure that movements affected by a GBO are issued a copy of the GBO, or are\notherwise secured.",
        hash: "768ebd235826",
        page: 63
      },
      {
        id: "153",
        kind: "rule",
        number: "153",
        title: "Confirmation To A Foreman",
        parent: "sec:general-bulletin-order-gbo",
        text: "Confirmation of protection must not be given to a foreman until all movements affected have\nreceived a copy of the GBO or are otherwise secured.",
        hash: "5bf448f0f61f",
        page: 63
      },
      {
        id: "154",
        kind: "rule",
        number: "154",
        title: "Remain In Effect",
        parent: "sec:general-bulletin-order-gbo",
        text: "GBO remain in effect for the entire tour of duty unless cancelled. GBO must be retained at away\nfrom home locations to be available, if required, for the return trip.",
        hash: "947b1dfae563",
        page: 63
      },
      {
        id: "155",
        kind: "rule",
        number: "155",
        title: "Cancelling Gbo",
        parent: "sec:general-bulletin-order-gbo",
        text: "(a) To cancel an item of a GBO, the RTC will use the following:\n    Item           of GBO               is cancelled            (RTC).\n(b) To cancel a GBO, the RTC will use the following:\n     GBO               is cancelled                              (RTC).\n(c) The cancellation must be repeated to, and acknowledged by, the RTC.",
        hash: "ed5905486f52",
        page: 63
      },
      {
        id: "155(a)",
        kind: "subrule",
        number: "155(a)",
        parent: "155",
        text: "To cancel an item of a GBO, the RTC will use the following: Item of GBO is cancelled (RTC).",
        hash: "4854c101e1d4"
      },
      {
        id: "155(b)",
        kind: "subrule",
        number: "155(b)",
        parent: "155",
        text: "To cancel a GBO, the RTC will use the following: GBO is cancelled (RTC).",
        hash: "6c6bd35a598c"
      },
      {
        id: "155(c)",
        kind: "subrule",
        number: "155(c)",
        parent: "155",
        text: "The cancellation must be repeated to, and acknowledged by, the RTC.",
        hash: "90a133351e1b"
      },
      {
        id: "156",
        kind: "rule",
        number: "156",
        title: "Daily Operating Bulletin (Dob)",
        parent: "sec:general-bulletin-order-gbo",
        text: "(a) Except as provided for in paragraph (b), a movement must not move on any track where DOB\n    is applicable unless it is in possession of:\n    (i) the current DOB; or\n    (ii) a TGBO which is applicable within the portion of the limits of the DOB over which the\n         movement will operate.\n(b) The DOB will take effect at the time specified and will remain in effect until the same time the\n    following day. A crew of a movement within DOB limits unable to clear the limits before the\n    DOB expires, or unable to obtain a copy of the next current DOB, must contact the RTC. In\n    such circumstances, the DOB may be extended by the RTC with any necessary changes. If\n    unable to communicate with the RTC, the movement must be stopped.\n(c) All crew members must verify that the DOB is properly dated, and it contains the correct\n    number of pages.\n(d) The RTC will ensure that the information or instructions contained in each GBO, pertaining to\n    track or other conditions within such limits, is correct and placed in the appropriate DOB.",
        hash: "fb786e2331c2",
        page: 63
      },
      {
        id: "156(a)",
        kind: "subrule",
        number: "156(a)",
        parent: "156",
        text: "Except as provided for in paragraph (b), a movement must not move on any track where DOB is applicable unless it is in possession of:",

      },
      {

        kind: "subrule",

        parent: "156(a)",

      },

        kind: "subrule",

        parent: "156(a)",
        text: "a TGBO which is applicable within the portion of the limits of the DOB over which the movement will operate.",

        number: "156(b)",
        parent: "156",
        text: "The DOB will take effect at the time specified and will remain in effect until the same time the following day. A crew of a movement within DOB limits unable to clear the limits before the DOB expires, or unable to obtain a copy of the next current DOB, must contact the RTC. In such circumstances, the DOB may be extended by the RTC with any necessary changes. If unable to communicate with the RTC, the movement must be stopped.",

        text: "The RTC will ensure that the information or instructions contained in each GBO, pertaining to track or other conditions within such limits, is correct and placed in the appropriate DOB.",
        hash: "b7c93e652cc0"
      },
      {
        id: "157",
        kind: "rule",
        number: "157",
        title: "Tabular General Bulletin Order (Tgbo)",
        parent: "sec:general-bulletin-order-gbo",
        text: "(a) A movement must not move on any track where TGBO is applicable, unless it is in possession\n    of a TGBO addressed to them.\n    OPTIONAL: Overlapping TGBO and DOB Limits. Movements required to operate outside of\n    DOB limits must operate their entire trip with a TGBO addressed to them unless authorized by\n    the RTC or by special instructions.\n(b) All crew members must ensure that their movement is properly designated on their TGBO, it\n    contains the correct number of pages and that the limits cover the specific routing. If an\n    incorrectly designated TGBO is received or there is no TGBO for that movement the RTC must\n    be contacted immediately.\n(c) When designated using the movement identification number, the train journal, list or other\n    acceptable document may be used for verification. If the designation on the TGBO is incorrect,\n    a change of designation must be issued by the RTC. If the designation of the train journal, list\n    or other acceptable document is incorrect while the TGBO designation is correct, the\n    designation on the train journal, list or other acceptable document may be changed when\n    authorized by the RTC, a company officer or other employee who has access to the correct\n    information. When a train journal, list or other acceptable document is not available, a member\n    of the crew may obtain the correct designation of the movement for comparison to the TGBO\n    from the RTC, Company Supervisor or other employee who has access to this information.\n(d) A crew of a movement within TGBO limits with a TGBO that includes an item that cancels the\n    TGBO at a specific time, must communicate with and be governed by instructions of the RTC\n    before the expiry time. If unable to communicate with the RTC and unable to clear TGBO limits,\n    the movement must be stopped.",
        hash: "4073c7971f92",
        page: 64
      },
      {
        id: "157(a)",
        kind: "subrule",
        number: "157(a)",
        parent: "157",
        text: "A movement must not move on any track where TGBO is applicable, unless it is in possession of a TGBO addressed to them. OPTIONAL: Overlapping TGBO and DOB Limits. Movements required to operate outside of DOB limits must operate their entire trip with a TGBO addressed to them unless authorized by the RTC or by special instructions.",
        hash: "b37a94f07217"
      },
      {

        text: "All crew members must ensure that their movement is properly designated on their TGBO, it contains the correct number of pages and that the limits cover the specific routing. If an incorrectly designated TGBO is received or there is no TGBO for that movement the RTC must be contacted immediately.",

        hash: "8128360c746e"
      },
      {
        id: "301",
        kind: "rule",
        number: "301",
        title: "Application And Supervision",
        parent: "sec:occupancy-control-system-ocs-rules",
        text: "(a) On subdivisions, portions of subdivisions or other tracks specified in special instructions,\n    movements will be governed by Occupancy Control System (OCS) Rules.\n(b) The RTC will supervise OCS territory by means of clearances, TOP, GBO and other\n    instructions as may be required.",
        hash: "4160f20be973",
        page: 66
      },
      {
        id: "301(a)",
        kind: "subrule",
        number: "301(a)",
        parent: "301",
        text: "On subdivisions, portions of subdivisions or other tracks specified in special instructions, movements will be governed by Occupancy Control System (OCS) Rules.",
        hash: "e1156855a6d0"
      },
      {
        id: "301(b)",
        kind: "subrule",
        number: "301(b)",
        parent: "301",
        text: "The RTC will supervise OCS territory by means of clearances, TOP, GBO and other instructions as may be required.",
        hash: "2aeddc593272"
      },
      {
        id: "302",
        kind: "rule",
        number: "302",
        title: "Clearance Required",
        parent: "sec:occupancy-control-system-ocs-rules",
        text: "(a) Except within cautionary limits, a train or transfer must be authorized by a clearance to foul or\n    enter a track where OCS rules are applicable.\n(b) A clearance will be sent direct to the crew of the train or transfer addressed. Before the\n    clearance is acted upon the conductor and locomotive engineer must, as soon as possible,\n    ensure that each is in possession of the clearance and their train or transfer is correctly\n    designated. Engine number must be verified visually to ensure correctness.",
        hash: "62fcd02b3118",
        page: 66
      },
      {
        id: "302(a)",
        kind: "subrule",
        number: "302(a)",
        parent: "302",
        text: "Except within cautionary limits, a train or transfer must be authorized by a clearance to foul or enter a track where OCS rules are applicable.",
        hash: "80d845741595"
      },
      {
        id: "302(b)",
        kind: "subrule",
        number: "302(b)",
        parent: "302",
        text: "A clearance will be sent direct to the crew of the train or transfer addressed. Before the clearance is acted upon the conductor and locomotive engineer must, as soon as possible, ensure that each is in possession of the clearance and their train or transfer is correctly designated. Engine number must be verified visually to ensure correctness.",
        hash: "2debdb59d8c5"
      },
      {
        id: "302.1",
        kind: "rule",
        number: "302.1",
        title: "Clearance In Effect",
        parent: "302",
        text: "A clearance remains in effect until fulfilled, superseded or cancelled.\nClearances that authorize a train or transfer to proceed, unless cancelled, must be fulfilled in the\norder in which they are issued on that subdivision.",
        hash: "4876d98bb713",
        page: 66
      },
      {
        id: "302.2",
        kind: "rule",
        number: "302.2",
        title: "Superseding A Clearance",
        parent: "302",
        text: "(a) A clearance may be issued superseding a clearance already in possession of the crew of the\n    train or transfer addressed.\n(b) When superseding a clearance that includes limits the train or transfer is occupying, the\n    superseding clearance must include that section of track and must not include a requirement to\n    wait until the arrival of an opposing train or transfer.\n(c) If a superseding clearance restricts the authority already in possession of the train or transfer\n    addressed, the RTC must not take further action until it has been acknowledged by the\n    conductor and locomotive engineer.",
        hash: "222aefcbd672",
        page: 66
      },
      {
        id: "302.2(a)",
        kind: "subrule",
        number: "302.2(a)",
        parent: "302.2",
        text: "A clearance may be issued superseding a clearance already in possession of the crew of the train or transfer addressed.",
        hash: "fa720998b840"
      },
      {
        id: "302.2(b)",
        kind: "subrule",
        number: "302.2(b)",
        parent: "302.2",
        text: "When superseding a clearance that includes limits the train or transfer is occupying, the superseding clearance must include that section of track and must not include a requirement to wait until the arrival of an opposing train or transfer.",
        hash: "d215bab6d6b0"
      },
      {
        id: "302.2(c)",
        kind: "subrule",
        number: "302.2(c)",
        parent: "302.2",
        text: "If a superseding clearance restricts the authority already in possession of the train or transfer addressed, the RTC must not take further action until it has been acknowledged by the conductor and locomotive engineer.",
        hash: "0bef8ac96fff"
      },
      {
        id: "302.3",
        kind: "rule",
        number: "302.3",
        title: "Cancelling Clearance",
        parent: "302",
        text: "(a) Before a clearance is cancelled, the train or transfer addressed must be;\n    (i) clear of the limits;\n    (ii) protected by Form T GBO; or\n    (iii) within cautionary limits.\n(b) When a clearance is cancelled, the cancellation does not take effect until it has been\n    acknowledged by the conductor and locomotive engineer. These employees must acknowledge\n    by repeating the clearance number, \u201Ccancelled\u201D and initials of the RTC to the RTC.",
        hash: "55f3e101da75",
        page: 66
      },
      {
        id: "302.3(a)",
        kind: "subrule",
        number: "302.3(a)",
        parent: "302.3",
        text: "Before a clearance is cancelled, the train or transfer addressed must be;",
        hash: "3de6cf223759"
      },
      {
        id: "302.3(a)(i)",
        kind: "subrule",
        number: "302.3(a)(i)",
        parent: "302.3(a)",
        text: "clear of the limits;",
        hash: "a3f585722847"
      },
      {
        id: "302.3(a)(ii)",
        kind: "subrule",
        number: "302.3(a)(ii)",
        parent: "302.3(a)",
        text: "protected by Form T GBO; or",
        hash: "8e8003e32cde"
      },
      {
        id: "302.3(a)(iii)",
        kind: "subrule",
        number: "302.3(a)(iii)",
        parent: "302.3(a)",
        text: "within cautionary limits.",
        hash: "8fe8c67e1bec"
      },
      {
        id: "302.3(b)",
        kind: "subrule",
        number: "302.3(b)",
        parent: "302.3",
        text: "When a clearance is cancelled, the cancellation does not take effect until it has been acknowledged by the conductor and locomotive engineer. These employees must acknowledge by repeating the clearance number, \u201Ccancelled\u201D and initials of the RTC to the RTC.",
        hash: "49bad81b0ef1"
      },
      {
        id: "303",
        kind: "rule",
        number: "303",
        title: "Protection Against Following Trains Or Transfers",
        parent: "sec:occupancy-control-system-ocs-rules",
        text: "(a) A combination of trains or transfers to a limit of two may each be authorized to proceed in the\n    same direction, within the same limits, provided that each is instructed on its clearance to\n    protect against the other. Before either moves within the limits stated, the conductor and\n    locomotive engineer of each train or transfer must have a thorough understanding, in writing, as\n    to the specific operation of each train or transfer and the protection to be provided. If\n    communication fails between the trains or transfers affected, no moves shall be made other\n    than those which were last arranged.\n\n(b) WITHIN ABS TERRITORY\n    With the protection of at least two block signals to the rear, two or more trains or transfers may\n    be authorized to proceed in the same direction within the same limits governed by block signal\n    indications.",
        hash: "018cb76a677c",
        page: 66
      },
      {
        id: "303(a)",
        kind: "subrule",
        number: "303(a)",
        parent: "303",
        text: "A combination of trains or transfers to a limit of two may each be authorized to proceed in the same direction, within the same limits, provided that each is instructed on its clearance to protect against the other. Before either moves within the limits stated, the conductor and locomotive engineer of each train or transfer must have a thorough understanding, in writing, as to the specific operation of each train or transfer and the protection to be provided. If communication fails between the trains or transfers affected, no moves shall be made other than those which were last arranged.",
        hash: "324ca713cc00"
      },
      {
        id: "303(b)",
        kind: "subrule",
        number: "303(b)",
        parent: "303",
        text: "WITHIN ABS TERRITORY With the protection of at least two block signals to the rear, two or more trains or transfers may be authorized to proceed in the same direction within the same limits governed by block signal indications.",
        hash: "3003ea415ba1"
      },
      {
        id: "303.1",
        kind: "rule",
        number: "303.1",
        title: "Radio Protection Against Following Trains And Transfers",
        parent: "303",
        text: "(Not applicable to trains or transfers in possession of a work clearance)\nWhere specified in special instructions, protection against following trains and transfers will be\nprovided as follows:\n(a) The RTC must not authorize a train or transfer to follow a preceding train or transfer until the\n    crew of the following train or transfer has been restricted by its clearance as follows;\n    \u201CProtect against (preceding train or transfer) from (location)\u201D.\n(b) Except as provided in paragraph (d), a train or transfer so restricted must not leave the location\n    named nor leave any identifiable location until the preceding train or transfer has reported that it\n    has left an identifiable location ahead. This report must be recorded in writing by a crew\n    member of the following train or transfer. Such information may be received from the RTC.\n    Identifiable locations as listed in Rule 82 must be used. Under circumstances in which a report\n    is not received from the preceding train or transfer, the following may operate at REDUCED\n    speed to a maximum speed of 25 MPH.\n(c) A train or transfer so restricted must not pass the preceding train or transfer.\n(d) When the preceding train or transfer has stopped, arrangements may be made with the\n    following train or transfer to \u201Cclose up\u201D. These arrangements must be made in writing between\n    the crews of both trains or transfers. When the preceding train or transfer resumes moving, the\n    following train or transfer will be governed by paragraph (b).\n    When the preceding train or transfer has left the location to which the following train or transfer\n    is authorized, Rule 303.1 no longer applies.",
        hash: "41774a01de36",
        page: 67
      },
      {
        id: "303.1(a)",
        kind: "subrule",
        number: "303.1(a)",
        parent: "303.1",
        text: "The RTC must not authorize a train or transfer to follow a preceding train or transfer until the crew of the following train or transfer has been restricted by its clearance as follows; \u201CProtect against (preceding train or transfer) from (location)\u201D.",
        hash: "b7b4c493fbdf"
      },
      {
        id: "303.1(b)",
        kind: "subrule",
        number: "303.1(b)",
        parent: "303.1",
        text: "Except as provided in paragraph (d), a train or transfer so restricted must not leave the location named nor leave any identifiable location until the preceding train or transfer has reported that it has left an identifiable location ahead. This report must be recorded in writing by a crew member of the following train or transfer. Such information may be received from the RTC. Identifiable locations as listed in Rule 82 must be used. Under circumstances in which a report is not received from the preceding train or transfer, the following may operate at REDUCED speed to a maximum speed of 25 MPH.",
        hash: "3259cd9a2fc2"
      },
      {
        id: "303.1(c)",
        kind: "subrule",
        number: "303.1(c)",
        parent: "303.1",
        text: "A train or transfer so restricted must not pass the preceding train or transfer.",
        hash: "49afe3e69420"
      },
      {
        id: "303.1(d)",
        kind: "subrule",
        number: "303.1(d)",
        parent: "303.1",
        text: "When the preceding train or transfer has stopped, arrangements may be made with the following train or transfer to \u201Cclose up\u201D. These arrangements must be made in writing between the crews of both trains or transfers. When the preceding train or transfer resumes moving, the following train or transfer will be governed by paragraph (b). When the preceding train or transfer has left the location to which the following train or transfer is authorized, Rule 303.1 no longer applies.",
        hash: "b9a675db473e"
      },
      {
        id: "304",
        kind: "rule",
        number: "304",
        title: "Restriction Before Leaving",
        parent: "sec:occupancy-control-system-ocs-rules",
        text: "When a train or transfer has been restricted by clearance, such train or transfer must not leave the\npoint named until it is positively known that the opposing train(s) or transfer(s) named on the\nclearance have arrived.\nA train or transfer has not arrived until its designated engine and marker have arrived.\nTrains or transfers operating without a marker have not arrived until confirmed by direct\ncommunication with a member of the crew of such train or transfer.\nIf unable to observe the arrival of a train or transfer, or unable to communicate with a member of\nthe crew, the RTC must be contacted.",
        hash: "ee149540db6c",
        page: 67
      },
      {
        id: "304.1",
        kind: "rule",
        number: "304.1",
        title: "Stopping Clear Of Fouling Point",
        parent: "304",
        text: "A train or transfer required to stop at a meeting, clearing or waiting point, or at the end of authority,\nmust be stopped clear of the route to be used by another train or transfer.",
        hash: "41de7b6fa6dd",
        page: 67
      },
      {
        id: "305",
        kind: "rule",
        number: "305",
        title: "Before Issuing Clearance Authority",
        parent: "sec:occupancy-control-system-ocs-rules",
        text: "Before issuing clearance authority, the RTC must provide protection against all conflicting trains,\ntransfers and TOP within the limits stated.",
        hash: "ae1b4b8198b0",
        page: 67
      },
      {
        id: "306",
        kind: "rule",
        number: "306",
        title: "Track Use",
        parent: "sec:occupancy-control-system-ocs-rules",
        text: "In multi-track OCS, a clearance must specify the track(s) to be used.",
        hash: "fcdb9887860c",
        page: 67
      },
      {
        id: "308",
        kind: "rule",
        number: "308",
        title: "Work Clearance Authority",
        parent: "sec:occupancy-control-system-ocs-rules",
        text: "(a) When authorized to work by clearance a train or transfer may move in either direction within the\n    limits named in the clearance.\n\n(b) A work clearance remains in effect until superseded or cancelled.",
        hash: "de7225b90c8d",
        page: 67
      },
      {
        id: "308(a)",
        kind: "subrule",
        number: "308(a)",
        parent: "308",
        text: "When authorized to work by clearance a train or transfer may move in either direction within the limits named in the clearance.",
        hash: "590439d88f2c"
      },
      {
        id: "308(b)",
        kind: "subrule",
        number: "308(b)",
        parent: "308",
        text: "A work clearance remains in effect until superseded or cancelled.",
        hash: "d074b66eddde"
      },
      {
        id: "308.1",
        kind: "rule",
        number: "308.1",
        title: "Changing Direction \u2013 Proceed Clearance",
        parent: "308",
        text: "Unless otherwise provided by rules or special instructions, when authorized to proceed by\nclearance, a train or transfer must move only in the specified direction.\nProvided the track to be operated over has not been released or a block in ABS is not re-entered, a\ntrain or transfer authorized by clearance to proceed may reverse a distance of 300 feet or less. In\nABS a crew member must be in position to see the section of track to be used is clear and will\nremain clear of equipment or a track unit.",
        hash: "b710112175fe",
        page: 68
      },
      {
        id: "309",
        kind: "rule",
        number: "309",
        title: "Moving Through Working Limits",
        parent: "sec:occupancy-control-system-ocs-rules",
        text: "(a) To enter or move within the working limits of one or more trains or transfers, a train or transfer\n    must be restricted by its clearance as follows: \u201CProtect against Work 5748 (and Work 9460)\n    between Exeter and Jasper.\u201D\n(b) A train or transfer must not enter nor move within the working limits until a thorough\n    understanding is established with the conductor and locomotive engineer of each work train or\n    transfer. Such understanding must be in writing and include information with respect to the\n    specific operation of each train and transfer and the protection to be provided. Such protection\n    must be provided until the train or transfer has left the working limits.",
        hash: "492be85cfd88",
        page: 68
      },
      {
        id: "309(a)",
        kind: "subrule",
        number: "309(a)",
        parent: "309",
        text: "To enter or move within the working limits of one or more trains or transfers, a train or transfer must be restricted by its clearance as follows: \u201CProtect against Work 5748 (and Work 9460) between Exeter and Jasper.\u201D",
        hash: "480b13d2c34b"
      },
      {
        id: "309(b)",
        kind: "subrule",
        number: "309(b)",
        parent: "309",
        text: "A train or transfer must not enter nor move within the working limits until a thorough understanding is established with the conductor and locomotive engineer of each work train or transfer. Such understanding must be in writing and include information with respect to the specific operation of each train and transfer and the protection to be provided. Such protection must be provided until the train or transfer has left the working limits.",
        hash: "6680791db205"
      },
      {
        id: "310",
        kind: "rule",
        number: "310",
        title: "Multiple Work Authorities",
        parent: "sec:occupancy-control-system-ocs-rules",
        text: "(a) Two or more work authorities may be issued within the same or overlapping limits. Each train or\n    transfer must be restricted by its clearance to protect against each other.\n(b) Conductors and locomotive engineers authorized to work must have a thorough understanding,\n    in writing, as to the specific operation of each work train or transfer and the protection to be\n    provided.",
        hash: "2e8e311b2790",
        page: 68
      },
      {
        id: "310(a)",
        kind: "subrule",
        number: "310(a)",
        parent: "310",
        text: "Two or more work authorities may be issued within the same or overlapping limits. Each train or transfer must be restricted by its clearance to protect against each other.",
        hash: "10d25355611b"
      },
      {
        id: "310(b)",
        kind: "subrule",
        number: "310(b)",
        parent: "310",
        text: "Conductors and locomotive engineers authorized to work must have a thorough understanding, in writing, as to the specific operation of each work train or transfer and the protection to be provided.",
        hash: "3c120b87fd82"
      },
      {
        id: "311",
        kind: "rule",
        number: "311",
        title: "Protecting Against A Foreman",
        parent: "sec:occupancy-control-system-ocs-rules",
        text: "(a) A train or transfer must not be authorized to enter or move within the limits of a TOP until it has\n    been restricted as follows:\n    \u201CProtect against foreman (name) between (location) and (location).\u201D\n(b) The train or transfer must not enter, nor move within, the TOP limits until instructions have been\n    obtained from the foreman named on the clearance. These instructions must be repeated to,\n    and acknowledged by, the foreman before being acted upon.",
        hash: "9484682e3717",
        page: 68
      },
      {
        id: "311(a)",
        kind: "subrule",
        number: "311(a)",
        parent: "311",
        text: "A train or transfer must not be authorized to enter or move within the limits of a TOP until it has been restricted as follows: \u201CProtect against foreman (name) between (location) and (location).\u201D",
        hash: "975960ef7085"
      },
      {
        id: "311(b)",
        kind: "subrule",
        number: "311(b)",
        parent: "311",
        text: "The train or transfer must not enter, nor move within, the TOP limits until instructions have been obtained from the foreman named on the clearance. These instructions must be repeated to, and acknowledged by, the foreman before being acted upon.",
        hash: "1d3702929696"
      },
      {
        id: "314",
        kind: "rule",
        number: "314",
        title: "Optional To 309 And 310: Proceeding Through Or Working Within Work",
        parent: "sec:occupancy-control-system-ocs-rules",
        text: "TRAIN OR TRANSFER LIMITS\n(a) A train or transfer may be authorized to proceed through or work within the limits of one or more\n    trains or transfers authorized to work, provided such train or transfer is restricted by its\n    clearance as follows;\n    \u201CProtect against work (number) between (location) and (location)\u201D\n(b) A train or transfer must not enter nor move within the working limits until a thorough\n    understanding is established with the conductor and locomotive engineer of each train or\n    transfer authorized to work. Such understanding must be in writing and include information with\n    respect to the intended operation of each train or transfer and the protection to be provided.\n    Such protection must be provided until the train(s) or transfer(s) has left the working limits.",
        hash: "5b4c6170c48b",
        page: 68
      },
      {
        id: "314(a)",
        kind: "subrule",
        number: "314(a)",
        parent: "314",
        text: "A train or transfer may be authorized to proceed through or work within the limits of one or more trains or transfers authorized to work, provided such train or transfer is restricted by its clearance as follows; \u201CProtect against work (number) between (location) and (location)\u201D",
        hash: "cff5c3425cf9"
      },
      {
        id: "314(b)",
        kind: "subrule",
        number: "314(b)",
        parent: "314",
        text: "A train or transfer must not enter nor move within the working limits until a thorough understanding is established with the conductor and locomotive engineer of each train or transfer authorized to work. Such understanding must be in writing and include information with respect to the intended operation of each train or transfer and the protection to be provided. Such protection must be provided until the train(s) or transfer(s) has left the working limits.",
        hash: "be76c9ec575c"
      },
      {
        id: "315",
        kind: "rule",
        number: "315",
        title: "Radio Broadcast Requirements",
        parent: "sec:occupancy-control-system-ocs-rules",
        text: "(a) A member of the crew on all trains and transfers must initiate a radio broadcast to the airwaves\n    on the designated standby channel 1 to 3 miles from the next station or interlocking. This\n\n    broadcast must include the next requirement to protect against another train, transfer or\n    foreman if the restriction is between the upcoming station and the next station or interlocking.\n(b) A member of the crew located on other than the engine must confirm that the radio broadcast\n    has been made in accordance with (a). If unable to contact the engine crew to ascertain this\n    information, immediate action must be taken to stop the movement before it will reach the next\n    point of restriction.",
        hash: "c5e8a5d4f60b",
        page: 68
      },
      {
        id: "315(a)",
        kind: "subrule",
        number: "315(a)",
        parent: "315",
        text: "A member of the crew on all trains and transfers must initiate a radio broadcast to the airwaves on the designated standby channel 1 to 3 miles from the next station or interlocking. This broadcast must include the next requirement to protect against another train, transfer or foreman if the restriction is between the upcoming station and the next station or interlocking.",
        hash: "9d34cba44fef"
      },
      {
        id: "315(b)",
        kind: "subrule",
        number: "315(b)",
        parent: "315",
        text: "A member of the crew located on other than the engine must confirm that the radio broadcast has been made in accordance with (a). If unable to contact the engine crew to ascertain this information, immediate action must be taken to stop the movement before it will reach the next point of restriction.",
        hash: "9a816b1b582e"
      },
      {
        id: "351",
        kind: "rule",
        number: "351",
        title: "Application",
        parent: "sec:special-control-system-scs-rules",
        text: "On portions of the railway so specified by special instructions, the use of the main track will be\ngoverned by the Special Control System.",
        hash: "d582215891cb",
        page: 70
      },
      {
        id: "352",
        kind: "rule",
        number: "352",
        title: "Supervision",
        parent: "sec:special-control-system-scs-rules",
        text: "Movements and track work protection will, unless otherwise provided, be supervised by the RTC\nwho will issue instructions as may be required.",
        hash: "0a49ce0cf7c8",
        page: 70
      },
      {
        id: "353",
        kind: "rule",
        number: "353",
        title: "Scs Special Instructions",
        parent: "sec:special-control-system-scs-rules",
        text: "Special instructions necessary to govern this method of operation will be issued. Except as\naffected by such instructions and Rules 351 and 352, all Operating Rules remain in force.",
        hash: "2afddbe73a32",
        page: 70
      },
      {
        id: "360",
        kind: "rule",
        number: "360",
        title: "Application",
        parent: "sec:siding-control-territory-sct-rules",
        text: "Where specified by special instructions, the use of non-signalled sidings within CTC will be\ngoverned by the Siding Control Territory rules.",
        hash: "d6fd29021d88",
        page: 70
      },
      {
        id: "361",
        kind: "rule",
        number: "361",
        title: "Supervision",
        parent: "sec:siding-control-territory-sct-rules",
        text: "Movements, protection of track work and operation of track units will, unless otherwise provided, be\nsupervised by the RTC who will issue instructions as may be required.",
        hash: "254747384d6a",
        page: 70
      },
      {
        id: "362",
        kind: "rule",
        number: "362",
        title: "Clear Of Equipment",
        parent: "sec:siding-control-territory-sct-rules",
        text: "(a) Sidings will be considered as clear of equipment unless otherwise informed by the RTC.\n(b) Before permitting a movement to enter a siding occupied by other equipment, the RTC must\n    advise a member of the crew that other equipment occupies such siding.",
        hash: "9d86fc00e0e6",
        page: 70
      },
      {
        id: "362(a)",
        kind: "subrule",
        number: "362(a)",
        parent: "362",
        text: "Sidings will be considered as clear of equipment unless otherwise informed by the RTC.",
        hash: "9662905a8ec7"
      },
      {
        id: "362(b)",
        kind: "subrule",
        number: "362(b)",
        parent: "362",
        text: "Before permitting a movement to enter a siding occupied by other equipment, the RTC must advise a member of the crew that other equipment occupies such siding.",
        hash: "3b5da35fcc5f"
      },
      {
        id: "363",
        kind: "rule",
        number: "363",
        title: "Hand Operated Switches",
        parent: "sec:siding-control-territory-sct-rules",
        text: "Hand operated switches in sidings may be considered lined for the normal position unless advised\notherwise by the RTC, GBO or special instruction.",
        hash: "960818c73f06",
        page: 70
      },
      {
        id: "364",
        kind: "rule",
        number: "364",
        title: "Protection Of Track Work And Operation Of Track Units",
        parent: "sec:siding-control-territory-sct-rules",
        text: "A foreman must be in possession of a TOP for the protection of track work and operation of track\nunits. Rule 41/841 is not applicable.",
        hash: "4ded2b98ecc1",
        page: 70
      },
      {
        id: "401",
        kind: "rule",
        number: "401",
        title: "Location",
        parent: "sec:general-description-and-location-of-fixed-signals",
        text: "Wherever practicable, fixed signals other than switches will be located above, or to the right of, the\ntrack they govern. Where circumstances require that signals be otherwise placed, such conditions\nwill be indicated by GBO or special instructions.\nEXCEPTION: A block or interlocking signal that is required to be placed to the left of the track it\ngoverns need not be indicated by GBO or special instructions, provided that such location does not\nplace the signal to the right of another signalled track.",
        hash: "f449d38e322a",
        page: 71
      },
      {
        id: "401.1",
        kind: "rule",
        number: "401.1",
        title: "Signal Displayed",
        parent: "401",
        text: "The indications displayed on block and interlocking signals govern operation to the next signal or\nblock end sign. Except as otherwise specified in special instructions, a signal to leave the main\ntrack to enter non-main track applies to the block end sign or until the leading end of the movement\nhas passed entirely through the controlled location and entered non-main track. Speed\nrequirements protecting turnouts must be complied with until the entire movement has cleared the\nturnout.",
        hash: "f526fae03868",
        page: 71
      },
      {
        id: "401.2",
        kind: "rule",
        number: "401.2",
        title: "No Advance Signal",
        parent: "401",
        text: "At locations where there is no advance signal to the signal governing movements into CTC or\nmovements are re-entering CTC from a siding, all movements must approach the governing signal\npreparing to stop until it can be observed as displaying a more favourable indication than Stop.",
        hash: "983099de27d3",
        page: 71
      },
      {
        id: "402",
        kind: "rule",
        number: "402",
        title: "Positioning",
        parent: "sec:general-description-and-location-of-fixed-signals",
        text: "Where conditions allow, block and interlocking signal heads will be positioned with respect to the\ntracks on which they affect movements. Bridges, cantilevers, dummy masts and other structures\nwill be used and must be illustrated in company instructions to ensure proper understanding or\nsignal intent.",
        hash: "7cc487ca455d",
        page: 71
      },
      {
        id: "403",
        kind: "rule",
        number: "403",
        title: "Appearance Of Colour Light Signals",

      {
        id: "439",
        kind: "signal",
        number: "439",
        title: "Stop",
        parent: "sec:block-and-interlocking-signals",
        text: "Stop - Stop. OPTIONAL: Unless required to clear a switch, crossing, controlled location, or spotting passenger equipment on station platforms, a movement not authorized by Rule 564 must stop at least 300 feet in advance of the STOP signal.",
        hash: "aaa8ce183001"
      },
      {
        id: "440",
        kind: "rule",
        number: "440",
        title: "Direction Indicator",
        parent: "sec:block-and-interlocking-signals",
        text: "Flashing arrow indicators used in conjunction with block signals when illuminated, identify that the\nroute at the next controlled location is displaying a permissive signal and the route is lined and\nsecured as indicated by the direction of the arrow.\n\nExample:",
        hash: "ed36a7146975",
        page: 81
      },
      {
        id: "505",
        kind: "rule",
        number: "505",
        title: "Application",
        parent: "sec:automatic-block-signal-system-abs-rules",
        text: "Block signals govern the use of the blocks. They do not dispense with the use or observance of\nother signals whenever and wherever required and do not authorize main track occupancy.",
        hash: "f13f46b657d5",
        page: 82
      },
      {
        id: "507",
        kind: "rule",
        number: "507",
        title: "Withdrawal Of Signals",
        parent: "sec:automatic-block-signal-system-abs-rules",
        text: "When signals in ABS are withdrawn from service, movements will be governed by instructions from\nthe RTC or special instructions.",
        hash: "c275cb69559a",
        page: 82
      },
      {
        id: "509",
        kind: "rule",
        number: "509",
        title: "Instructions To Pass Signal Indicating Stop",
        parent: "sec:automatic-block-signal-system-abs-rules",
        text: "(a) A movement must have instructions from the RTC to pass a block signal indicating Stop. If\n    stopped at the signal indicating Stop, and no conflicting movement is evident, a crew member\n    must immediately communicate with the RTC.\n    EXCEPTION: Instructions are not required when a movement is required to re-enter a block\n    occupied by a portion of their movement, however, the movement must proceed at REDUCED\n    speed.\n(b) When able to, the RTC will inform the crew member in writing:\n    \u201CThere is no conflicting movement\u201D After complying with Rule 513 where applicable, the\n    movement need not stop at the signal but must positively identify the signal by number and the\n    movement may proceed at RESTRICTED speed to the next signal or Block End sign.\n(c) When unable to obtain the information that there is no conflicting movement in the block, and\n    no conflicting movement is evident, the movement may, after complying with Rule 513 where\n    applicable, move forward and must stop where its leading wheels are 100 feet past the Stop\n    signal. After waiting 10 minutes and if there is still no evidence of a conflicting movement, the\n    movement may proceed at RESTRICTED speed to the next signal or Block End sign.",
        hash: "fb2f46471186",
        page: 82
      },
      {
        id: "509(a)",
        kind: "subrule",
        number: "509(a)",
        parent: "509",
        text: "A movement must have instructions from the RTC to pass a block signal indicating Stop. If stopped at the signal indicating Stop, and no conflicting movement is evident, a crew member must immediately communicate with the RTC. EXCEPTION: Instructions are not required when a movement is required to re-enter a block occupied by a portion of their movement, however, the movement must proceed at REDUCED speed.",
        hash: "dc8a5ac731c4"
      },
      {
        id: "509(b)",
        kind: "subrule",

        hash: "6e9086bc2bf8"
      },
      {
        id: "509(c)",
        kind: "subrule",
        number: "509(c)",
        parent: "509",
        text: "When unable to obtain the information that there is no conflicting movement in the block, and no conflicting movement is evident, the movement may, after complying with Rule 513 where applicable, move forward and must stop where its leading wheels are 100 feet past the Stop signal. After waiting 10 minutes and if there is still no evidence of a conflicting movement, the movement may proceed at RESTRICTED speed to the next signal or Block End sign.",
        hash: "384012f3059f"
      },
      {
        id: "513",
        kind: "rule",
        number: "513",
        title: "Entering Main Track",
        parent: "sec:automatic-block-signal-system-abs-rules",
        text: "(a) Before entering or fouling a main track and no movement is observed approaching on the main\n    track, a crew member must reverse the switch and wait five minutes, unless a greater period is\n    specified in special instructions before allowing the movement to move foul of the main track.\n    The crew member must remain at the switch until the movement has entered the track. The\n    switch must be quickly restored to its normal position should an approaching movement on the\n    main track become evident.\n    When entry is to be made through a crossover, the switch in the track on which the movement\n    is standing is the only crossover switch to be reversed for the required waiting period.\n    EXCEPTION: The required waiting period need not be observed within cautionary limits or\n    when:\n    \u2022 an opposing movement has passed the switch and is still occupying the block;\n    \u2022 the crew entering the main track is in possession of a clearance to work; or\n    \u2022 the crew is relieved in writing by the RTC.\n    Before relieving a crew, the RTC must ensure that there are no movements operating in the\n    block that will approach the switch. The switch must be opened within 5 minutes after receiving\n    permission from the RTC.\n(b) A movement entering a block between signals, must move at RESTRICTED speed to the next\n    signal, unless or until the track is seen to be clear to the next signal and the indication of such\n    signal permits movement at other than RESTRICTED speed.",
        hash: "643870e20b9a",
        page: 82
      },
      {
        id: "513(a)",
        kind: "subrule",
        number: "513(a)",
        parent: "513",
        text: "Before entering or fouling a main track and no movement is observed approaching on the main track, a crew member must reverse the switch and wait five minutes, unless a greater period is specified in special instructions before allowing the movement to move foul of the main track. The crew member must remain at the switch until the movement has entered the track. The switch must be quickly restored to its normal position should an approaching movement on the main track become evident. When entry is to be made through a crossover, the switch in the track on which the movement is standing is the only crossover switch to be reversed for the required waiting period. EXCEPTION: The required waiting period need not be observed within cautionary limits or when: \u2022 an opposing movement has passed the switch and is still occupying the block; \u2022 the crew entering the main track is in possession of a clearance to work; or \u2022 the crew is relieved in writing by the RTC. Before relieving a crew, the RTC must ensure that there are no movements operating in the block that will approach the switch. The switch must be opened within 5 minutes after receiving permission from the RTC.",
        hash: "0764c74a38a1"
      },
      {
        id: "513(b)",
        kind: "subrule",
        number: "513(b)",
        parent: "513",
        text: "A movement entering a block between signals, must move at RESTRICTED speed to the next signal, unless or until the track is seen to be clear to the next signal and the indication of such signal permits movement at other than RESTRICTED speed.",
        hash: "41e16e2feb0b"
      },
      {
        id: "515",
        kind: "rule",
        number: "515",
        title: "Delayed In The Block",
        parent: "sec:automatic-block-signal-system-abs-rules",
        text: "When a movement, which has entered a block on signal indication permitting operation at other\nthan RESTRICTED speed, is stopped or otherwise delayed in the block, it must move at\nREDUCED speed to the next signal:\n(i) unless there are no switches between such movement and the next signal; or\n(ii) until the track is seen to be clear to the next signal.\nThe movement must approach the next signal prepared to stop and be governed by the indication\ndisplayed.",
        hash: "2e0ff13acaf6",
        page: 83
      },
      {
        id: "515(i)",
        kind: "subrule",
        number: "515(i)",
        parent: "515",
        text: "unless there are no switches between such movement and the next signal; or",
        hash: "42a087c45fdd"
      },
      {
        id: "515(ii)",
        kind: "subrule",
        number: "515(ii)",
        parent: "515",
        text: "until the track is seen to be clear to the next signal. The movement must approach the next signal prepared to stop and be governed by the indication displayed.",
        hash: "0408ad4443e0"
      },
      {
        id: "560",
        kind: "rule",
        number: "560",
        title: "Supervision And Application",
        parent: "sec:centralized-traffic-control-system-ctc-rules",
        text: "CTC is applicable in limits specified in the time table or special instructions and will be supervised\nby the RTC. Block signals will govern the operation of trains or transfers. The RTC will issue\ninstructions as required.",
        hash: "afd9dd6a52f5",
        page: 83
      },
      {
        id: "561",
        kind: "rule",
        number: "561",
        title: "Ctc Suspended",
        parent: "sec:centralized-traffic-control-system-ctc-rules",
        text: "When all or part of the CTC is withdrawn from service, trains and transfers will be governed by\nspecial instructions.",
        hash: "120cfc242635",
        page: 83
      },
      {
        id: "563",
        kind: "rule",
        number: "563",
        title: "Clearing Opposing Signals Into Non-Signalled Sidings",
        parent: "sec:centralized-traffic-control-system-ctc-rules",
        text: "(a) When two opposing train(s) or transfer(s) are to be lined into the same non-signalled siding,\n    each locomotive engineer must be advised of the fact before the signal to permit operation of\n    either train or transfer into the siding is requested.\n(b) At meeting points, the RTC must not line a train or transfer into a siding until the switch at the\n    opposite end of the siding is set for main track.\n    Note: This rule is not applicable where automated office control devices will not permit opposing\n    train(s) or transfer(s) to enter a non-signalled siding and at sidings where SCT is in effect.",
        hash: "37b11b10074a",
        page: 83
      },
      {
        id: "563(a)",
        kind: "subrule",
        number: "563(a)",
        parent: "563",
        text: "When two opposing train(s) or transfer(s) are to be lined into the same non-signalled siding, each locomotive engineer must be advised of the fact before the signal to permit operation of either train or transfer into the siding is requested.",
        hash: "cb4b7a37c2e7"
      },
      {

        parent: "563",
        text: "At meeting points, the RTC must not line a train or transfer into a siding until the switch at the opposite end of the siding is set for main track. Note: This rule is not applicable where automated office control devices will not permit opposing train(s) or transfer(s) to enter a non-signalled siding and at sidings where SCT is in effect.",
        hash: "f711b6989522"
      },
      {
        id: "564",

        number: "564",
        title: "Authority To Pass Stop Signal",
        parent: "sec:centralized-traffic-control-system-ctc-rules",
        text: "(a) A train or transfer must have authority to pass a block signal indicating Stop.\n(b) The RTC may authorize the train or transfer to pass the signal but before doing so must:\n    (i) ensure that there are no conflicting trains or transfers within, or authorized to enter, the\n         controlled block affected (other than one authorized by Rule 567, 567.3 or 577); and\n    (ii) provide protection against all opposing trains or transfers.\n(c) When signal blocking devices are used, they may be removed after the authorized train or\n    transfer has entered the controlled block affected. The RTC must not permit any opposing\n    trains or transfers to enter the controlled block until the authorized train or transfer has cleared\n    such block.\n(d) The train or transfer so authorized need not stop at the signal but must positively identify the\n    signal by number; operate at RESTRICTED speed to the next signal or Block End sign, and\n    must be governed by Rule 104.1 at spring switches, Rule 104.2 at dual control switches, Rule\n    104.3 at power-operated switches and Rule 611 at automatic interlockings.\n(e) When a known condition prevents clearing of controlled signals into an affected block, the RTC\n    may authorize operation at REDUCED speed to the next signal or Block End sign. The train or\n    transfer will be advised whether or not equipment is present in the block.\n    REDUCED speed remains applicable unless the block is known to be clear of equipment.\n    REDUCED speed commences when the leading piece of equipment has passed entirely\n    through the controlled location.\n\n    The train or transfer must approach the next signal prepared to stop and there be governed by\n    the indication displayed.\n(f) The authority granted and instructions must be in writing and, where applicable, specify the\n    route to be used. The locomotive engineer must be made aware of the route to be used before\n    moving.",

        title: "Work Authority",
        parent: "sec:centralized-traffic-control-system-ctc-rules",
        text: "(a) A train or transfer may be given work authority that permits moving in either direction within\n    specified limits.\n(b) Before issuing such authority the RTC must;\n    (i) ensure that there are no other trains or transfers within, or authorized to enter, the required\n         limits; and\n    (ii) block at Stop all devices controlling signals governing other trains or transfers into such\n         limits.\n(c) The RTC must maintain signal blocking against all trains or transfers and must not authorize\n    any other trains or transfers to enter the affected limits except as provided by Rule 567.3 or until\n    the work authority has been cancelled.\n(d) If work authority is cancelled while the train or transfer is within the affected limits, the conductor\n    or locomotive engineer must inform the RTC of their intended direction. The RTC must maintain\n    signal blocking against opposing trains or transfers until the protected train or transfer has\n    cleared the controlled block.\n(e) When the authority specifies: \u201CCall RTC               \u201D the conductor or locomotive engineer must\n    communicate with the RTC as instructed.\n(f) The authority granted and instructions must be in writing. The locomotive engineer must be\n    aware of the track limits before moving.\n(g) Controlled signals within the limits other than the entry and exit signals of the authority that are\n    indicating STOP may be considered as indicating \u201Cproceed at RESTRICTED speed\u201D.",

        title: "Signal Indication Suspended While Switching",
        parent: "566",
        text: "(a) A crew may be authorized to manually operate specific dual control switches at a controlled\n    location, as prescribed by Rule 104.2, paragraph (d). Such authority must be included with work\n    authority, as prescribed by Rule 566 or 567. The indications of signals governing operation over\n    such switches may be considered suspended while switches are in the \u201Chand\u201D position, but only\n    while switching is being performed at the designated controlled location. Signal indication or\n    Rule 564 must authorize the train or transfer into the controlled location, before being issued\n    the Rule 566/566.1 authority.\n    Verbal permission may be given to manually operate specific dual control switches within the\n    limits of Rules 566 or 567 authority that did not include Rule 566.1 authority for those switches.\n(b) When switching is to be performed over a spring switch, which is included in the limits of a work\n    authority prescribed by Rule 566 or 567, the indication of the signal governing operation over\n    such switch may be considered suspended, if the switch is properly lined.\n(c) When switching is to be performed at a controlled location that includes only a hand operated\n    switch, which is included in the limits of a work authority prescribed by Rule 566 or 567, the\n    indication of the signal governing operation through the controlled location may be considered\n    suspended but only when switching is being performed through that switch.",

        text: "(a) A train or transfer may be authorized to enter or move within the limits of a TOP when\n    instructed to protect against the foreman within specified limits.\n    \u201CProtect against foreman (name) between (location) and (location).\u201D\n(b) The conductor and locomotive engineer must be made aware of the authority granted and have\n    received instructions from the foreman before moving. The instructions must be repeated to,\n    and acknowledged by the foreman before being acted upon.\n(c) The RTC must not authorize another train or transfer or issue another TOP to apply, within the\n    protected limits granted under this rule until it has been fulfilled by the train or transfer having\n    cleared the limits, or the authority has been cancelled.\n(d) In addition to the permission and instructions received from a foreman to enter and/or move\n    within the limits, trains or transfers must also be authorized to enter the TOP limits under the\n    provisions of Rule 105(a), Rule 564 or Rule 568, or to reverse within the TOP limits under the\n    provisions of Rule 566.",

        kind: "rule",
        number: "567.3",
        title: "Proceeding Through Work Limits",
        parent: "567",
        text: "Trains or transfers may be authorized to enter or move within work limits of other trains or\ntransfers.\n(a) Each time a train or transfer is so authorized, the train or transfer must be restricted as follows:\n     \u201CProtect against work (number) between (location) and (location)\u201D.\n(b) A train or transfer authorized as outlined in paragraph (a) must not enter or move within the\n    working limits until a written understanding has been established with the conductor and\n    locomotive engineer or each train or transfer. This understanding must include information with\n    respect to the intended operation of each train or transfer and remain in place until the affected\n    train or transfer has left the working limits.\n(c) Prior to entering the limits, the train or transfer must also be authorized by signal indication or\n    under the provisions of rules 564 or 568.\n(d) When entry is to be provided by signal indication, the restriction may only be issued when the\n    train or transfer is within:\n    (i) two controlled blocks of the limits; or\n    (ii) 25 miles of the limits when there is no controlled block prior\n    The RTC must ensure the authorized train or transfer is the only one which will encounter the\n    signal governing entry into the limits.",

        text: "(a) A train or transfer must not foul or enter a main track, nor re-enter one after having cleared it,\n    except by signal indication or until permission has been received from the RTC.\n(b) When entry to the main track is to be made at a non-electrically locked hand operated switch, or\n    at a switch where the seal on the electric switch lock is broken, such permission from the RTC\n    must include the direction and route to be taken and must be in writing. The locomotive\n    engineer must be made aware of the circumstances before moving.\n    Before issuing such permission the RTC must;\n    (i) ensure that there are no conflicting trains or transfers within, or authorized to enter, the\n         controlled block affected; and\n    (ii) block at Stop all devices controlling signals governing trains or transfers into the affected\n         controlled block.\n\n(c) The RTC must maintain signal blocking and not permit any opposing train or transfer to enter\n    the controlled block until the protected train or transfer has cleared the controlled block. Signal\n    blocking against following trains or transfers must not be removed nor may following trains or\n    transfers be permitted to enter the controlled block until the conductor or locomotive engineer,\n    of the train or transfer being protected, has reported that the train or transfer has entered the\n    main track and is moving in the authorized direction.\nEXCEPTION: Permission is not required to enter or re-enter the main track at a hand operated\nswitch within the limits when authorized by Rule 566, 567 or 577.",

        parent: "568",
        text: "A train or transfer must not foul or enter a main track, nor re-enter one after having cleared it, except by signal indication or until permission has been received from the RTC.",
        hash: "cef76020bae1"
      },
      {
        id: "568(b)",
        kind: "subrule",
        number: "568(b)",
        parent: "568",
        text: "When entry to the main track is to be made at a non-electrically locked hand operated switch, or at a switch where the seal on the electric switch lock is broken, such permission from the RTC must include the direction and route to be taken and must be in writing. The locomotive engineer must be made aware of the circumstances before moving. Before issuing such permission the RTC must;",
        hash: "b5a9ddcd0d8c"
      },
      {
        id: "568(b)(i)",
        kind: "subrule",
        number: "568(b)(i)",
        parent: "568(b)",
        text: "ensure that there are no conflicting trains or transfers within, or authorized to enter, the controlled block affected; and",

      {
        id: "568(b)(ii)",
        kind: "subrule",
        number: "568(b)(ii)",
        parent: "568(b)",
        text: "block at Stop all devices controlling signals governing trains or transfers into the affected controlled block.",
        hash: "6f992f4e80dd"
      },
      {
        id: "568(c)",
        kind: "subrule",
        number: "568(c)",
        parent: "568",
        text: "The RTC must maintain signal blocking and not permit any opposing train or transfer to enter the controlled block until the protected train or transfer has cleared the controlled block. Signal blocking against following trains or transfers must not be removed nor may following trains or transfers be permitted to enter the controlled block until the conductor or locomotive engineer, of the train or transfer being protected, has reported that the train or transfer has entered the main track and is moving in the authorized direction. EXCEPTION: Permission is not required to enter or re-enter the main track at a hand operated switch within the limits when authorized by Rule 566, 567 or 577.",
        hash: "badf46c618a4"
      },
      {
        id: "569",
        kind: "rule",
        number: "569",
        title: "Cancelling Authorities",
        parent: "sec:centralized-traffic-control-system-ctc-rules",
        text: "(a) Authority or permission granted by Rules 564, 567.3 or 568 may be cancelled provided the train\n    or transfer has not entered the controlled block affected.\n(b) When authority granted by Rules 564, 566, 567, 567.1, 567.2, 567.3 or 577 or the permission in\n    writing granted by Rule 568 is cancelled, the cancellation does not take effect until it has been\n    correctly repeated and acknowledged by the conductor and locomotive engineer of the train or\n    transfer affected. These employees must acknowledge the cancellation by repeating the\n    authority number, \u201Ccancelled\u201D and initials of the RTC to the RTC.",

        kind: "subrule",
        number: "569(a)",
        parent: "569",
        text: "Authority or permission granted by Rules 564, 567.3 or 568 may be cancelled provided the train or transfer has not entered the controlled block affected.",

      {
        id: "570",
        kind: "rule",
        number: "570",
        title: "Entering Between Signals",
        parent: "sec:centralized-traffic-control-system-ctc-rules",
        text: "(a) A train or transfer that has entered a block between signals at a hand operated switch,\n    equipped with an electric switch lock, must approach the next signal prepared to stop, unless or\n    until the track is seen to be clear to the next signal and such signal displays a more favourable\n    indication than Stop or Stop and Proceed.\n(b) When entry to a block is made at a switch not equipped with an electric switch lock, or one\n    where the seal on the electric switch lock is broken, a train or transfer must operate at\n    RESTRICTED speed to the next signal, unless or until the track is seen to be clear to the next\n    signal, and the indication of such signal permits operation at other than RESTRICTED speed.\n(c) A train or transfer that has entered a block, where it has been necessary to activate the\n    emergency release of an electric switch lock, must move at RESTRICTED speed to the next\n    signal.",
