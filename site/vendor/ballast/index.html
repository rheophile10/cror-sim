    const raw = { items: JSON.parse(atob(rec.tgbo.split("\n\n")[1].replace(/-----END[\s\S]*$/, "").replace(/\s+/g, ""))).items };
    const canvas = h("canvas", { width: 900, height: 700, style: { width: "100%", border: "1px solid #ddd" } });
    const order = r.attempt.events.filter((e) => e[1] === "show").map((e) => e[2]).filter((v, i, a) => a.indexOf(v) === i);
    let cursor = r.attempt.events.length;
    const slider = h("input", { type: "range", min: 0, max: r.attempt.events.length, value: cursor, oninput: (e) => {
      cursor = Number(e.target.value);
      paint();
    } });
    const info = h("p", { class: "small" });
    const paint = async () => {
      const st = fold(order, r.attempt.events.slice(0, cursor));
      const id = order[st.at];
      if (!id) return;
      const item = await openItem(rec, raw, id);
      if (item.pairs?.length) item.rights = item.pairs.map((p) => ({ id: p.id, text: p.right }));
      drawItem(canvas, item, { answer: st.answers[id], images: await imagesFor(item), watermark: "REVIEW", index: st.at, count: order.length });
      const ev = r.attempt.events[cursor - 1];
      info.textContent = ev ? `event ${cursor}/${r.attempt.events.length}: ${ev[1]} ${ev[2] ?? ""} at +${Math.round((ev[0] - r.attempt.started) / 1e3)}s` : "";
    };
    paint();
    return h(
      "div",
      {},
      h("button", { onclick: () => {
        view = null;
        rerender();
      } }, "\u2190 back"),
      h("h2", {}, `CN ${r.pin} ${r.name} \u2014 ${rec.title}: ${s.score}/${s.total} (${Math.round(s.grade * 100)}%)`),
      h("h2", {}, "Answers"),
      h("table", {}, test.items.map((it) => {
        const a = r.attempt.answers[it.id];
        const pi = s.perItem.find((x) => x.id === it.id);
        return h(
          "tr",
          {},
          h("td", { class: "small" }, it.id, h("br"), it.ref.join(", ")),
          h("td", {}, it.prompt.split("\n")[0].slice(0, 90)),
          h("td", {}, it.type === "short" ? h("div", {}, h("div", {}, h("b", {}, "answer: "), a || "\u2014"), h("div", { class: "small" }, h("b", {}, "model: "), it.answer), h("label", {}, "mark ", h("input", { type: "number", min: 0, max: it.worth, step: 0.5, value: marks[it.id] ?? "", style: { width: "70px" }, onchange: (e) => {
            marks[it.id] = Number(e.target.value);
            rerender();
          } }))) : it.type === "match" ? Object.entries(a || {}).map(([l, rr]) => `${l}\u2192${rr} `).join("") || "\u2014" : `${a ?? "\u2014"} (key ${it.key})`),
          h("td", { class: pi.pending ? "status" : pi.got === pi.worth ? "good" : "bad" }, pi.pending ? "unmarked" : `${pi.got}/${pi.worth}`)
        );
      })),
      h("h2", {}, "Breaks"),
      r.attempt.breaks?.length ? h("ul", {}, r.attempt.breaks.map((b) => h("li", {}, `${b.why} for ${Math.round(b.ms / 1e3)} s at +${Math.round((b.at - r.attempt.started) / 1e3)} s`))) : h("p", {}, "none"),
      h("h2", {}, "Playback"),
      slider,
      info,
      canvas
    );
  };
  var root;
  var go;
  var rerender = () => render(root, {}, go);
  var render = async (r, ctx2, g) => {
    root = r;
    go = g;
    if (ctx2.fresh && !sheet) {
      const name = prompt("RTC name or initials (goes on every Complete)") || "RTC";
      sheet = await newSheet(name);
      note("new sheet");
    }
    if (ctx2.sheetText) {
      const pw = prompt("Sheet passphrase");
      if (pw == null) return go({ screen: "home" });
      try {
        sheet = await openSheet(ctx2.sheetText, pw);
        pass = pw;
        note(`opened sheet for ${sheet.rtc.name}`);
      } catch (e) {
        return go({ screen: "home", error: e.message });
      }
    }
    if (!sheet) return mount(root, h("h1", {}, "RTC"), h("p", {}, "Open a sheet (.bed) from the home page, or start a new one."), h("button", { onclick: () => go({ screen: "rtc", fresh: true }) }, "New sheet"), h("button", { onclick: () => go({ screen: "home" }) }, "Home"));
    sheet.marks ?? (sheet.marks = {});
    sheet.releases ?? (sheet.releases = []);
    sheet.assets ?? (sheet.assets = {});
    if (ctx2.incoming) {
      await intake(ctx2.incoming);
      ctx2.incoming = null;
    }
    const save = async () => {
      if (!pass) {
        pass = prompt("Choose a passphrase for this sheet (you will need it every time)") || "";
        if (!pass) return;
      }
      const { draft, ...persist } = sheet;
      for (const t of persist.tgbos) delete t._test;
      download(`${sheet.rtc.name.replace(/\W+/g, "-")}.bed`, await saveSheet(persist, pass));
      note("sheet saved");
      rerender();
    };
    const takeFiles = async (files) => {
      const items = [];
      for (const f of files) {
        if (/\.png$/i.test(f.name)) {
          const t = badgeRead(await readFileBytes(f));
          items.push(t ? { name: f.name, text: t } : { name: f.name, asset: f });
        } else if (/\.(jpe?g|gif|webp)$/i.test(f.name)) items.push({ name: f.name, asset: f });
        else {
          const text2 = await readFileText(f);
          items.push(sniff(text2) ? { name: f.name, text: text2 } : { name: f.name, text: text2, source: true });
        }
      }
      await intake(items);
      rerender();
    };
    const drop = h(
      "div",
      { class: "drop", ondragover: (e) => {
        e.preventDefault();
        drop.classList.add("over");
      }, ondragleave: () => drop.classList.remove("over"), ondrop: (e) => {
        e.preventDefault();
        drop.classList.remove("over");
        takeFiles(e.dataTransfer.files);
      } },
      "Drop badges, test sources, images, releases here",
      h("br"),
      h("label", { class: "btn", style: { marginTop: "8px", display: "inline-block" } }, "Choose files", h("input", { type: "file", multiple: true, style: { display: "none" }, onchange: (e) => takeFiles(e.target.files) }))
    );
    const paste = h("textarea", { rows: 3, placeholder: "Or paste CREW / RELEASE text\u2026" });
    mount(
      root,
      h("div", { class: "bar" }, h("span", {}, `RTC ${sheet.rtc.name}`), h("span", {}, `${sheet.trains.length} trains \xB7 ${sheet.tgbos.length} TGBOs \xB7 ${sheet.releases.length} releases`), h("button", { onclick: save }, "Save sheet (.bed)")),
      h("div", { class: "row" }, drop),
      h("div", { class: "row" }, paste, h("button", { onclick: async () => {
        await intake([{ name: "pasted", text: paste.value }]);
        paste.value = "";
        rerender();
      } }, "Take")),
      notes.length ? h("ul", { class: "small" }, notes.map((n) => h("li", { class: n.bad ? "bad" : "" }, n.m))) : null,
      view ? reviewView() : h(
        "div",
        {},
        h("div", { class: "tabs" }, ["trains", "tests", "releases"].map((t) => h("button", { class: tab === t ? "on" : "", onclick: () => {
          tab = t;
          rerender();
        } }, t[0].toUpperCase() + t.slice(1)))),
        tab === "trains" ? trainsTab() : tab === "tests" ? testsTab() : releasesTab()
      ),
      h("p", { class: "small" }, h("button", { onclick: () => go({ screen: "home" }) }, "Home"))
    );
  };

  // src/app/main.js
  var root2 = document.querySelector("main");
  var ctx = { screen: "home" };
  var go2 = (next) => {
    ctx = next;
    render2();
  };
  var openText = async (text2, name = "") => {
    const kind = sniff(text2);
    if (kind === "TGBO") return go2({ screen: "copy", text: text2 });
    if (kind === "CANCEL") return go2({ screen: "cancel", text: text2 });
    if (kind === "SHEET") return go2({ screen: "rtc", sheetText: text2 });
    if (kind === "RELEASE" || kind === "CREW") return go2({ screen: "rtc", incoming: [{ name, text: text2 }] });
    if (/^#|\n---/.test(text2)) return go2({ screen: "rtc", incoming: [{ name, text: text2, source: true }] });
    go2({ screen: "home", error: `Not a Ballast file${name ? ": " + name : ""}` });
  };
  var openFiles = async (files) => {
    const list = [...files];
    if (!list.length) return;
    const texts = [];
    for (const f of list) {
      if (/\.png$/i.test(f.name)) {
        const t = badgeRead(await readFileBytes(f));
        if (t) texts.push({ name: f.name, text: t });
        else texts.push({ name: f.name, error: "badge has no crew data (re-encoded?)" });
      } else if (/\.(jpe?g|gif|webp|svg)$/i.test(f.name)) texts.push({ name: f.name, asset: f });
      else texts.push({ name: f.name, text: await readFileText(f) });
    }
    if (texts.length === 1 && texts[0].text) return openText(texts[0].text, texts[0].name);
    go2({ screen: "rtc", incoming: texts.map((t) => t.text && /^#|\n---/.test(t.text) && !sniff(t.text) ? { ...t, source: true } : t) });
  };
  var renderHome = () => {
    const paste = h("textarea", { rows: 5, placeholder: "Or paste a Ballast file here (TGBO, RELEASE, CANCEL, SHEET, CREW)\u2026" });
    const drop = h(
      "div",
      { class: "drop", ondragover: (e) => {
        e.preventDefault();
        drop.classList.add("over");
      }, ondragleave: () => drop.classList.remove("over"), ondrop: (e) => {
        e.preventDefault();
        drop.classList.remove("over");
        openFiles(e.dataTransfer.files);
      } },
      "Drop a file here",
      h("br"),
      h("label", { class: "btn", style: { marginTop: "10px", display: "inline-block" } }, "Choose files", h("input", { type: "file", multiple: true, onchange: (e) => openFiles(e.target.files), style: { display: "none" } }))
    );
    mount(
      root2,
      h("h1", {}, "Ballast"),
      h("p", { class: "small" }, "A test that stays on the rails. Nothing leaves this page."),
      ctx.error ? h("p", { class: "bad" }, ctx.error) : null,
      drop,
      paste,
      h("div", { class: "row" }, h("button", { onclick: () => paste.value.trim() && openText(paste.value) }, "Open pasted text")),
      h("h2", {}, "Trains"),
      h("div", { class: "row" }, h("button", { onclick: () => go2({ screen: "register" }) }, "Register crew (make a badge)")),
      h("h2", {}, "RTC"),
      h("div", { class: "row" }, h("button", { onclick: () => go2({ screen: "rtc", fresh: true }) }, "Open the desk (new sheet)")),
      h("p", { class: "small" }, "Trains: register once, send your badge, drop the TGBO your RTC sends you. RTC: open a sheet, add badges, load a test, issue the TGBO, drop the releases.")
    );
  };
  var render2 = async () => {
    switch (ctx.screen) {
      case "home":
        return renderHome();
      case "register":
        return renderRegister(root2, go2);
      case "registered":
        return renderRegistered(root2, ctx, go2);
      case "copy":
        return renderCopy(root2, ctx, go2);
      case "work":
        return renderWork(root2, ctx, go2);
      case "released":
        return renderReleased(root2, ctx, go2);
      case "cancel":
        return renderCancel(root2, ctx, go2);
      case "rtc":
        return render(root2, ctx, go2);
      default:
        return renderHome();
    }
  };
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => e.preventDefault());
  render2();
})();
</script>
