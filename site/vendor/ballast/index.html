      h("div", { class: "row" }, h("button", { onclick: () => paste.value.trim() && openText(paste.value) }, "Open"), h("label", { class: "btn" }, "Choose a file", h("input", { type: "file", style: { display: "none" }, onchange: (e) => openFiles(e.target.files) })))
    );
    return drop;
  };
  var renderWaiting = async (p) => {
    const text2 = await profileText({ ...p, role: "none", minted: void 0 });
    const root_ = () => go3({ screen: "home" });
    mount(
      root3,
      h("h1", {}, "Registered \u2014 waiting for a role"),
      profileCard(p, text2),
      h("p", {}, "Send this registration to your RTC (a crew role) or to the superintendent (an RTC role). They send back your profile; drop it here."),
      h("textarea", { readonly: true, rows: 6, value: text2 }),
      ctx.error ? h("p", { class: "bad" }, ctx.error) : null,
      dropBox("Drop or paste the profile you get back"),
      exerciseBox(go3),
      h(
        "details",
        {},
        h("summary", { class: "small" }, "Nobody to mint me"),
        h("p", { class: "small" }, "The first superintendent mints themself. Only do this if you are running the program."),
        h("button", { onclick: async () => {
          const m = await mintProfile({ ...p, role: "superintendent" }, p, "superintendent");
          await set("profile", { ...p, ...m });
          root_();
        } }, "Start as superintendent")
      )
    );
  };
  var renderReaderScreen = async (p) => {
    const doc = await getDocument(ctx.doc);
    if (!doc) return mount(root3, h("h1", {}, "Rulebook"), h("p", {}, "No rulebook is loaded in this browser. Get cror-2025.json from the Reader page (Document out) and drop it here; it stays in this browser. Notes files (from the reader's Notes out) drop here too."), dropBox("Drop cror-2025.json here"), h("button", { onclick: () => go3({ screen: "home" }) }, "Back"));
    renderReader(root3, { doc, notes: await getNotes(doc.id), onNotes: (n) => setNotes(doc.id, n), onDocument: async (d) => {
      await saveDocument(d);
      go3({ screen: "reader", doc: d.id });
    }, by: p.name, at: ctx.at || null, onClose: () => go3({ screen: "home" }) });
  };
  var render3 = async () => {
    const p = await me2();
    announce(ctx.screen, p);
    if (ctx.screen === "landing" || !p && ctx.screen === "home") return renderRegister(root3, async (np) => {
      await set("profile", np);
      go3({ screen: "home" });
    });
    if (ctx.screen === "reader" && p) return renderReaderScreen(p);
    if (p && (p.role === "none" || !p.minted) && !["work", "practice", "marks", "released"].includes(ctx.screen)) return renderWaiting(p);
    switch (ctx.screen) {
      case "home":
        return p.role === "rtc" ? render(root3, ctx, go3) : p.role === "superintendent" ? render2(root3, ctx, go3) : renderHome(root3, go3, dropBox);
      case "copy":
        return renderCopy(root3, ctx, go3);
      case "practice":
        return renderCopy(root3, { practice: true, source: ctx.source }, go3);
      case "work":
        return renderWork(root3, ctx, go3);
      case "released":
        return renderReleased(root3, ctx, go3);
      case "cancel":
        return renderCancel(root3, ctx, go3);
      case "marks":
        return renderMarks(root3, ctx, go3);
      case "rtc":
        return render(root3, ctx, go3);
      case "super":
        return render2(root3, ctx, go3);
      default:
        return go3({ screen: "home" });
    }
  };
  document.body.prepend(h(
    "nav",
    { class: "top" },
    h("a", { href: "#", onclick: (e) => {
      e.preventDefault();
      go3({ screen: "home" });
    } }, "Ballast"),
    " \xB7 ",
    embedded() || location.protocol === "file:" ? null : h("a", { href: location.pathname.split("/").pop() || "index.html", download: "ballast.html", class: "small", style: { marginRight: "12px" }, title: "Save this page as one file, ballast.html, e.g. on a shared drive \u2014 the recommended way to run it" }, "Save a copy"),
    h("a", { href: "#", class: "small", style: { marginRight: "12px" }, onclick: (e) => {
      e.preventDefault();
      go3({ screen: "reader" });
    } }, "Rulebook"),
    embedded() ? null : h("a", { href: /\/ballast\//.test(location.pathname) ? "../tutorial/" : "tutorial/", class: "small", style: { marginRight: "12px" } }, "Tutorial"),
    h("a", { href: "#", onclick: async (e) => {
      e.preventDefault();
      if (confirm("Forget this browser's profile and keys? Any role minted to them is lost.")) {
        await del("profile");
        go3({ screen: "landing" });
      }
    } }, "forget me")
  ));
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => e.preventDefault());
  listen((text2, name) => openText(text2, name));
  try {
    const bc = new BroadcastChannel("ballast");
    bc.addEventListener("message", (e) => {
      if (e.data?.type === "busy") mount(root3, h("h1", {}, "A test is in progress in another tab"), h("p", {}, "Close this tab and return to it. Opening this tab was recorded on that attempt."));
    });
    bc.postMessage({ type: "hello", tab: "new" });
  } catch {
  }
  render3();
})();
</script>
