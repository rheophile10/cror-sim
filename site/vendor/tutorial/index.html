n hash once, keep, and open in 2056.\n\nTHE MARK IS FOR YOUR ANSWERS\nWhen you release, your answers are sealed to the RTC and signed with your\nown key, and Ballast shows you the file's SHA-256 -- your receipt. The\ncancellation that comes back is signed by the RTC, names that hash, and\nrepeats your answers as marked, item by item. If the hash is not yours or\nthe signature is bad, the marks are not for what you released, and the\nsuperintendent who approved the test can re-score your release from a copy\nsealed to them, with no help from the RTC. Nobody can quietly change\neither side of the mark.\n\nNO NETWORK, NO LATENCY\nThere is no server to reach, so there is nothing to time out. The test is\na file already on your machine before you start; the clock is your\nmachine's; every answer is recorded locally the moment you give it; the\nrelease is written when you press the button, not when a request\ncompletes. A submission cannot be lost in transit, fail to post, or be\ncounted late because a page hung. If the building loses its network in\nthe last minute of a test, nothing happens.\n\nWHAT IT IS NOT\nIt is not a proctoring system. Once a question is on a screen it is\ncleartext for the person looking at it, and no software can stop them\nreading, remembering or photographing it. What Ballast does is keep the\nanswers out of the file, show one item at a time under fullscreen with\nthe keyboard locked, refuse copy and print, record every break, watermark\nevery frame with the writer's name, and sign everything that moves so\nthat a mark can always be traced back to the answers it was given for.\n";
