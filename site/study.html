<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Study aid · locked</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%92%3C/text%3E%3C/svg%3E"
    />
    <style>
      /*STYLE*/
      .lock { max-width: 22rem; }
      form { display: grid; gap: 0.6rem; margin-top: 1.25rem; }
      input {
        font: inherit; padding: 0.7rem 0.8rem; border-radius: 8px;
        border: 1px solid var(--line); background: var(--card); color: var(--ink);
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      button {
        font: inherit; font-weight: 600; padding: 0.7rem; border: 0; border-radius: 8px;
        background: var(--accent); color: var(--on-accent); cursor: pointer;
      }
      button:disabled, input:disabled { opacity: 0.6; cursor: progress; }
      #status { min-height: 1.4em; color: var(--muted); font-size: 0.9rem; margin: 0; }
      #status.bad { color: var(--bad); }
    </style>
  </head>
  <body>
    <main class="lock">
      <p class="eyebrow"><a href="../index.html">← cror.ca</a></p>
      <h1>Study aid</h1>
      <p class="lede">CN conductor study material. Enter the password to open it.</p>
      <form id="form" autocomplete="off">
        <input id="password" type="password" placeholder="Password" aria-label="Password" required autofocus />
        <button id="go" type="submit">Open</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script>
      /*UNLOCK*/
    </script>
  </body>
</html>
